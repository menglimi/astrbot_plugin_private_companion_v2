[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrbot-plugin-private-companion"
version = "7.0.0"
description = "我会永远陪着你 integrated companion host"
requires-python = ">=3.10"
dependencies = ["tzdata>=2025.2; sys_platform == 'win32'", "cryptography>=42", "lunarcalendar>=0.0.9", "regex>=2024.11.6", "numpy>=1.26", "sounddevice>=0.5", "soundfile>=0.13", "opencv-python-headless>=4.11,<4.12", "mijiaAPI==4.1.3", "fastmcp==3.4.2", "mcp>=1.26,<2"]

[tool.setuptools.packages.find]
include = ["companion_v2*"]
