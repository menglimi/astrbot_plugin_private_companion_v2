  <script>
    /* 主题引导：在样式生效前应用已保存的显示维度，避免刷新时的主题闪烁。
       与 product-page.js 的 appearance 存储保持同一组键，读取失败时静默用默认值。

       这里刻意内联、不引 theme.js：引导必须在样式生效前跑完，多一个网络往返
       就会先画一帧默认主题再跳过去。下面是 theme.js 注册表的等价副本，
       两份必须一致——tests/test_theme_registry.cjs 会比对，改一处要改两处。 */
    (function(){
      try{
        var THEMES={courtyard:"day",dawn:"dawn",dusk:"dusk",night:"night",walnut:"dusk",contrast:"day"};
        var FALLBACK="courtyard";
        var LEGACY={mist:"dawn",grove:"courtyard",coral:"dusk",light:"dawn",dark:"night"};
        var root=document.documentElement;
        var read=function(key,allowed,fallback){
          var value=localStorage.getItem(key);
          return allowed.indexOf(value)>=0?value:fallback;
        };
        var theme=localStorage.getItem("companion-v2-theme")||"";
        theme=LEGACY[theme]||theme;
        root.dataset.theme=Object.prototype.hasOwnProperty.call(THEMES,theme)?theme:FALLBACK;
        root.dataset.density=read("companion-v2-density",["compact","standard","roomy"],"standard");
        root.dataset.radius=read("companion-v2-radius",["sharp","standard","round"],"standard");
        root.dataset.typeScale=read("companion-v2-type-scale",["s","m","l","xl"],"m");
        root.dataset.motion=read("companion-v2-motion",["full","low","off"],"full");
        /* 主题已在样式生效前写好，可以放行首屏。
           在此之前 body 保持 visibility:hidden，不出现默认主题一闪。 */
        root.dataset.themeReady="";
      }catch(_){document.documentElement.dataset.themeReady="";}
    })();
  </script>

  <!-- 小屋就绪闸门（见 tokens.css）。
       体素包 677 KB，它是首屏唯一一个「到了才能画」的资源：在它解析完之前，
       app.js 的 mountStage() 不会执行，.room-stage 是个空盒子。所以在这一行

       到期放行，由 mountStage() 的 catch 走降级视图。
       onload 必须写在这一行本身：defer 脚本按文档顺序执行，换成在末尾统一

  <!-- 页面桥 SDK 不在这里静态引入。
       `AstrBotPluginPage` 由宿主的页面桥脚本定义，但不同宿主对它的提供方式

       拉进来，两种情况都成立。见那里的注释。
       注意：这里**不能写出桥脚本的完整路径**。宿主注入前会先判断 HTML 里有没有
       这个字符串，有就跳过注入；而它注入的那条带 asset_token，页面自己猜的候选
       地址不带，端点无 token 直接 401。写在这里会让宿主跳过注入、页面又拉不到，
       整页连不上桥。 -->

<script>
(function(){
  var marks = [];
  var t0 = performance.timeOrigin || 0;
  function mark(name, extra){
    marks.push({ at: Math.round(performance.now()), name: name, extra: extra === undefined ? '' : String(extra) });
    document.documentElement.setAttribute('data-probe-n', String(marks.length));
  }
  window.__marks = marks;
  mark('probe-installed');

  // 1. html 属性（首屏闸门）写入时刻
  var mo = new MutationObserver(function(list){
    for (var i = 0; i < list.length; i++) {
      mark('attr:' + list[i].attributeName, document.documentElement.getAttribute(list[i].attributeName));
    }
  });
  mo.observe(document.documentElement, {attributes: true, attributeFilter: ['data-theme-ready','data-room-ready','data-room-asset','data-motion']});

  // 2. 体素包挂载
  var realRoom;
  Object.defineProperty(window, 'PrivateCompanionHomeRoom3D', {
    configurable: true,
    get: function(){ return realRoom; },
    set: function(value){
      mark('voxel-bundle-defined');
      realRoom = value;
      if (value && typeof value.mount === 'function') {
        var orig = value.mount;
        value.mount = function(el, opts){
          mark('voxel-mount:start');
          var ctrl = orig.call(this, el, opts);
          mark('voxel-mount:end');
          return ctrl;
        };
      }
    }
  });

  // 3. 入场序列
  var realEntrance;
  Object.defineProperty(window, 'CompanionEntrance', {
    configurable: true,
    get: function(){ return realEntrance; },
    set: function(value){
      realEntrance = value;
      if (value && typeof value.run === 'function') {
        var orig = value.run;
        value.run = function(ctrl, host, options){
          var wrapped = Object.assign({}, options || {});
          wrapped.onPhase = function(phase){
            mark('phase:' + phase);
            if (options && options.onPhase) options.onPhase(phase);
          };
          mark('entrance:run');
          return orig.call(this, ctrl, host, wrapped);
        };
      }
    }
  });

  // 4. 每帧轮询可见性 / canvas / is-entrance
  var seen = {};
  function note(key, value){ if (seen[key] === value) return; seen[key] = value; mark(key, value); }
  function poll(){
    var body = document.body;
    if (body) {
      var vis = getComputedStyle(body).visibility;
      note('body-visibility', vis);
      note('body-class', body.classList.contains('is-entrance') ? 'is-entrance' : (body.classList.contains('entrance-settled') ? 'settled' : 'plain'));
    }
    var room = document.querySelector('[data-voxel-room]');
    note('canvas', room && room.querySelector('canvas') ? 'present' : 'absent');
    var rail = document.querySelector('.rail');
    note('rail', rail ? (getComputedStyle(rail).opacity) : 'absent');
    var stage = document.querySelector('.stage-region');
    note('stage-opacity', stage ? getComputedStyle(stage).opacity : 'absent');
    requestAnimationFrame(poll);
  }
  requestAnimationFrame(poll);

  // 5. 结束：把 marks 写进 body 的一个 data 属性
  setTimeout(function(){
    var lines = window.__marks.map(function(m){ return m.at + ' ' + m.name + (m.extra ? '=' + m.extra : ''); });
    document.body.setAttribute('data-timeline', lines.join(' | '));
    document.title = 'TIMELINE-DONE';
  }, 12000);
})();
</script>
