  <script>
    /* 主题引导：在样式生效前应用已保存的显示维度，避免刷新时的主题闪烁。
       与 product-page.js 的 appearance 存储保持同一组键，读取失败时静默用默认值。

       这里刻意内联、不引 theme.js：引导必须在样式生效前跑完，多一个网络往返
       就会先画一帧默认主题再跳过去。下面是 theme.js 注册表的等价副本，
       两份必须一致——tests/test_theme_registry.cjs 会比对，改一处要改两处。 */
    (function(){
      try{
        var THEMES={courtyard:"day",dawn:"dawn",dusk:"dusk",night:"night",walnut:"dusk",contrast:"day"};
        var FALLBACK="courtyard";
        var LEGACY={mist:"dawn",grove:"courtyard",coral:"dusk",light:"dawn",dark:"night"};
        var root=document.documentElement;
        var read=function(key,allowed,fallback){
          var value=localStorage.getItem(key);
          return allowed.indexOf(value)>=0?value:fallback;
        };
        var theme=localStorage.getItem("companion-v2-theme")||"";
        theme=LEGACY[theme]||theme;
        root.dataset.theme=Object.prototype.hasOwnProperty.call(THEMES,theme)?theme:FALLBACK;
        root.dataset.density=read("companion-v2-density",["compact","standard","roomy"],"standard");
        root.dataset.radius=read("companion-v2-radius",["sharp","standard","round"],"standard");
        root.dataset.typeScale=read("companion-v2-type-scale",["s","m","l","xl"],"m");
        root.dataset.motion=read("companion-v2-motion",["full","low","off"],"full");
        /* 主题已在样式生效前写好，可以放行首屏。
           在此之前 body 保持 visibility:hidden，不出现默认主题一闪。 */
        root.dataset.themeReady="";
      }catch(_){document.documentElement.dataset.themeReady="";}
    })();
  </script>
  <script>
    /* 先随机挑一张启动动图。真正的 src 放在 body 里的 inert template 中，
       让宿主页面服务能把它改写成带插件路径和 asset_token 的地址；不能在这里
       直接给 img.src 写相对路径，因为内联脚本里的字符串不会经过宿主改写。 */
    (function(){
      var root=document.documentElement;
      var reduceMotion=root.dataset.motion==="low"||root.dataset.motion==="off"
        ||(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
      if(reduceMotion)return;
      var choices=[
        "assets/room-loading-tea-coffee.gif?v=boot-gif-once-20261001",
        "assets/room-loading-mug.gif?v=boot-gif-once-20261001"
      ];
      root.dataset.roomBootGif=choices[Math.floor(Math.random()*choices.length)];
    })();
  </script>

  <!-- 小屋就绪闸门（见 tokens.css）。
       体素包 677 KB，它是首屏唯一一个「到了才能画」的资源：在它解析完之前，

       绑定的话，包可能在监听挂上之前就已经加载完了（缓存命中时几乎必然如此），
       那放行就永远等不到。 -->
  <!-- 页面桥 SDK 不在这里静态引入。
       `AstrBotPluginPage` 由宿主的页面桥脚本定义，但不同宿主对它的扩展式
       不一样：有的在重写 HTML 时自动补这条脚本，有的要页面自己引。静态引
       一遍会在自动注入的宿主里加载两次。
       所以改由 product-page.js 的 requestBridgeSdk() 处理：先等，等不到再自己
       拉进来，两种情况都成立。见那里的注释。
       注意：这里**不能写出桥脚本的完整路径**。宿主注入前会先判断 HTML 里有没有
       这个字符串，有就跳过注入；而它注入的那条带 asset_token，页面自己猜的候选
       地址不带，端点无 token 直接 401。写在这里会让宿主跳过注入、页面又拉不到，
       整页连不上桥。 -->
  <!-- 体素包 677 KB，是首屏唯一「到了才画得出小屋」的资源：在它解析完之前
       mountStage() 不会执行，入场序列也就无从开始。预声明让它与 HTML 同时
       开始下载，而不是排在 lucide 之后才轮到——代价只是多一条 link。
       地址（含 ?v=）必须与下面那条 script 完全一致，否则会被当成两个资源，
       反而下载两遍。 -->
  <link rel="preload" href="assets/voxel-room.js?v=home-v2-entrance-20260930" as="script">

  <script>
    /* 兜底放行。
     *
     * 普通开场约 2830ms，状态页搭建约 3830ms；这里留 7 秒余量。
     *
     * 注意「放行」的语义已经在 2026-09-30 改过：它不再由入场**结束**触发，
     * 而是由入场**启动**触发（见 app.js 的 startEntrance）。现在这条只在
     * 入场根本没启动时兜底——体素包拦截、尺寸不可测、脚本缺失——那时
     * 页面已经在启动幕上停着了，所以要给宽，宁可多等两秒也不要卡在看不见
     * 的界面上。
     *
     * 正常路径不走这里：入场启动后 app.js 的 ready 回调会放行，
     * settleEntrance() 只负责收尾并再次幂等写入。
     * 这条只在入场根本没启动（体素包没到、尺寸不可测、入口脚本缺失）时兜底，
     * 所以宁可给宽——卡在一个看不见的界面上比多等两秒糟得多。 */
    setTimeout(function(){document.documentElement.dataset.roomReady="";},7000);
  </script>

<body>
  <!-- 启动幕：首屏闸门（tokens.css 的 data-room-ready）在体素包解析完之前
       一直关着，那段时间 body 是 visibility:hidden。这一层靠自己的
       visibility:visible 在闸门关闭期间照样显示，把空白等待填成
       「正在打开小屋」。写死在 HTML 里而不是由 JS 创建，是为了让它跟着
       文档一起到达——由脚本补的话，它自己也要等脚本，等于没补。
       样式见 entrance.css 的 .room-boot。 -->
  <div class="room-boot" aria-hidden="true">
    <div class="room-boot-visual" aria-hidden="true">
      <span class="room-boot-glow"></span>
      <img id="roomBootGif" class="room-boot-gif" alt="" hidden>
      <!-- template 内的静态 src 会由宿主改写；template 本身不会提前请求两张图。 -->
      <template id="roomBootGifTea" data-room-boot-gif="assets/room-loading-tea-coffee.gif?v=boot-gif-once-20261001">
        <img class="room-boot-gif" src="assets/room-loading-tea-coffee.gif?v=boot-gif-once-20261001" alt="">
      </template>
      <template id="roomBootGifMug" data-room-boot-gif="assets/room-loading-mug.gif?v=boot-gif-once-20261001">
        <img class="room-boot-gif" src="assets/room-loading-mug.gif?v=boot-gif-once-20261001" alt="">
      </template>
    </div>
    <span class="room-boot-text">正在打开小屋…</span>
  </div>
  <script>
    (function(){
      var source=document.documentElement.dataset.roomBootGif;
      var image=document.getElementById("roomBootGif");
      if(!source||!image)return;
      var templates=document.querySelectorAll("template[data-room-boot-gif]");
      var selected=null;
      for(var i=0;i<templates.length;i++){
        if(templates[i].getAttribute("data-room-boot-gif")===source){
          selected=templates[i];
          break;
        }
      }
      var candidate=selected&&selected.content&&selected.content.firstElementChild;
      if(!candidate)return;
      /* candidate.src 已经是宿主改写后的绝对地址；用它预载，避免再次把
         未改写的相对字符串交给浏览器。随后克隆同一节点，复用缓存响应。 */
      var preload=document.createElement("link");
      preload.rel="preload";
      preload.as="image";
      preload.href=candidate.src;
      preload.setAttribute("fetchpriority","low");
      document.head.appendChild(preload);
      var clone=candidate.cloneNode(true);
      clone.id=image.id;
      clone.hidden=false;
      image.replaceWith(clone);
    })();
  </script>
