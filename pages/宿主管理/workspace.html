<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>账号与会话 · Companion V2</title>
  <link rel="stylesheet" href="style.css">
  <script src="/api/plugin/page/bridge-sdk.js" defer></script>
  <script src="app.js?v=role-topology-20261006" defer></script>
</head>
<body>
  <main class="shell">
    <header class="topbar"><span id="connection" class="connection" data-state="loading">连接中</span></header>

    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

    <section class="status-panel" aria-labelledby="status-heading" aria-busy="true">
      <div class="panel-heading"><div><h2 id="status-heading">等待读取状态</h2></div><button id="refresh" class="button button-quiet" type="button">刷新状态</button></div>
      <dl class="status-grid">
        <div><dt>运行范围</dt><dd id="profile">—</dd></div>
        <div><dt>运行状态</dt><dd id="runtime-state">—</dd></div>
        <div><dt>是否接收消息</dt><dd id="accepting">—</dd></div>
      </dl>
      <p id="safety-note" class="safety-note" hidden></p>
    </section>

    <section class="topology-panel" aria-labelledby="topology-heading">
      <div class="panel-heading topology-heading">
        <div>
          
          <h2 id="topology-heading">账号 → 角色 / 人格 → 会话窗口</h2>
          
        </div>
        <div class="topology-summary" aria-live="polite">
          <span id="topology-mode" class="topology-mode" data-state="loading">等待读取</span>
          <span id="topology-counts" class="topology-counts">—</span>
        </div>
      </div>
      <p id="topology-note" class="topology-note" hidden></p>
      <div class="topology-toolbar"><span id="directory-state" role="status"></span></div>
      <section class="binding-editor" aria-labelledby="binding-editor-heading">
        <div class="binding-editor-heading">
          <div><h3 id="binding-editor-heading">账号下的角色与人格</h3><p>读取 AstrBot 的账号和人格。将私聊、群聊人格归入同一角色，插件自动处理这些人格对应的会话窗口。</p></div>
          <label class="binding-filter"><input id="hide-unlinked-personas" type="checkbox" checked><span>隐藏未关联窗口的人格</span></label>
        </div>
        <div class="binding-editor-columns role-binding-layout">
          <div class="binding-editor-column"><div class="editor-column-head"><strong>Bot 账号</strong></div><div id="edit-accounts" class="account-binding-list"></div></div>
        </div>
        <div class="binding-footer"><span id="binding-check" role="status">读取配置中</span><button id="save-bindings" class="button button-primary" type="button" disabled>保存角色映射</button></div>
      </section>
      <div id="topology-empty" class="topology-empty" role="status" hidden>
        <strong>还没有账号与会话链路</strong>
        
      </div>
      <div id="topology-canvas" class="topology-canvas" hidden>
        <svg id="topology-links" class="topology-links" aria-hidden="true"></svg>
        <section class="topology-column" data-topology-column="accounts" aria-labelledby="topology-accounts-heading">
          <div class="topology-column-heading">
            <span class="topology-column-index">01</span>
            <span><strong id="topology-accounts-heading">AstrBot 账号</strong><small>平台与登录账号</small></span>
          </div>
          <div id="topology-accounts" class="topology-list"></div>
        </section>
        <section class="topology-column" data-topology-column="roles" aria-labelledby="topology-roles-heading">
          <div class="topology-column-heading">
            <span class="topology-column-index">02</span>
            <span><strong id="topology-roles-heading">角色 / 人格</strong><small>角色框分组 · 连线对应人格</small></span>
          </div>
          <div id="topology-roles" class="topology-list"></div>
        </section>
        <section class="topology-column" data-topology-column="sessions" aria-labelledby="topology-sessions-heading">
          <div class="topology-column-heading">
            <span class="topology-column-index">03</span>
            <span><strong id="topology-sessions-heading">会话窗口</strong></span>
          </div>
          <div id="topology-session-filters" class="topology-session-filters" role="group" aria-label="按会话类型筛选">
            <button class="topology-session-filter" type="button" data-session-filter="all" aria-pressed="true">全部</button>
            <button class="topology-session-filter" type="button" data-session-filter="private" aria-pressed="false">私聊</button>
            <button class="topology-session-filter" type="button" data-session-filter="group" aria-pressed="false">群聊</button>
          </div>
          <div id="topology-sessions" class="topology-list topology-session-list"></div>
          <nav id="topology-session-pagination" class="topology-pagination" aria-label="会话窗口分页" hidden>
            <button id="topology-session-prev" class="button button-quiet" type="button" data-disabled="true">上一页</button>
            <span id="topology-session-page" class="topology-pagination-label" role="status" aria-live="polite"></span>
            <button id="topology-session-next" class="button button-quiet" type="button" data-disabled="true">下一页</button>
          </nav>
        </section>
      </div>
      <section id="group-target-panel" class="group-target-panel" aria-labelledby="group-target-heading" hidden>
        <div class="panel-heading">
          <div><h3 id="group-target-heading">群聊目标</h3><p class="group-target-intro">仅明确启用的群会接入 V2。</p></div>
          <span id="group-target-count" class="group-target-count" aria-live="polite"></span>
        </div>
        <p id="group-target-note" class="group-target-note" role="status"></p>
        <div id="group-target-list" class="group-target-list"></div>
        <div class="group-target-footer"><span id="group-target-state" role="status"></span><button id="save-group-targets" class="button button-primary" type="button" disabled>保存群目标</button></div>
      </section>
      <section id="session-manager" class="session-manager" aria-labelledby="session-manager-heading" hidden>
        <div class="panel-heading"><h3 id="session-manager-heading"></h3><button id="close-session-manager" class="button button-quiet" type="button" aria-label="关闭详情" title="关闭">×</button></div>
        <p id="session-manager-meta" class="session-manager-meta"></p>
        <div id="session-manager-related" class="session-manager-related"></div>
        <button id="topology-pin-session" class="button button-quiet topology-pin-session" type="button" aria-pressed="false" hidden>置顶窗口</button>
        <section id="session-group-network" class="session-group-network" aria-labelledby="session-group-network-heading" hidden>
          <div class="group-network-heading"><h4 id="session-group-network-heading">群成员与关系网</h4><span id="session-group-network-counts"></span></div>
          <p id="session-group-network-state" class="group-network-state" role="status"></p>
          <div id="session-group-network-content" class="session-group-network-content"></div>
        </section>
        <p id="session-manager-state" role="status"></p>
      </section>
    </section>

  </main>
</body>
</html>
