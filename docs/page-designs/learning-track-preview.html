<!DOCTYPE html>
<html lang="zh-CN" data-theme="courtyard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习与反思 · 培育轨道（静态预览）</title>
<style>
/* tokens.css 的庭院与夜读两套，内联让预览自包含。
   真页面读 tokens.css，六套主题都能切；预览带两套足够看明暗对比。
   页面样式里没有一个写死的色值，所以明暗切换是整页跟着变。 */
[data-theme="courtyard"],
[data-theme="courtyard"]{
  /* 庭院 · 日间的清爽草绿与天光，是默认主题 */
  --t-canvas:#eef3ec;
  --t-surface:#fdfefb;
  --t-surface-soft:#f5f9f3;
  --t-surface-raised:#ffffff;
  --t-surface-sunken:#e3ebe0;
  --t-veil:rgba(253,254,251,.72);
  --t-text:#333a33;
  --t-text-strong:#212822;
  --t-text-soft:#616b60;
  --t-text-faint:#828c80;
  --t-text-invert:#fdfefb;
  --t-accent:#4a7c50;
  --t-accent-hover:#3a6540;
  --t-accent-quiet:#e6efe4;
  --t-accent-ink:#3b6541;
  --t-accent-solid:#46754c;
  --t-accent-solid-hover:#375e3d;
  --t-on-solid:#fdfefb;
  --t-line:rgba(74,90,74,.14);
  --t-line-firm:rgba(74,90,74,.26);
  --t-ok:#4a7c50;
  --t-ok-quiet:#e4efe2;
  --t-ok-ink:#3b6541;
  --t-warn:#9c7422;
  --t-warn-quiet:#f7f0dc;
  --t-warn-ink:#7d5c17;
  --t-risk:#a5524a;
  --t-risk-quiet:#f7e9e6;
  --t-risk-ink:#874139;
  --t-focus:rgba(74,124,80,.24);
  --t-shadow:0 8px 28px rgba(58,80,60,.06);
  --t-shadow-lift:0 14px 36px rgba(58,80,60,.12);
  --t-brand:#57875d;
  --t-scene-light:day;
}

[data-theme="night"],
[data-theme="night"],
:root[data-theme="dark"],
[data-theme="dark"]{
  /* 夜读 · 低照度靛蓝与月白，夜间查看 */
  --t-canvas:#15171f;
  --t-surface:#22252f;
  --t-surface-soft:#1c1f28;
  --t-surface-raised:#282c38;
  --t-surface-sunken:#181a22;
  --t-veil:rgba(28,30,39,.82);
  --t-text:#e5e6ec;
  --t-text-strong:#f5f5f9;
  --t-text-soft:#a5a8b8;
  --t-text-faint:#7b7f90;
  --t-text-invert:#171920;
  --t-accent:#93a8d8;
  --t-accent-hover:#7b92c8;
  --t-accent-quiet:#252a3a;
  --t-accent-ink:#b3c3e8;
  --t-accent-solid:#61749f;
  --t-accent-solid-hover:#7b92c8;
  --t-on-solid:#12141b;
  --t-line:rgba(255,255,255,.10);
  --t-line-firm:rgba(255,255,255,.20);
  --t-ok:#6fbf9a;
  --t-ok-quiet:#1c3029;
  --t-ok-ink:#87d0ad;
  --t-warn:#d9ae6d;
  --t-warn-quiet:#312818;
  --t-warn-ink:#e6c287;
  --t-risk:#d18f98;
  --t-risk-quiet:#301f23;
  --t-risk-ink:#dda1aa;
  --t-focus:rgba(147,168,216,.30);
  --t-shadow:0 10px 26px rgba(0,0,0,.32);
  --t-shadow-lift:0 14px 32px rgba(0,0,0,.46);
  --t-brand:#8b9ed0;
  --t-scene-light:night;
}
*{box-sizing:border-box}
body{margin:0;background:var(--t-canvas);color:var(--t-text);
  font:14px/1.7 MiSans,"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  padding:20px;transition:background .3s,color .3s}
.wrap{max-width:1180px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.bar h1{font-size:14px;font-weight:600;margin:0 auto 0 0;color:var(--t-text-strong)}
.bar button{font:inherit;font-size:12px;padding:6px 11px;border-radius:6px;cursor:pointer;
  color:var(--t-text);background:var(--t-surface);border:1px solid var(--t-line-firm)}
.bar button:hover{background:var(--t-surface-soft)}
.bar .hint{font-size:11px;color:var(--t-text-faint);width:100%;margin:0}
/* 预览划一条边界：框内是页面本体。 */
#learningWorkspace{border:1px dashed var(--t-line-firm);border-radius:9px;padding:16px;
  background:var(--t-surface-soft)}
.log{
  margin-top:14px;padding:10px 12px;border-radius:6px;
  background:var(--t-surface-sunken);color:var(--t-text-faint);
  font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;
  max-height:120px;overflow:auto;white-space:pre-wrap;
}
/* ===== learning-page.css 原样内联 ===== */
/* 陪伴小屋 · 学习与反思（培育轨道）
   这一域是六个专题域里唯一「有方向」的：一条技能或目标从提出走到达成，
   中间可能暂停、可能归档。所以视觉主体是一条**纵向轨道**，四段主线加一条旁支，
   每张卡停在自己那一段里——状态不是标签，是坐标。

   为什么不是记忆页的档案库、也不是联系页的钟面：
   记忆的轴是生命周期（一条事实的四种归宿，无方向），
   联系的轴是一天（24 格的节律，循环），
   成长的轴是**推进**（有起点、有终点、有岔路）。三个轴向不同，
   同一套布局套上去就会把有方向的流程画成无方向的堆积。

   色值全部走 tokens.css 的语义令牌（不得写死十六进制），切主题时整页跟着变。
   五个状态各自一档语义色：
     proposed → --t-text-faint（还没开始，中性）
     active   → --t-accent（正在推进，主色）
     paused   → --t-warn（停下来了，需要留意）
     achieved → --t-ok（达成）
     retired  → --t-line-firm（归档，退到背景里）
   「来源不可读取」用 --t-risk：那是失效，不是缺字段。

   版式：桌面是轨道单列（宽屏时轨道内的卡片两列），详情覆盖在轨道右侧；
   窄屏轨道单列、详情整屏推入。 */

.lea-app{
  display:grid;grid-template-columns:206px minmax(0,1fr);
  gap:var(--sp-5);align-items:start;
  color:var(--t-text);font-size:var(--fs-body);line-height:1.7;
}
.lea-main{min-width:0;display:flex;flex-direction:column;gap:var(--sp-4)}

/* ===== 左侧轨道 =====
   与记忆页、联系页同源的分区轨道，三项同构不同色。
   未读审阅数用一个计数点挂在「待审阅」上——那是这一页唯一会到点的一条。 */
.lea-rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px;min-width:0}
.lea-rail::before{
  content:"";position:absolute;left:15px;top:22px;bottom:22px;width:1px;
  background:var(--t-line);z-index:0;
}
.lea-rail button{
  position:relative;z-index:1;display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-2);border:0;border-radius:var(--r-sm);background:transparent;
  color:var(--t-text-soft);font:inherit;font-size:var(--fs-body);text-align:left;cursor:pointer;
  transition:background .18s ease,color .18s ease;
}
.lea-rail button:hover{background:var(--t-surface-soft);color:var(--t-text)}
.lea-rail button[aria-pressed="true"]{
  background:var(--t-surface-raised);color:var(--t-text-strong);
  font-weight:600;box-shadow:var(--t-shadow);
}
.lea-rail-icon{
  flex:none;display:grid;place-items:center;width:31px;height:31px;
  border:1px solid var(--t-line);border-radius:50%;
  background:var(--t-surface);color:var(--t-text-faint);
  transition:border-color .18s ease,color .18s ease,background .18s ease;
}
.lea-rail button[aria-pressed="true"] .lea-rail-icon{
  border-color:transparent;background:var(--t-accent-quiet);color:var(--t-accent-ink);
}
.lea-rail-icon svg{width:16px;height:16px}
.lea-rail-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 待审阅计数：只在有条目时出现，带一次轻微的落位。 */
.lea-count{
  flex:none;font-style:normal;font-size:var(--fs-micro);font-weight:700;
  min-width:16px;padding:0 var(--sp-1);border-radius:var(--r-pill);text-align:center;
  background:var(--t-accent-solid);color:var(--t-on-solid);
  animation:lea-count-in .3s cubic-bezier(.34,1.4,.5,1) both;
}
@keyframes lea-count-in{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}

/* ===== 页头 ===== */
.lea-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap}
.lea-head-main{display:flex;align-items:center;gap:var(--sp-2);min-width:0;flex-wrap:wrap}
.lea-head h2{margin:0;font-size:var(--fs-title);font-weight:650;color:var(--t-text-strong)}
.lea-pill{
  display:inline-block;padding:2px var(--sp-2);border-radius:var(--r-pill);
  font-size:var(--fs-tiny);font-weight:600;
  background:var(--t-surface-soft);color:var(--t-text-soft);
}
.lea-id{font-size:var(--fs-tiny);color:var(--t-text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lea-head-actions{display:flex;gap:var(--sp-2);flex:none}

.lea-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);
  padding:var(--sp-1) var(--sp-3);border:1px solid var(--t-line);border-radius:var(--r-sm);
  background:var(--t-surface);color:var(--t-text-soft);
  font:inherit;font-size:var(--fs-body);cursor:pointer;
  transition:background .16s ease,border-color .16s ease,color .16s ease,transform .1s ease;
}
.lea-btn svg{width:14px;height:14px}
.lea-btn:hover:not(:disabled){background:var(--t-surface-soft);color:var(--t-text);border-color:var(--t-line-firm)}
.lea-btn:active:not(:disabled){transform:translateY(1px)}
.lea-btn:disabled{opacity:.5;cursor:default}
.lea-btn.is-primary{background:var(--t-accent-solid);color:var(--t-on-solid);border-color:transparent;font-weight:600}
.lea-btn.is-primary:hover:not(:disabled){background:var(--t-accent-solid-hover);color:var(--t-on-solid)}
.lea-btn.is-quiet{border-color:transparent;background:transparent;padding:var(--sp-1) var(--sp-2);color:var(--t-text-faint)}
.lea-btn.is-quiet:hover:not(:disabled){background:var(--t-surface-soft);color:var(--t-text-soft)}
.lea-btn.is-wide{width:100%;margin-top:var(--sp-3)}

/* 卡片上的小按钮。它们浮在可点击的卡片上面，所以要有自己的边界，
   否则用户以为点的是卡片、其实是按钮（或者反过来）。 */
.lea-mini{
  padding:3px var(--sp-2);border:1px solid var(--t-line);border-radius:var(--r-xs);
  background:var(--t-surface);color:var(--t-text-soft);
  font:inherit;font-size:var(--fs-tiny);cursor:pointer;white-space:nowrap;
  transition:background .14s ease,border-color .14s ease,color .14s ease;
}
.lea-mini:hover{background:var(--t-surface-soft);color:var(--t-text);border-color:var(--t-line-firm)}
.lea-mini.is-primary{
  background:var(--t-accent-quiet);color:var(--t-accent-ink);border-color:transparent;font-weight:600;
}
.lea-mini.is-primary:hover{background:var(--t-accent-solid);color:var(--t-on-solid)}

/* ===== 通知 ===== */
.lea-notice{
  display:flex;align-items:flex-start;gap:var(--sp-2);margin:0;
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);
  background:var(--t-ok-quiet);color:var(--t-ok-ink);font-size:var(--fs-body);
}
.lea-notice.is-error{background:var(--t-risk-quiet);color:var(--t-risk-ink)}
.lea-notice svg{width:14px;height:14px;flex:none;margin-top:3px}
.lea-notice span{flex:1;min-width:0}
.lea-notice button{
  border:0;background:transparent;color:inherit;font-size:var(--fs-title);line-height:1;cursor:pointer;
  padding:0 2px;opacity:.6;
}
.lea-notice button:hover{opacity:1}

/* ===== 空态 ===== */
.lea-empty{
  display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
  padding:var(--sp-7) var(--sp-5);text-align:center;color:var(--t-text-faint);
  border:1px dashed var(--t-line);border-radius:var(--r-md);
}
.lea-empty svg{width:22px;height:22px}
.lea-empty strong{color:var(--t-text-soft);font-size:var(--fs-body)}
.lea-empty p{margin:0;font-size:var(--fs-body);max-width:44ch}
.lea-spinner{
  width:15px;height:15px;border-radius:50%;
  border:2px solid var(--t-line);border-top-color:var(--t-accent);
  animation:lea-spin .7s linear infinite;
}
@keyframes lea-spin{to{transform:rotate(360deg)}}

/* ===== 筛选 ===== */
.lea-filters{
  display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap;
  padding:var(--sp-2) var(--sp-2);border-radius:var(--r-sm);background:var(--t-surface-soft);
}
.lea-filters-label{font-size:var(--fs-tiny);color:var(--t-text-faint);margin-inline-start:6px}
.lea-filters-label:first-child{margin-inline-start:0}
.lea-filters button{
  padding:3px var(--sp-2);border:1px solid transparent;border-radius:var(--r-pill);
  background:transparent;color:var(--t-text-soft);
  font:inherit;font-size:var(--fs-tiny);cursor:pointer;
  transition:background .14s ease,color .14s ease,border-color .14s ease;
}
.lea-filters button:hover{background:var(--t-surface);color:var(--t-text)}
.lea-filters button[aria-pressed="true"]{
  background:var(--t-surface-raised);color:var(--t-text-strong);
  border-color:var(--t-line-firm);font-weight:600;
}

/* ===== 轨道 =====
   四段主线纵排，每段一条左边线串起该段的卡片——那条线就是「这一段」的视觉容器。
   段的顺序固定，空段也留着：按有内容的段动态缩短轨道会让人以为流程变了。 */
.lea-track{display:flex;flex-direction:column;gap:var(--sp-4)}
.lea-lanes{display:flex;flex-direction:column;gap:var(--sp-3)}

.lea-lane{
  position:relative;padding:var(--sp-3) var(--sp-4) var(--sp-4);
  border:1px solid var(--t-line);border-radius:var(--r-md);
  background:var(--t-surface);
}
/* 每段的左边一条竖线，颜色跟着该段的状态走。 */
.lea-lane::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
  border-radius:0 var(--r-2xs) var(--r-2xs) 0;background:var(--t-line-firm);opacity:.5;
}
.lea-lane.lea-proposed::before{background:var(--t-text-faint)}
.lea-lane.lea-active::before{background:var(--t-accent-solid)}
.lea-lane.lea-paused::before{background:var(--t-warn)}
.lea-lane.lea-achieved::before{background:var(--t-ok)}
.lea-lane.lea-retired::before{background:var(--t-line-firm)}

.lea-lane > header{
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3);
}
.lea-lane-dot{
  flex:none;width:9px;height:9px;border-radius:50%;background:var(--t-line-firm);
}
.lea-proposed .lea-lane-dot{background:var(--t-text-faint)}
.lea-active .lea-lane-dot{background:var(--t-accent-solid)}
/* 进行中那一段的点会呼吸：它是唯一「正在动」的一段。 */
.lea-active .lea-lane-dot{animation:lea-pulse 2.8s ease-in-out infinite}
.lea-paused .lea-lane-dot{background:var(--t-warn)}
.lea-achieved .lea-lane-dot{background:var(--t-ok)}
@keyframes lea-pulse{
  0%,100%{box-shadow:0 0 0 0 var(--t-accent-quiet)}
  50%{box-shadow:0 0 0 4px var(--t-accent-quiet)}
}
.lea-lane > header h3{margin:0;font-size:var(--fs-body);font-weight:650;color:var(--t-text-strong)}
.lea-lane > header em{
  font-style:normal;font-size:var(--fs-micro);font-weight:700;
  min-width:16px;padding:0 var(--sp-1);border-radius:var(--r-pill);text-align:center;
  background:var(--t-surface-soft);color:var(--t-text-faint);
}
.lea-lane-hint{font-size:var(--fs-tiny);color:var(--t-text-faint);flex:1;min-width:0}
.lea-lane-empty{margin:0;font-size:var(--fs-tiny);color:var(--t-text-faint);padding:2px 0 2px var(--sp-4)}
.lea-lane-warn{
  margin:0 0 var(--sp-2);font-size:var(--fs-tiny);line-height:1.6;
  padding:var(--sp-2) var(--sp-2);border-radius:var(--r-sm);
  background:var(--t-warn-quiet);color:var(--t-warn-ink);
}
/* 状态未识别那一段用警示色描边：把它混进任何已知段都会误报进度。 */
.lea-lane.is-unknown{border-color:var(--t-warn);background:var(--t-warn-quiet)}
.lea-lane.is-unknown::before{background:var(--t-warn)}

/* ===== 卡片 ===== */
.lea-card{
  position:relative;display:flex;flex-direction:column;gap:var(--sp-1);
  padding:var(--sp-3) var(--sp-3);margin-bottom:var(--sp-1);cursor:pointer;
  border:1px solid var(--t-line);border-radius:var(--r-sm);
  background:var(--t-surface-raised);
  transition:border-color .16s ease,background .16s ease,transform .16s ease,box-shadow .16s ease;
}
.lea-card:last-child{margin-bottom:0}
.lea-card:hover{
  border-color:var(--t-line-firm);transform:translateX(2px);box-shadow:var(--t-shadow);
}
.lea-card:focus-visible{outline:2px solid var(--t-focus);outline-offset:2px}
.lea-card-top{display:flex;align-items:center;gap:var(--sp-2)}
.lea-kind{
  font-size:var(--fs-micro);font-weight:600;padding:1px var(--sp-2);border-radius:var(--r-pill);
  background:var(--t-surface-soft);color:var(--t-text-soft);
}
.lea-rev{font-size:var(--fs-micro);color:var(--t-text-faint);font-variant-numeric:tabular-nums}
.lea-card-title{margin:0;font-size:var(--fs-body);font-weight:600;color:var(--t-text-strong);line-height:1.45}
.lea-card-note{
  margin:0;font-size:var(--fs-tiny);color:var(--t-text-soft);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.lea-card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;
  margin-top:2px;
}
.lea-card-meta{font-size:var(--fs-micro);color:var(--t-text-faint)}
.lea-card-actions{display:flex;gap:var(--sp-1);flex:none}

/* 来源不可读取：整卡降级到警示色，标题位换成一句说明。
   这不是「字段缺失」——后端在来源读不出来时不返回标题、描述与进展，
   所以卡片必须说清"读不到"，而不是显示成一张空卡。 */
.lea-card.is-blind{border-color:var(--t-risk);background:var(--t-risk-quiet)}
.lea-card.is-blind::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:0 var(--r-2xs) var(--r-2xs) 0;background:var(--t-risk);
}
.lea-card.is-blind:hover{border-color:var(--t-risk-ink)}
.lea-blind-label{color:var(--t-risk-ink);font-style:italic}
.lea-card-why{margin:0;font-size:var(--fs-tiny);color:var(--t-risk-ink);line-height:1.55}
/* 状态动作做完之后给一次轻微的落位：卡片滑进新的一段。 */
.lea-card.is-entered{animation:lea-enter .5s cubic-bezier(.16,1,.3,1) both}
@keyframes lea-enter{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:none}
}

/* ===== 确认条 =====
   出现在轨道里、被点卡片所属那一段的下方——不居中弹窗。
   弹窗会把轨道整个盖住，用户看不到自己正要移走的那张卡。 */
.lea-confirm{
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  margin-top:var(--sp-3);padding:var(--sp-2) var(--sp-3);
  border:1px solid var(--t-caution);border-radius:var(--r-sm);
  background:var(--t-warn-quiet);
  animation:lea-confirm-in .26s cubic-bezier(.16,1,.3,1) both;
}
@keyframes lea-confirm-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.lea-confirm-text{font-size:var(--fs-body);color:var(--t-warn-ink);flex:1;min-width:0}
.lea-confirm-target{
  font-size:var(--fs-tiny);color:var(--t-text-faint);
  max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ===== 详情 ===== */
.lea-detail{
  display:flex;flex-direction:column;gap:var(--sp-3);
  padding:var(--sp-4);border:1px solid var(--t-line);border-radius:var(--r-md);
  background:var(--t-surface);
  animation:lea-detail-in .3s cubic-bezier(.16,1,.3,1) both;
}
@keyframes lea-detail-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lea-detail-head{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.lea-detail-title{margin:0;font-size:var(--fs-title);font-weight:650;color:var(--t-text-strong);line-height:1.4}
.lea-detail-desc{margin:0;font-size:var(--fs-body);color:var(--t-text-soft);line-height:1.7;white-space:pre-wrap}
.lea-detail-note{
  display:flex;flex-direction:column;gap:3px;
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);background:var(--t-surface-soft);
}
.lea-detail-note span{font-size:var(--fs-micro);font-weight:600;color:var(--t-text-faint)}
.lea-detail-note p{margin:0;font-size:var(--fs-body);color:var(--t-text);line-height:1.7;white-space:pre-wrap}

/* 来源不可读取时详情顶部的说明块。 */
.lea-blind{
  display:flex;gap:var(--sp-2);padding:var(--sp-3) var(--sp-3);border-radius:var(--r-sm);
  background:var(--t-risk-quiet);color:var(--t-risk-ink);
}
.lea-blind svg{width:18px;height:18px;flex:none;margin-top:2px}
.lea-blind strong{font-size:var(--fs-body);display:block;margin-bottom:3px}
.lea-blind p{margin:0;font-size:var(--fs-tiny);line-height:1.6}
.lea-blind-note{margin-top:var(--sp-1) !important;color:var(--t-text-soft)}

/* 提出 / 确认 / 变更这一条链，以及时间与来源。 */
.lea-chain,.lea-times{
  display:flex;gap:var(--sp-4);flex-wrap:wrap;margin:0;
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);background:var(--t-surface-soft);
}
.lea-chain > div,.lea-times > div{display:flex;flex-direction:column;gap:1px;min-width:0}
.lea-chain dt,.lea-times dt{font-size:var(--fs-micro);color:var(--t-text-faint)}
.lea-chain dd,.lea-times dd{
  margin:0;font-size:var(--fs-tiny);color:var(--t-text-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28ch;
}

.lea-detail-actions{
  display:flex;flex-direction:column;gap:var(--sp-2);
  padding-top:var(--sp-3);border-top:1px solid var(--t-line);
}
.lea-detail-actions h4,.lea-revise h4{
  margin:0;font-size:var(--fs-body);font-weight:650;color:var(--t-text-strong);
}
.lea-detail-why{margin:0;font-size:var(--fs-tiny);color:var(--t-text-faint);line-height:1.6}
.lea-action-row{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.lea-action-notes{
  list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;
}
.lea-action-notes li{display:flex;gap:var(--sp-2);font-size:var(--fs-tiny);color:var(--t-text-faint)}
.lea-action-notes strong{flex:none;min-width:4.5em;color:var(--t-text-soft);font-weight:600}

/* ===== 修订表单 ===== */
.lea-revise{
  display:flex;flex-direction:column;gap:var(--sp-3);
  padding-top:var(--sp-3);border-top:1px solid var(--t-line);
}
.lea-field{display:flex;flex-direction:column;gap:var(--sp-1)}
.lea-field > span{font-size:var(--fs-tiny);font-weight:600;color:var(--t-text-soft)}
.lea-field input,.lea-field textarea{
  width:100%;padding:var(--sp-2) var(--sp-2);box-sizing:border-box;
  border:1px solid var(--t-line);border-radius:var(--r-sm);
  background:var(--t-surface-sunken);color:var(--t-text);
  font:inherit;font-size:var(--fs-body);line-height:1.6;
  transition:border-color .16s ease,background .16s ease;
}
.lea-field textarea{resize:vertical}
.lea-field input:focus,.lea-field textarea:focus{
  outline:none;border-color:var(--t-accent);background:var(--t-surface);
}
.lea-form-actions{display:flex;justify-content:flex-end;gap:var(--sp-2)}

/* ===== 待审阅 =====
   每一条是**一条待裁决的进展**，不是一条记录：它挂在某个目标上，带自己的依据。 */
.lea-reviews{display:flex;flex-direction:column;gap:var(--sp-3)}
.lea-reviews-sum{margin:0;font-size:var(--fs-body);color:var(--t-text-soft)}
.lea-reviews-sum strong{color:var(--t-text-strong);font-size:var(--fs-lead);font-variant-numeric:tabular-nums}
.lea-review{
  display:flex;flex-direction:column;gap:var(--sp-2);
  padding:var(--sp-3) var(--sp-4);border:1px solid var(--t-line);border-radius:var(--r-md);
  background:var(--t-surface);
  animation:lea-review-in .42s cubic-bezier(.16,1,.3,1) both;
  animation-delay:calc(var(--i,0) * 46ms);
}
@keyframes lea-review-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.lea-review > header{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap}
.lea-review-target{font-size:var(--fs-body);font-weight:600;color:var(--t-text-strong);flex:1;min-width:0}
.lea-review-time{font-size:var(--fs-micro);color:var(--t-text-faint)}
.lea-review-note{
  margin:0;font-size:var(--fs-body);color:var(--t-text);line-height:1.7;white-space:pre-wrap;
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);background:var(--t-surface-soft);
}
.lea-review-note.is-empty{color:var(--t-text-faint);font-style:italic}
.lea-review > footer{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.lea-review.is-blind{border-color:var(--t-risk)}
.lea-review-warn{margin:0;font-size:var(--fs-tiny);color:var(--t-risk-ink);line-height:1.6}
.lea-reviews-empty{
  display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
  padding:var(--sp-7) var(--sp-5);text-align:center;color:var(--t-text-faint);
  border:1px dashed var(--t-line);border-radius:var(--r-md);
}
.lea-reviews-empty svg{width:26px;height:26px;color:var(--t-ok)}
.lea-reviews-empty strong{color:var(--t-text-soft);font-size:var(--fs-body)}
.lea-reviews-empty p{margin:0;font-size:var(--fs-body);max-width:40ch}

/* ===== 来源与凭证 ===== */
.lea-sources{display:flex;flex-direction:column;gap:var(--sp-3)}
.lea-block{
  display:flex;flex-direction:column;gap:var(--sp-2);
  padding:var(--sp-4);border:1px solid var(--t-line);border-radius:var(--r-md);
  background:var(--t-surface);
}
.lea-block > h3{margin:0;font-size:var(--fs-body);font-weight:650;color:var(--t-text-strong)}
.lea-note{margin:0;font-size:var(--fs-tiny);color:var(--t-text-soft);line-height:1.7}
.lea-note.is-ok{
  display:flex;align-items:center;gap:var(--sp-1);color:var(--t-ok-ink);
}
.lea-note.is-ok svg{width:14px;height:14px;flex:none}
.lea-blind-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-1)}
.lea-blind-list li{
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);
  background:var(--t-risk-quiet);
}
.lea-blind-list code{
  font-size:var(--fs-micro);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--t-text-soft);overflow:hidden;text-overflow:ellipsis;max-width:24ch;
}
.lea-blind-list span{font-size:var(--fs-tiny);color:var(--t-risk-ink);flex:1;min-width:0}
.lea-blind-list em{font-style:normal;font-size:var(--fs-micro);color:var(--t-text-faint);flex:none}

/* ===== 权限开关 =====
   两个布尔，但**不是两个独立开关**：read 关闭时 proposals 会被后端强制跟从。 */
.lea-gate{display:flex;flex-direction:column;gap:var(--sp-3)}
.lea-gate-list{display:flex;flex-direction:column;gap:var(--sp-2)}
.lea-switch{
  padding:var(--sp-3) var(--sp-3);border:1px solid var(--t-line);border-radius:var(--r-md);
  background:var(--t-surface);
  transition:border-color .16s ease,background .16s ease;
}
.lea-switch.is-following{border-color:var(--t-line-firm);background:var(--t-surface-soft)}
.lea-switch label{display:flex;align-items:flex-start;gap:var(--sp-2);cursor:pointer}
.lea-switch input{position:absolute;opacity:0;width:0;height:0}
.lea-switch-track{
  flex:none;position:relative;width:34px;height:19px;margin-top:2px;
  border-radius:var(--r-pill);background:var(--t-surface-sunken);
  border:1px solid var(--t-line);
  transition:background .2s ease,border-color .2s ease;
}
.lea-switch-track i{
  position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:var(--t-text-faint);
  transition:transform .22s cubic-bezier(.34,1.4,.5,1),background .2s ease;
}
.lea-switch input:checked + .lea-switch-track{background:var(--t-accent-quiet);border-color:var(--t-accent)}
.lea-switch input:checked + .lea-switch-track i{
  transform:translateX(15px);background:var(--t-accent-solid);
}
.lea-switch input:disabled + .lea-switch-track{opacity:.5}
.lea-switch input:focus-visible + .lea-switch-track{outline:2px solid var(--t-focus);outline-offset:2px}
.lea-switch-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.lea-switch-text strong{font-size:var(--fs-body);font-weight:600;color:var(--t-text)}
.lea-switch-text small{font-size:var(--fs-tiny);color:var(--t-text-faint);line-height:1.5}
.lea-switch-note{
  display:flex;align-items:flex-start;gap:var(--sp-1);margin:var(--sp-2) 0 0 44px;
  font-size:var(--fs-tiny);color:var(--t-text-faint);line-height:1.6;
}
.lea-switch-note svg{width:13px;height:13px;flex:none;margin-top:2px}
.lea-switch-note.is-warn{color:var(--t-warn-ink)}

/* ===== 窄屏 ===== */
@media (max-width:880px){
  .lea-app{grid-template-columns:minmax(0,1fr);gap:var(--sp-3)}
  .lea-rail{
    position:static;flex-direction:row;overflow-x:auto;gap:var(--sp-1);
    padding-bottom:var(--sp-1);scrollbar-width:none;
  }
  .lea-rail::-webkit-scrollbar{display:none}
  .lea-rail::before{display:none}
  .lea-rail button{
    flex:none;flex-direction:column;gap:var(--sp-1);padding:var(--sp-2) var(--sp-2);
    font-size:var(--fs-tiny);text-align:center;min-width:64px;
  }
  .lea-rail-label{overflow:visible;text-overflow:clip;white-space:nowrap;max-width:none}
  .lea-head{align-items:flex-start}
  .lea-head-actions{width:100%}
  .lea-head-actions .lea-btn{flex:1}
  .lea-lane{padding:var(--sp-3)}
  .lea-card:hover{transform:none}
  .lea-card-foot{flex-direction:column;align-items:flex-start;gap:var(--sp-2)}
  .lea-confirm-target{max-width:none;width:100%}
  .lea-chain,.lea-times{gap:var(--sp-3) var(--sp-4)}
  .lea-chain dd,.lea-times dd{max-width:20ch}
  .lea-action-notes li{flex-direction:column;gap:1px}
  .lea-action-notes strong{min-width:0}
  .lea-switch-note{margin-left:0}
  .lea-review > footer .lea-btn{flex:1}
}

/* ===== 减弱动效 =====
   压时长到瞬时，而不是 animation:none——
   关掉动画会让依赖 transitionend 的逻辑永远不结算。
   呼吸点、落位、计数弹入全部归零，信息一条不丢。 */
@media (prefers-reduced-motion:reduce){
  .lea-active .lea-lane-dot,.lea-count,.lea-card.is-entered,.lea-confirm,
  .lea-detail,.lea-review{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
  }
  .lea-card,.lea-btn,.lea-mini,.lea-rail button,.lea-rail-icon,.lea-filters button,
  .lea-switch-track,.lea-switch-track i,.lea-field input,.lea-field textarea{
    transition-duration:.001ms !important;
  }
  .lea-card:hover{transform:none}
}

</style>
</head>

    const response = await bounded(method === "GET" ? bridge.apiGet(path, body) : bridge.apiPost(path, body));
    const wrapped = ["ok","error"].includes(response?.status) ? response
      : ["ok","error"].includes(response?.data?.status) ? response.data : null;
    if (wrapped?.status === "error") throw problem(CODE.test(wrapped.data?.code || wrapped.message || "")

      notice("当前状态不接受「" + (ACTIONS[action]?.label || action) + "」，已刷新可用动作。", true);

  async function propose(form) {
    if (data.writing) return;

  function detailView() {

    return `<div class="lea-detail">
      <button type="button" class="lea-btn is-quiet" data-action="close-detail">${ICON.close}<span>返回轨道</span></button>

        <span class="lea-pill">${e(stage.label || row.state)}</span>
        <span class="lea-kind">${e(KIND_LABEL[row.kind] || row.kind)}</span>
        <span class="lea-rev">v${e(row.revision)}</span>
      </header>

        <div><dt>来源</dt><dd>${e(row.source_count ?? 0)} 条</dd></div>
      </dl>
      <section class="lea-detail-actions">
        <h4>可用动作</h4>
        <p class="lea-detail-why">这个列表由后端按当前状态与来源是否可读算出，页面不自己推断。</p>
        ${(row.actions || []).length ? `<div class="lea-action-row">${(row.actions || []).map(a => {
          const spec = ACTIONS[a] || {label:a, kind:"", note:""};
          return `<button type="button" class="lea-btn${spec.kind === "primary" ? " is-primary" : spec.kind === "quiet" ? " is-quiet" : ""}"
            data-act="${e(a)}" data-id="${e(row.growth_id)}"${data.writing ? " disabled" : ""}>

        <ul class="lea-action-notes">${(row.actions || []).map(a =>
          `<li><strong>${e(ACTIONS[a]?.label || a)}</strong><span>${e(ACTIONS[a]?.note || "")}</span></li>`).join("")}</ul>`
        : `<p class="lea-lane-empty">当前状态没有可用动作。</p>`}
      </section>
      ${(row.actions || []).includes("revise") ? reviseForm(row) : ""}
    </div>`;
  }
  function reviseForm(row) {
    const draft = data.form?.id === row.growth_id ? data.form : null;
    return `<form class="lea-revise" data-form="revise">
      <h4>修订</h4>
      <label class="lea-field"><span>标题</span>
        <input type="text" name="title" maxlength="200" required value="${e(draft?.title ?? row.title ?? "")}"></label>
      <label class="lea-field"><span>描述</span>
        <textarea name="description" rows="3" maxlength="2000">${e(draft?.description ?? row.description ?? "")}</textarea></label>
      <label class="lea-field"><span>进展</span>
        <textarea name="progress_note" rows="3" maxlength="2000">${e(draft?.progress_note ?? row.progress_note ?? "")}</textarea></label>
      <div class="lea-form-actions">
        <button type="submit" class="lea-btn is-primary"${data.writing ? " disabled" : ""}>保存修订</button>
      </div></form>`;
  }

  /* 审阅队列。每一条是一条**待裁决的进展**，不是一条记录：
     它挂在某个目标上，带自己的依据来源。依据读不出来时只剩「不采纳」——
     后端就是这么给的（`progress_management.py:94`），页面照实显示。 */
  function reviewsView() {
    if (!data.reviews.length) {
      return `<div class="lea-reviews-empty">${ICON.check}
        <strong>没有待审阅的进展</strong>
        <p>角色提出进展后会出现在这里，由你决定是否写进目标。</p></div>`;
    }
    return `<div class="lea-reviews">
      <p class="lea-reviews-sum">共 <strong>${data.reviews.length}</strong> 条待审阅。
        采纳会把这条进展写进目标；不采纳也会记下这次审阅。</p>
      ${data.reviews.map((row, index) => {
        const blind = !!row.unavailable_reason;
        return `<article class="lea-review${blind ? " is-blind" : ""}" style="--i:${index}">
          <header>
            <span class="lea-review-target">${e(row.growth_title || "目标已不可读取")}</span>
            <span class="lea-rev">依据 v${e(row.base_revision)}</span>
            <span class="lea-review-time">${e(when(row.created_at))}</span>
          </header>
          ${blind ? `<p class="lea-card-why">${ICON.sourceKey}<span>${e(reason(row.unavailable_reason))}——只能不采纳。</span></p>`
            : row.progress_note ? `<p class="lea-review-note">${e(row.progress_note)}</p>`
            : `<p class="lea-review-note is-empty">这条审阅没有附进展说明。</p>`}
          <footer>
            ${(row.actions || []).map(a => `<button type="button"
              class="lea-btn${REVIEW_ACTIONS[a]?.kind === "primary" ? " is-primary" : REVIEW_ACTIONS[a]?.kind === "quiet" ? " is-quiet" : ""}"
              data-review="${e(a)}" data-id="${e(row.review_id)}"${data.writing ? " disabled" : ""}>
              <span>${e(REVIEW_ACTIONS[a]?.label || a)}</span></button>`).join("")}
          </footer>
          ${(row.actions || []).length === 1 && row.actions[0] === "reject"
            ? `<p class="lea-review-warn">依据不可读取，采纳会把一条无法核对的进展写进目标，所以后端没有开放它。</p>` : ""}
        </article>`;
      }).join("")}
      ${data.reviewNext ? `<button type="button" class="lea-btn is-wide" data-action="more-reviews"${data.loadingReviews ? " disabled" : ""}>读取下一页审阅</button>` : ""}
    </div>`;
  }

  /* 来源与凭证。这一屏是**解释性**的：它说明为什么有的记录读不出内容，
     以及来源凭证从哪里来。不摆假控件——页面确实拼不出 ScopeRef/VersionRef。 */
  function sourcesView() {
    const blind = data.items.filter(row => row.unavailable_reason);
    return `<div class="lea-sources">
      <section class="lea-block">
        <h3>来源凭证</h3>
        <p class="lea-note">每条技能与目标都带一到八条**原始来源引用**，内容与凭据分开存储：
          记录里只留下引用，正文仍由来源方持有。</p>
        <p class="lea-note">这是设计出来的取舍——「可核验」依赖被核验对象的存活期，
          而存活期由来源方决定。</p>
      </section>
      <section class="lea-block">
        <h3>当前读不到内容的记录</h3>
        ${blind.length ? `<p class="lea-note">下面这些记录的来源已经读不出来了。后端在这种情况下
            不返回标题、描述与进展，所以轨道上它们显示为「来源已不可读取」。</p>
          <ul class="lea-blind-list">${blind.map(row => `<li>
            <code>${e(row.growth_id)}</code>
            <span>${e(reason(row.unavailable_reason))}</span>
            <em>${e(row.source_count ?? 0)} 条来源 · v${e(row.revision)}</em>
            <button type="button" class="lea-mini" data-open="${e(row.growth_id)}">查看</button></li>`).join("")}</ul>`
        : `<p class="lea-note is-ok">${ICON.check}<span>当前所有记录的来源都可读取。</span></p>`}
      </section>
      <section class="lea-block">
        <h3>新建记录需要什么</h3>
        <p class="lea-note">提出一条技能或目标需要附带完整的来源引用（安装、平台、会话、Bot、
          版本与签发时刻）。这些结构页面拼不出来——凭据由对话侧或迁移侧签发，
          所以这里不提供"手填来源"的表单：填出来的引用后端一定会拒。</p>
        <p class="lea-note">要新增长期目标，让角色在带来源的互动中自己提出；
          它会带着凭据出现在「提出」段，等你在那里确认。</p>
      </section>
    </div>`;
  }

  /* 权限开关。两个布尔，但**不是两个独立开关**：
     `proposals_enabled` 在 `read_enabled` 关闭时会被后端强制跟成同一份判定。
     所以关闭 read 时，propose 那一行要显示成"跟随 read"，而不是留一个开了也没用的开关。 */
  function gateView() {
    if (!data.access) {
      return `<div class="lea-empty">${ICON.alert}<strong>还没有读到权限设置</strong>
        <p>${e(data.notice || "权限随列表一起返回；列表没读到就没有这一份。")}</p>
        <button type="button" class="lea-btn" data-action="refresh">${ICON.refresh}<span>重新读取</span></button></div>`;
    }
    const settings = data.access.settings || {};
    const effective = data.access.effective || {};
    const readOn = settings.read_enabled === true;
    const following = !readOn;
    const rows = [
      {name:"read_enabled", label:"读取成长记录", note:"关闭后这一页读不到任何记录，相关页面的入口也会空着。"},
      {name:"proposals_enabled", label:"接受角色提出的成长", note:"关闭后角色不会提出新的技能与目标；已有的不受影响。"},
    ];
    return `<div class="lea-gate">
      <p class="lea-note">这两个开关是**窗口级**的：它们管这一位对象能不能读写成长记录，
        而技能内容本身存在角色层（同一角色与同一对象在两个窗口之间不会丢技能域）。</p>
      <div class="lea-gate-list">
        ${rows.map(row => {
          const on = settings[row.name] === true;
          const blocked = row.name === "proposals_enabled" && following;
          const verdict = effective[row.name];
          return `<div class="lea-switch${blocked ? " is-following" : ""}">
            <label>
              <input type="checkbox" data-access="${row.name}"${on ? " checked" : ""}${blocked || data.writing ? " disabled" : ""}>
              <span class="lea-switch-track"><i></i></span>
              <span class="lea-switch-text"><strong>${e(row.label)}</strong><small>${e(row.note)}</small></span>
            </label>
            ${blocked ? `<p class="lea-switch-note">${ICON.alert}<span>读取关闭时这一项跟随读取的判定，
              单独打开不会生效——后端在读取被拒时会把两者的判定并成同一份。</span></p>`
              : verdict && verdict.allowed === false ? `<p class="lea-switch-note is-warn">${ICON.alert}
                <span>已开启，但当前对象尚未获得这项权限：${e(reason(verdict.reason))}</span></p>` : ""}
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }

  function body() {
    if (!data.ready) return emptyMarkup();
    if (data.detailId) return detailView();
    return {"track":trackView, "reviews":reviewsView, "sources":sourcesView, "gate":gateView}[data.view]();
  }
  function render() {
    if (!root || !data) return;
    root.innerHTML = `<div class="lea-app">${railMarkup()}<div class="lea-main">${headMarkup()}${noticeMarkup()}${body()}</div></div>`;
  }

  /* ---- 交互 ------------------------------------------------------------ */
  /* 只注册一个 click：确认条的按键与其余点击**必须**在同一个处理器里按顺序判，
     分成两个监听就会依赖注册顺序，而且卸载时要记得摘两次。
     确认条排在最前面——它浮在别的东西上面，优先级最高。 */
  function onClick(event) {
    if (event.target.closest("[data-confirm]")) { confirmClick(event); return; }
    clicked(event);
  }
  function clicked(event) {
    const view = event.target.closest("[data-view]");
    if (view) {
      data.view = view.dataset.view; data.detailId = null; data.form = null; data.notice = ""; render();
      if (data.view === "reviews") loadReviews();
      return;
    }
    const action = event.target.closest("[data-action]")?.dataset.action;
    if (action === "refresh") {
      data.notice = "";
      if (data.view === "reviews" || data.view === "track") loadReviews();
      load(); return;
    }
    if (action === "dismiss") { data.notice = ""; render(); return; }
    if (action === "more") { loadMore(); return; }
    if (action === "more-reviews") { loadMoreReviews(); return; }
    if (action === "close-detail") { data.detailId = null; data.form = null; render(); return; }
    const filterState = event.target.closest("[data-filter-state]")?.dataset.filterState;
    if (filterState !== undefined) { data.stateFilter = filterState; load(); return; }
    const filterKind = event.target.closest("[data-filter-kind]")?.dataset.filterKind;
    if (filterKind !== undefined) { data.kindFilter = filterKind; load(); return; }
    const open = event.target.closest("[data-open]")?.dataset.open;
    if (open) { data.detailId = open; data.detail = item(open); data.form = null; render(); return; }
    /* 状态动作。卡片上的与详情里的是同一条路径。
       变量名不能叫 `act`：那是本模块的状态动作函数，
       同名会把它遮蔽掉，`act(id, name)` 就变成「调用一个 dataset」。 */
    const actionButton = event.target.closest("[data-act]");
    if (actionButton) {
      event.stopPropagation();
      const id = actionButton.dataset.id, name = actionButton.dataset.act;
      if (name === "revise") {
        data.detailId = id; data.detail = item(id); data.form = null; render();
        root.querySelector(".lea-revise input")?.focus();
        return;
      }
      if (name === "withdraw" || name === "retire") {
        /* 两个不可逆动作走一次确认：它们把记录移出活跃列表。 */
        data.notice = ""; data.confirm = {id, name}; render(); return;
      }
      act(id, name); return;
    }
    const reviewAction = event.target.closest("[data-review]");
    if (reviewAction) {
      const row = data.reviews.find(r => r.review_id === reviewAction.dataset.id);
      if (row) review(row, reviewAction.dataset.review);
      return;
    }
    /* 点卡片本体开详情；点按钮不算（上面已经 stopPropagation）。 */
    const card = event.target.closest("[data-id]");
    if (card && !event.target.closest("[data-act]")) {
      data.detailId = card.dataset.id; data.detail = item(card.dataset.id); data.form = null; render();
    }
  }
  /* 确认条渲染在轨道里、被点卡片所属的那一段下方——不居中弹窗。
     弹窗会把轨道整个盖住，用户看不到自己正要移走的那张卡。
     用 state 里的一条标记驱动，而不是 document.createElement：
     这一页其余部分全是字符串模板，混进一个 DOM 构造会让测试夹具
     必须多实现一套 API，而多出来的那套没有别的东西在验证。 */
  function confirmMarkup() {
    const pending = data.confirm;
    if (!pending) return "";
    const spec = ACTIONS[pending.name] || {label:pending.name, note:""};
    const row = item(pending.id);
    const stage = row ? (STATE_BY_KEY[row.state] || {}) : {};
    return `<div class="lea-confirm" role="alertdialog" aria-label="确认${e(spec.label)}">
      <span class="lea-confirm-text">${e(spec.note)}</span>
      <span class="lea-confirm-target">${e(stage.label || "")} · ${e(row?.title || pending.id)}</span>
      <button type="button" class="lea-mini is-primary" data-confirm="yes">确认${e(spec.label)}</button>
      <button type="button" class="lea-mini" data-confirm="no">取消</button></div>`;
  }
  function change(event) {
    const access = event.target.closest("[data-access]");
    if (access) { saveAccess({[access.dataset.access]: access.checked}); return; }
  }
  function submit(event) {
    const form = event.target.closest('[data-form="revise"]');
    if (!form) return;
    event.preventDefault();
    const row = data.detail || item(data.detailId);
    if (!row) return;
    const values = new FormData(form);
    const title = String(values.get("title") || "").trim();
    if (!title) { notice("标题不能为空。", true); render(); return; }
    act(row.growth_id, "revise", {title, description:String(values.get("description") || ""),
      progress_note:String(values.get("progress_note") || "")});
  }
  function confirmClick(event) {
    const button = event.target.closest("[data-confirm]");
    if (!button || !data.confirm) return;
    const {id, name} = data.confirm;
    data.confirm = null;
    if (button.dataset.confirm === "yes") act(id, name);
    else render();
  }
  function keydown(event) {
    if (event.key === "Escape") {
      if (data.notice) { data.notice = ""; render(); return; }
      if (data.confirm) { data.confirm = null; render(); return; }
      if (data.detailId) { data.detailId = null; data.form = null; render(); return; }
    }
    const card = event.target.closest(".lea-card");
    if (card && (event.key === "Enter" || event.key === " ")) {
      event.preventDefault();
      data.detailId = card.dataset.id; data.detail = item(card.dataset.id); data.form = null; render();
    }
    const rail = event.target.closest("[data-view]");
    if (rail && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
      event.preventDefault();
      const index = VIEWS.findIndex(([id]) => id === data.view);
      const next = (index + (event.key === "ArrowDown" ? 1 : VIEWS.length - 1)) % VIEWS.length;
      data.view = VIEWS[next][0]; data.detailId = null; render();
      root.querySelector('[data-view="' + data.view + '"]')?.focus();
    }
  }

  /* ---- 挂载 ------------------------------------------------------------ */
  async function whenBridgeReady(ticket, timeout = 10000) {
    if (window.AstrBotPluginPage?.apiGet) return window.AstrBotPluginPage;
    const product = window.CompanionProduct;
    if (product?.bridgeNow || product?.bridgeFor) {
      try {
        const found = product.bridgeNow?.() || await product.bridgeFor();
        if (found?.apiGet) return found;
      } catch { /* 交给下面的轮询 */ }
      if (window.AstrBotPluginPage?.apiGet) return window.AstrBotPluginPage;
    }
    return new Promise((resolve, reject) => {
      const started = Date.now();
      const tick = () => {
        if (!live(ticket)) return;
        const found = window.AstrBotPluginPage;
        if (found?.apiGet) return resolve(found);
        if (Date.now() - started >= timeout) return reject(problem("bridge_unavailable"));
        setTimeout(tick, 80);
      };
      tick();
    });
  }
  async function mount(host) {
    /* 顺序有讲究：unmount() 会 ++version 并清掉 data，所以
       ① 先 unmount，② 再建新 data，③ 才取票号。
       在 unmount() 之前取票会让下面第一处 live(ticket) 立即为假。 */
    unmount();
    root = host; data = blank();
    const ticket = ++version;
    root.addEventListener("click", onClick);
    root.addEventListener("change", change);
    root.addEventListener("submit", submit);
    root.addEventListener("keydown", keydown);
    render();
    try {
      bridge = await whenBridgeReady(ticket);
      if (!live(ticket)) return;
      const context = await bounded(bridge.ready());
      if (!live(ticket)) return;
      if (context?.pluginName !== HOST) throw problem("bridge_unavailable");
      const absolute = window.CompanionProduct.role?.()?.growth_api;
      if (typeof absolute !== "string" || !absolute) throw problem("relationship_required");
      data.path = rel(absolute);
      await load(); await loadReviews();
      if (live(ticket)) render();
    } catch (error) {
      if (!live(ticket)) return;
      notice(error.code ? reason(error.code) : String(error?.message || "未完成"), true);
      render();
    }
  }
  function unmount() {
    ++version;
    if (!root) { data = null; bridge = null; return; }
    root.removeEventListener("click", onClick);
    root.removeEventListener("change", change);
    root.removeEventListener("submit", submit);
    root.removeEventListener("keydown", keydown);
    root = null; bridge = null; data = null;
  }
  return {mount, unmount,
    get state() { return {data}; },
    _internals:{STAGES, RETIRED, ACTIONS, REVIEW_ACTIONS, KIND_LABEL, when}};
})();

</script>
<script>
window.CompanionLearningPage.mount(document.getElementById('learningWorkspace'));

document.getElementById('theme').onclick = () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'courtyard' ? 'night' : 'courtyard';
};
/* 「切换来源失效」把那条正常记录的标题抹掉并挂上 unavailable_reason——
   重演后端在来源读不出来时的真实行为：内容不返回。 */
let blind = false;
document.getElementById('blind').onclick = () => {
  blind = !blind;
  const row = REPLY.list.items.find(r => r.growth_id === 'g-skill-2');
  if (blind) {
    Object.assign(row, {title: null, description: null, progress_note: null,
      unavailable_reason: 'growth_source_expired', actions: ['retire']});
  } else {
    Object.assign(row, {title: '按镜头语言描述画面',
      description: '按镜头语言描述画面——由互动中提出的长期方向。',
      progress_note: '本周试了三次，讲得比上月具体。',
      unavailable_reason: null, actions: ['revise', 'pause', 'retire']});
  }
  window.CompanionLearningPage.unmount();
  window.CompanionLearningPage.mount(document.getElementById('learningWorkspace'));
};
</script>
</body>
