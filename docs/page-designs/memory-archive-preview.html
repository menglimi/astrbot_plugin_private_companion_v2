<!DOCTYPE html>
<html lang="zh-CN" data-theme="courtyard">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>记忆与经历 · 档案库（静态预览）</title>
<style>
/* tokens.css 的庭院与夜读两套，内联让预览自包含。
   真页面读 tokens.css，六套主题都能切；预览带两套足够看明暗对比。
   页面样式里没有一个写死的色值，所以明暗切换是整页跟着变。 */
[data-theme="courtyard"],
[data-theme="courtyard"]{
  /* 庭院 · 日间的清爽草绿与天光，是默认主题 */
  --t-canvas:#eef3ec;
  --t-surface:#fdfefb;
  --t-surface-soft:#f5f9f3;
  --t-surface-raised:#ffffff;
  --t-surface-sunken:#e3ebe0;
  --t-veil:rgba(253,254,251,.72);
  --t-text:#333a33;
  --t-text-strong:#212822;
  --t-text-soft:#616b60;
  --t-text-faint:#828c80;
  --t-text-invert:#fdfefb;
  --t-accent:#4a7c50;
  --t-accent-hover:#3a6540;
  --t-accent-quiet:#e6efe4;
  --t-accent-ink:#3b6541;
  --t-accent-solid:#46754c;
  --t-accent-solid-hover:#375e3d;
  --t-on-solid:#fdfefb;
  --t-line:rgba(74,90,74,.14);
  --t-line-firm:rgba(74,90,74,.26);
  --t-ok:#4a7c50;
  --t-ok-quiet:#e4efe2;
  --t-ok-ink:#3b6541;
  --t-warn:#9c7422;
  --t-warn-quiet:#f7f0dc;
  --t-warn-ink:#7d5c17;
  --t-risk:#a5524a;
  --t-risk-quiet:#f7e9e6;
  --t-risk-ink:#874139;
  --t-focus:rgba(74,124,80,.24);
  --t-shadow:0 8px 28px rgba(58,80,60,.06);
  --t-shadow-lift:0 14px 36px rgba(58,80,60,.12);
  --t-brand:#57875d;
  --t-scene-light:day;
}

[data-theme="night"],
[data-theme="night"],
:root[data-theme="dark"],
[data-theme="dark"]{
  /* 夜读 · 低照度靛蓝与月白，夜间查看 */
  --t-canvas:#15171f;
  --t-surface:#22252f;
  --t-surface-soft:#1c1f28;
  --t-surface-raised:#282c38;
  --t-surface-sunken:#181a22;
  --t-veil:rgba(28,30,39,.82);
  --t-text:#e5e6ec;
  --t-text-strong:#f5f5f9;
  --t-text-soft:#a5a8b8;
  --t-text-faint:#7b7f90;
  --t-text-invert:#171920;
  --t-accent:#93a8d8;
  --t-accent-hover:#7b92c8;
  --t-accent-quiet:#252a3a;
  --t-accent-ink:#b3c3e8;
  --t-accent-solid:#61749f;
  --t-accent-solid-hover:#7b92c8;
  --t-on-solid:#12141b;
  --t-line:rgba(255,255,255,.10);
  --t-line-firm:rgba(255,255,255,.20);
  --t-ok:#6fbf9a;
  --t-ok-quiet:#1c3029;
  --t-ok-ink:#87d0ad;
  --t-warn:#d9ae6d;
  --t-warn-quiet:#312818;
  --t-warn-ink:#e6c287;
  --t-risk:#d18f98;
  --t-risk-quiet:#301f23;
  --t-risk-ink:#dda1aa;
  --t-focus:rgba(147,168,216,.30);
  --t-shadow:0 10px 26px rgba(0,0,0,.32);
  --t-shadow-lift:0 14px 32px rgba(0,0,0,.46);
  --t-brand:#8b9ed0;
  --t-scene-light:night;
}
*{box-sizing:border-box}
body{margin:0;background:var(--t-canvas);color:var(--t-text);
  font:14px/1.7 MiSans,"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  padding:20px;transition:background .3s,color .3s}
.wrap{max-width:1180px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.bar h1{font-size:14px;font-weight:600;margin:0 auto 0 0;color:var(--t-text-strong)}
.bar button{font:inherit;font-size:12px;padding:6px 11px;border-radius:6px;cursor:pointer;
  color:var(--t-text);background:var(--t-surface);border:1px solid var(--t-line-firm)}
.bar button:hover{background:var(--t-surface-soft)}
.bar .hint{font-size:11px;color:var(--t-text-faint);width:100%;margin:0}
/* 预览划一条边界：框内是页面本体。 */
#memoryWorkspace{border:1px dashed var(--t-line-firm);border-radius:9px;padding:16px;
  background:var(--t-surface-soft)}
.log{
  margin-top:14px;padding:10px 12px;border-radius:6px;
  background:var(--t-surface-sunken);color:var(--t-text-faint);
  font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;
  max-height:120px;overflow:auto;white-space:pre-wrap;
}
/* ===== memory-page.css 原样内联 ===== */
/* 陪伴小屋 · 记忆与经历（档案库）
   记忆是六个专题域里唯一「有生命周期」的域：一条事实会被写入、更正、钉选、
   撤回、遗忘、冷归档、恢复、导出、导入。这一页的视觉重量全部用来回答
   「它现在是什么状态、从哪来、下一步能做什么」，而不是把十九个端点平铺成十九个框。

   色值全部走 tokens.css 的语义令牌（不得写死十六进制），
   切主题时整页跟着变。生命周期色另外映射到 ok/warn/risk/faint 四档语义色，
   见 .mem-state-* 一组。

   版式：桌面 master-detail（左事实流 + 右详情），窄屏翻成列表→详情推入。 */

/* ===== 外壳 ===== */
#memoryWorkspace{min-width:0}
.mem-app{
  display:grid;grid-template-columns:184px minmax(0,1fr);
  gap:var(--sp-5);align-items:start;
  color:var(--t-text);font-size:var(--fs-body);line-height:1.7;
}

/* ===== 左侧视图轨道 =====
   六个工作台不是平级页签：整理与修复是「在进行中」的、其余是「查看态」。
   轨道用一条竖线把它们串起来，整理中那一项带脉冲点，读到待处理批次时亮起。 */
.mem-rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px;min-width:0}
.mem-rail::before{
  content:"";position:absolute;left:15px;top:22px;bottom:22px;width:1px;
  background:var(--t-line);z-index:0;
}
.mem-rail button{
  position:relative;z-index:1;display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-2);border:0;border-radius:var(--r-sm);background:transparent;
  color:var(--t-text-soft);font:inherit;font-size:var(--fs-body);text-align:left;cursor:pointer;
  transition:background .18s ease,color .18s ease;
}
.mem-rail button:hover{background:var(--t-surface-soft);color:var(--t-text)}
.mem-rail button[aria-pressed="true"]{
  background:var(--t-surface-raised);color:var(--t-text-strong);
  font-weight:600;box-shadow:var(--t-shadow);
}
/* 图标容器：默认是个细描边的圈，被选中时填成色调 —— 是「节点」不是「徽章」 */
.mem-rail-icon{
  flex:none;display:grid;place-items:center;width:31px;height:31px;
  border:1px solid var(--t-line);border-radius:50%;
  background:var(--t-surface);color:var(--t-text-faint);
  transition:border-color .18s ease,color .18s ease,background .18s ease;
}
.mem-rail button[aria-pressed="true"] .mem-rail-icon{
  border-color:transparent;background:var(--t-accent-quiet);color:var(--t-accent-ink);
}
.mem-rail-icon svg{width:16px;height:16px}
.mem-rail-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-rail-count{
  flex:none;font-size:var(--fs-micro);font-variant-numeric:tabular-nums;
  padding:1px var(--sp-1);border-radius:999px;
  background:var(--t-warn-quiet);color:var(--t-warn-ink);
}
.mem-rail-count[hidden]{display:none}
/* 整理中：脉冲点是唯一的「非用户触发」持续动效，只在真有待处理批次时出现 */
.mem-rail button.is-working .mem-rail-icon::after{
  content:"";position:absolute;width:31px;height:31px;border-radius:50%;
  border:1px solid var(--t-warn);animation:mem-pulse 2.4s ease-out infinite;
}
@keyframes mem-pulse{
  0%{transform:scale(1);opacity:.5}
  70%,100%{transform:scale(1.5);opacity:0}
}

/* ===== 主区 ===== */
.mem-main{display:flex;flex-direction:column;gap:var(--sp-4);min-width:0}

/* 页头：对象/角色选择与一句话状态同排。选择器是「这一页在讲谁」，
   不是筛选项，所以它永远在最上面，且不随视图切换而消失。 */
/* 页头：标题 + 对象/角色选择器同排。
   不写副标题——切到哪个视图，标题就是那件事，左侧轨道已经交代过它是干什么的；
   再加一行「这里可以……每条都带……」是把导航重说一遍，白占第一屏。 */
.mem-head{
  display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap;
  padding-bottom:var(--sp-4);border-bottom:1px solid var(--t-line);
}
.mem-head-title{flex:1 1 200px;min-width:0}
.mem-head-title h2{
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;
  font-size:var(--fs-display);line-height:1.35;font-weight:600;color:var(--t-text-strong);margin:0;
  letter-spacing:.01em;
}
/* 副标题只在页面确实有话说时才出现（目前没有调用点），保留样式以防回归 */
.mem-head-title p{margin:var(--sp-1) 0 0;color:var(--t-text-faint);font-size:var(--fs-tiny);line-height:1.7;max-width:58ch}
.mem-scope{display:flex;gap:var(--sp-3);flex-wrap:wrap;min-width:0}
.mem-scope label{display:flex;flex-direction:column;gap:var(--sp-1);font-size:var(--fs-tiny);color:var(--t-text-faint);min-width:0}
.mem-scope select{
  font:inherit;font-size:var(--fs-body);width:100%;min-width:150px;max-width:290px;min-height:38px;
  padding:var(--sp-2) var(--sp-2);color:var(--t-text);
  background:var(--t-surface);border:1px solid var(--t-line-firm);border-radius:var(--r-sm);
}
.mem-scope select:disabled{opacity:.5}

/* ===== 徽章 =====
   生命周期色由 .mem-state-* 给（见下），这里只管形状与「非生命周期」的三种语义色。
   徽章的底色一律是当前色的一档淡版，所以它跟着主题走，不需要各写一套。 */
.mem-badge{
  display:inline-flex;align-items:center;gap:var(--sp-1);flex:none;
  padding:2px var(--sp-2);border-radius:var(--r-xs);
  font-size:var(--fs-micro);line-height:1.6;white-space:nowrap;
  background:var(--t-surface-sunken);color:var(--t-text-soft);
}
.mem-badge.is-ok{background:var(--t-ok-quiet);color:var(--t-ok-ink)}
.mem-badge.is-warn{background:var(--t-warn-quiet);color:var(--t-warn-ink)}
.mem-badge.is-risk{background:var(--t-risk-quiet);color:var(--t-risk-ink)}
.mem-badge.is-accent{background:var(--t-accent-quiet);color:var(--t-accent-ink)}
/* 生命周期徽章：底色用 color-mix 从当前色兑出，一套规则覆盖四种状态 */
.mem-badge.mem-state-active,
.mem-badge.mem-state-superseded,
.mem-badge.mem-state-retracted,
.mem-badge.mem-state-forgotten,
.mem-badge.mem-state-archived{
  background:color-mix(in srgb, currentColor 12%, transparent);
}
@supports not (background:color-mix(in srgb, red 10%, transparent)){
  /* 不支持 color-mix 时退回中性底：颜色信息仍由文字承担，不丢语义 */
  .mem-badge[class*="mem-state-"]{background:var(--t-surface-sunken)}
}

/* ===== 通知 / 恢复条 ===== */
.mem-notice{
  display:flex;align-items:flex-start;gap:var(--sp-2);margin:0;
  padding:var(--sp-3) var(--sp-3);border-radius:var(--r-sm);font-size:var(--fs-body);line-height:1.7;
  background:var(--t-surface-soft);border:1px solid var(--t-line);
  color:var(--t-text-soft);overflow-wrap:anywhere;
  animation:mem-slide-in .22s cubic-bezier(.16,1,.3,1);
}
.mem-notice[hidden]{display:none}
.mem-notice svg{flex:none;width:15px;height:15px;margin-top:3px}
.mem-notice.is-error{background:var(--t-risk-quiet);border-color:transparent;color:var(--t-risk-ink)}
.mem-notice.is-ok{background:var(--t-ok-quiet);border-color:transparent;color:var(--t-ok-ink)}
.mem-recovery{
  display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;
  padding:var(--sp-3) var(--sp-3);border-radius:var(--r-sm);
  background:var(--t-warn-quiet);color:var(--t-warn-ink);font-size:var(--fs-body);line-height:1.7;
}
.mem-recovery>span{flex:1 1 240px;min-width:0}

/* ===== 按钮 ===== */
.mem-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);
  min-height:36px;padding:var(--sp-2) var(--sp-3);font:inherit;font-size:var(--fs-body);line-height:1.5;
  color:var(--t-text);background:var(--t-surface);cursor:pointer;
  border:1px solid var(--t-line-firm);border-radius:var(--r-sm);
  transition:background .16s ease,border-color .16s ease,color .16s ease,transform .12s ease;
}
.mem-btn:hover:not(:disabled){background:var(--t-surface-soft);border-color:var(--t-text-faint)}
.mem-btn:active:not(:disabled){transform:translateY(1px)}
.mem-btn:disabled{opacity:.42;cursor:default}
.mem-btn svg{width:15px;height:15px}
.mem-btn.is-primary{
  background:var(--t-accent-solid);border-color:transparent;color:var(--t-on-solid);
}
.mem-btn.is-primary:hover:not(:disabled){background:var(--t-accent-solid-hover)}
.mem-btn.is-danger{color:var(--t-risk-ink);background:var(--t-risk-quiet);border-color:transparent}
.mem-btn.is-danger:hover:not(:disabled){background:var(--t-risk-quiet);border-color:var(--t-risk)}
.mem-btn.is-quiet{border-color:transparent;background:transparent;color:var(--t-text-soft)}
.mem-btn.is-quiet:hover:not(:disabled){background:var(--t-surface-soft);color:var(--t-text)}

/* ===== 区块 =====
   深度规则：**分组用背景，可交互对象用边框，两者不并用。**
   这一页原来最乱的地方就在这里——.mem-block 同时带边框、背景和阴影，
   而它内部又装着带底边框的 .mem-card 和带右边框的 .mem-corpus，
   于是一屏里出现"框套框套框"，眼睛找不到哪一层才是边界。
   现在区块退成一整块浅底，边框留给真正能点的东西（卡片、输入框、按钮），
   分层靠背景深浅与间距，不再靠描边。 */
.mem-block{
  background:var(--t-surface-soft);border:0;
  border-radius:var(--r-lg);min-width:0;
  animation:mem-rise .26s cubic-bezier(.16,1,.3,1) both;
}
/* 区块头：只有标题时不该撑出一个空行。
   说明只在「不说就会做错」的地方出现（数据范围、不可逆后果），
   且限宽 60ch —— 不限宽会拉成一整行，又变回一坨文字。 */
.mem-block-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:var(--sp-3);flex-wrap:wrap;padding:var(--sp-4) var(--sp-4);
  border-bottom:1px solid var(--t-line);
}
.mem-block-head h3{margin:0;font-size:var(--fs-lead);font-weight:600;color:var(--t-text-strong)}
.mem-block-head p{
  flex:1 1 240px;min-width:0;max-width:60ch;margin:0;
  font-size:var(--fs-tiny);line-height:1.7;color:var(--t-text-faint);
}
.mem-block-body{padding:var(--sp-4);min-width:0}
.mem-block-body:empty{display:none}

/* ===== 事实总览条 =====
   一条事实的四种归宿（有效/被取代/已撤回/已遗忘）在这里变成一条比例带。
   比例带是这一页的「记忆心电图」——先用一眼看出语料健康度，再去读条目。 */
.mem-vitals{display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}
.mem-vitals-figure{display:flex;align-items:baseline;gap:var(--sp-2);flex:none}
.mem-vitals-figure b{
  font-family:Georgia,"Times New Roman",serif;font-weight:400;
  font-size:var(--fs-hero);line-height:1;color:var(--t-text-strong);
  font-variant-numeric:tabular-nums;
}
.mem-vitals-figure span{font-size:var(--fs-tiny);color:var(--t-text-faint);line-height:1.5}
.mem-vitals-rest{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:var(--sp-2)}
.mem-band{
  display:flex;height:7px;border-radius:999px;overflow:hidden;
  background:var(--t-surface-sunken);
}
.mem-band i{
  display:block;height:100%;width:0;
  transition:width .62s cubic-bezier(.16,1,.3,1);
}
.mem-band i:first-child{border-radius:999px 0 0 999px}
.mem-band i:last-child{border-radius:0 999px 999px 0}
.mem-legend{display:flex;gap:var(--sp-3);flex-wrap:wrap;font-size:var(--fs-tiny);color:var(--t-text-soft)}
.mem-legend span{display:inline-flex;align-items:center;gap:var(--sp-1)}
.mem-legend em{
  width:8px;height:8px;border-radius:var(--r-2xs);flex:none;font-style:normal;
  background:currentColor;opacity:.85;
}
.mem-legend b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--t-text)}

/* 生命周期色：四档语义，四处共用（比例带、列表状态条、详情状态环、徽章） */
.mem-state-active{color:var(--t-ok)}
.mem-state-superseded{color:var(--t-text-faint)}
.mem-state-retracted{color:var(--t-risk)}
.mem-state-forgotten{color:var(--t-line-firm)}
.mem-state-archived{color:var(--t-warn)}

/* ===== 筛选条 ===== */
.mem-filters{
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--t-line);
}
.mem-chip{
  display:inline-flex;align-items:center;gap:var(--sp-1);
  padding:var(--sp-1) var(--sp-3);font:inherit;font-size:var(--fs-tiny);cursor:pointer;
  color:var(--t-text-soft);background:transparent;
  border:1px solid var(--t-line);border-radius:999px;
  transition:background .16s ease,border-color .16s ease,color .16s ease;
}
.mem-chip:hover{border-color:var(--t-text-faint);color:var(--t-text)}
.mem-chip[aria-pressed="true"]{
  background:var(--t-accent-quiet);border-color:transparent;
  color:var(--t-accent-ink);font-weight:600;
}
.mem-chip b{font-weight:600;font-variant-numeric:tabular-nums;opacity:.75}
.mem-search{
  flex:1 1 160px;min-width:0;display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-1) var(--sp-3);background:var(--t-surface-soft);
  border:1px solid var(--t-line);border-radius:var(--r-sm);
}
.mem-search svg{flex:none;width:14px;height:14px;color:var(--t-text-faint)}
.mem-search input{
  flex:1;min-width:0;border:0;outline:0;background:none;
  font:inherit;font-size:var(--fs-body);color:var(--t-text);padding:3px 0;
}

/* ===== 事实流（master-detail 的左半） ===== */
.mem-split{
  display:grid;grid-template-columns:minmax(260px,.86fr) minmax(0,1.14fr);
  align-items:start;min-width:0;
}
.mem-corpus{
  border-right:1px solid var(--t-line);min-width:0;
  max-height:min(68vh,720px);overflow-y:auto;overscroll-behavior:contain;
}
.mem-card{
  position:relative;display:block;width:100%;text-align:left;
  /* 左边比右边多 3px，给 ::before 那条生命周期状态条留位置。
     两侧压成同一个值会让状态条压住文字，所以这里必须是非对称的；
     写成具名变量而不是裸数字，是为了让"这不是随手取的间距"有据可查。 */
  --mem-card-gutter:18px;
  padding:var(--sp-3) var(--sp-4) var(--sp-3) var(--mem-card-gutter);
  font:inherit;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--t-line);
  transition:background .16s ease;
}
.mem-card:last-child{border-bottom:0}
.mem-card:hover{background:var(--t-surface-soft)}
.mem-card[aria-current="true"]{background:var(--t-accent-quiet)}
/* 左侧状态条：生命周期在列表里的第一眼表达。宽度变化 = 轻重之分：
   有效最粗（它是在用的），遗忘最细（它是墓碑）。 */
.mem-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:currentColor;opacity:.55;
  transition:width .18s ease,opacity .18s ease;
}
.mem-card[aria-current="true"]::before{width:3px;opacity:1}
.mem-card-line{
  display:flex;align-items:baseline;gap:var(--sp-2);margin-bottom:var(--sp-1);
}
.mem-card-line strong{
  flex:1;min-width:0;font-size:var(--fs-body);font-weight:500;color:var(--t-text-strong);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.mem-card-q{
  font-size:var(--fs-body);line-height:1.65;color:var(--t-text-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.mem-card-meta{
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  margin-top:var(--sp-2);font-size:var(--fs-micro);color:var(--t-text-faint);
}
.mem-card-meta time{font-variant-numeric:tabular-nums}
/* 钉选：一枚小小的实心点，不是星标图标——它表达「这条被钉住了」而非「收藏」 */
.mem-pin{
  flex:none;width:7px;height:7px;border-radius:50%;
  background:var(--t-accent-solid);
}
.mem-pin[hidden]{display:none}

/* ===== 事实详情（右半） ===== */
.mem-detail{min-width:0;padding:var(--sp-4)}
.mem-detail-empty{padding:var(--sp-7) var(--sp-5);text-align:center;color:var(--t-text-faint);font-size:var(--fs-body);line-height:1.8}
.mem-detail-top{display:flex;align-items:flex-start;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.mem-detail-top h3{
  flex:1 1 auto;min-width:0;margin:0;
  font-family:"Noto Serif SC","Songti SC","SimSun",serif;
  font-size:var(--fs-head);line-height:1.5;font-weight:600;color:var(--t-text-strong);
  overflow-wrap:anywhere;
}
/* 状态环：详情里「这条记忆现在怎么了」的落点。用 conic-gradient 表达置信度，
   环的颜色表达生命周期——两个维度不互相占用。 */
.mem-ring{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.mem-ring i{
  display:grid;place-items:center;width:36px;height:36px;border-radius:50%;
  background:var(--t-surface-raised);font-size:var(--fs-tiny);font-weight:600;font-style:normal;
  font-variant-numeric:tabular-nums;color:var(--t-text-soft);
}
.mem-quote{
  margin:0 0 var(--sp-4);padding:0 0 0 var(--sp-4);border-left:2px solid var(--t-line-firm);
  font-size:var(--fs-lead);line-height:1.95;color:var(--t-text);white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.mem-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--sp-2) var(--sp-4);margin:0 0 var(--sp-4)}
.mem-fields div{min-width:0}
.mem-fields dt{font-size:var(--fs-micro);color:var(--t-text-faint);margin-bottom:3px}
.mem-fields dd{
  margin:0;font-size:var(--fs-body);color:var(--t-text);
  overflow-wrap:anywhere;
}
.mem-fields dd.is-mono,.mem-mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--fs-tiny);letter-spacing:-.01em;
}
.mem-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap;padding-top:var(--sp-4);border-top:1px solid var(--t-line)}
.mem-actions .mem-btn{min-height:33px;padding:var(--sp-1) var(--sp-3);font-size:var(--fs-tiny)}

/* ===== 修订时间轴 =====
   只有内容真的是一段序列时才配得上竖线+节点。修订历史正是序列，所以用。
   最新的节点稍大、颜色更深，越往下越淡——时间的方向感由颜色承担。 */
.mem-timeline{list-style:none;margin:var(--sp-4) 0 0;padding:0 0 0 var(--sp-4);position:relative}
.mem-timeline::before{
  content:"";position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--t-line);
}
.mem-timeline li{position:relative;padding:0 0 var(--sp-4)}
.mem-timeline li:last-child{padding-bottom:0}
.mem-timeline li::before{
  content:"";position:absolute;left:-17px;top:6px;
  width:7px;height:7px;border-radius:50%;
  background:var(--t-surface-raised);border:1.5px solid var(--t-line-firm);
}
.mem-timeline li:first-child::before{
  border-color:var(--t-accent-solid);background:var(--t-accent-solid);
  box-shadow:0 0 0 3px var(--t-accent-quiet);
}
.mem-timeline time{display:block;font-size:var(--fs-micro);color:var(--t-text-faint);font-variant-numeric:tabular-nums}
.mem-timeline p{margin:var(--sp-1) 0 0;font-size:var(--fs-body);line-height:1.75;color:var(--t-text-soft);white-space:pre-wrap;overflow-wrap:anywhere}
.mem-timeline .mem-timeline-op{
  display:inline-block;margin-right:var(--sp-2);padding:1px var(--sp-1);border-radius:var(--r-2xs);
  font-size:var(--fs-micro);background:var(--t-surface-sunken);color:var(--t-text-soft);
}

/* ===== 整理批次（六阶段状态机） =====
   后端 reflection 有六个阶段：准备材料 → 待整理 → 调用结果待核对 → 已收到待解析
   → 待写入 → 完成/失败。以前是一个文字标签，现在画成一条推进的轨道。 */
.mem-stages{display:flex;gap:0;margin:var(--sp-3) 0 0;list-style:none;padding:0}
.mem-stages li{
  flex:1;min-width:0;position:relative;padding-top:var(--sp-5);
  font-size:var(--fs-micro);color:var(--t-text-faint);text-align:center;
}
.mem-stages li::before{
  content:"";position:absolute;left:50%;top:6px;transform:translateX(-50%);
  width:9px;height:9px;border-radius:50%;z-index:1;
  background:var(--t-surface-raised);border:1.5px solid var(--t-line-firm);
  transition:background .3s ease,border-color .3s ease,box-shadow .3s ease;
}
/* 连线：除首项外每一项都画到自己中心的一半 */
.mem-stages li:not(:first-child)::after{
  content:"";position:absolute;left:-50%;top:10px;width:100%;height:1px;
  background:var(--t-line);z-index:0;
}
.mem-stages li.is-done::before{background:var(--t-ok);border-color:var(--t-ok)}
.mem-stages li.is-done::after{background:var(--t-ok)}
.mem-stages li.is-now::before{
  background:var(--t-accent-solid);border-color:var(--t-accent-solid);
  box-shadow:0 0 0 4px var(--t-accent-quiet);
}
.mem-stages li.is-now{color:var(--t-text-strong);font-weight:600}
.mem-stages li.is-failed::before{background:var(--t-risk);border-color:var(--t-risk)}
.mem-stages li.is-failed{color:var(--t-risk-ink);font-weight:600}

.mem-batch{
  display:grid;gap:var(--sp-1);width:100%;text-align:left;padding:var(--sp-3) var(--sp-4);
  background:transparent;border:0;border-bottom:1px solid var(--t-line);
  font:inherit;cursor:pointer;
  transition:background .16s ease,box-shadow .16s ease;
}
.mem-batch:last-child{border-bottom:0}
.mem-batch:hover{background:var(--t-surface-soft)}
.mem-batch[aria-current="true"]{
  background:var(--t-accent-quiet);
  box-shadow:inset 3px 0 var(--t-accent-solid);
}
.mem-batch-top{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.mem-batch-top strong{font-size:var(--fs-body);font-weight:600;color:var(--t-text-strong)}
.mem-batch>span:not(.mem-batch-top){
  font-size:var(--fs-body);line-height:1.7;color:var(--t-text-soft);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.mem-batch small{font-size:var(--fs-micro);color:var(--t-text-faint);font-variant-numeric:tabular-nums}

.mem-job{
  margin:var(--sp-3) 0 0;padding:var(--sp-3) var(--sp-3);border-radius:var(--r-sm);
  background:var(--t-ok-quiet);color:var(--t-ok-ink);
  font-size:var(--fs-body);line-height:1.75;border-left:3px solid var(--t-ok);
}
.mem-job strong{display:block;font-size:var(--fs-body);margin-bottom:3px}

/* ===== 分隔小节（详情里的次级标题） ===== */
.mem-sub{
  display:flex;align-items:baseline;gap:var(--sp-2);margin:var(--sp-5) 0 0;
  font-size:var(--fs-body);font-weight:600;color:var(--t-text-strong);
}
.mem-sub small{font-weight:400;font-size:var(--fs-micro);color:var(--t-text-faint)}
.mem-plain{font-size:var(--fs-body);line-height:1.85;color:var(--t-text-soft);margin:var(--sp-3) 0 0;max-width:64ch}
.mem-list{margin:var(--sp-2) 0 0;padding-left:19px;font-size:var(--fs-body);line-height:1.85;color:var(--t-text-soft)}
.mem-list li{margin-bottom:3px}

/* ===== 来源与经历 ===== */
.mem-query-form{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:var(--sp-3);align-items:end}
.mem-query-form label{display:flex;flex-direction:column;gap:var(--sp-1);font-size:var(--fs-tiny);color:var(--t-text-faint);min-width:0}
.mem-query-form input,.mem-query-form select{
  width:100%;min-width:0;font:inherit;font-size:var(--fs-body);padding:var(--sp-2) var(--sp-2);
  color:var(--t-text);background:var(--t-surface);
  border:1px solid var(--t-line-firm);border-radius:var(--r-sm);
}
.mem-results{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-4);list-style:none;padding:0}
.mem-result{
  padding:var(--sp-3) var(--sp-4);border:1px solid var(--t-line);border-radius:var(--r-sm);
  background:var(--t-surface);min-width:0;
  animation:mem-rise .26s cubic-bezier(.16,1,.3,1) both;
}
.mem-result-head{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-1)}
.mem-result h4{margin:0;font-size:var(--fs-body);font-weight:600;color:var(--t-text-strong)}
.mem-result p{margin:0;font-size:var(--fs-body);line-height:1.8;color:var(--t-text-soft);white-space:pre-wrap;overflow-wrap:anywhere}
.mem-source-link{
  display:inline-flex;align-items:center;gap:var(--sp-1);max-width:100%;
  margin-top:var(--sp-2);padding:var(--sp-1) var(--sp-2);font:inherit;font-size:var(--fs-tiny);cursor:pointer;
  color:var(--t-text-soft);background:var(--t-surface-soft);
  border:1px solid var(--t-line);border-radius:var(--r-sm);
  overflow-wrap:anywhere;text-align:left;
  transition:background .16s ease,color .16s ease,border-color .16s ease;
}
.mem-source-link:hover{background:var(--t-accent-quiet);border-color:transparent;color:var(--t-accent-ink)}
.mem-source-text{
  margin:var(--sp-3) 0 0;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-sm);
  background:var(--t-surface-sunken);color:var(--t-text);
  font-size:var(--fs-body);line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere;
  animation:mem-rise .26s cubic-bezier(.16,1,.3,1) both;
}
.mem-source-text small{display:block;margin-bottom:var(--sp-2);font-size:var(--fs-micro);color:var(--t-text-faint)}

/* ===== 预览→确认两段式（归档/清理/导入共用） =====
   这三个动作都不可逆或代价高，共用同一套「先看后做」的形状：
   预览摘要 → 显式确认 → 回执。形状一致是为了让人学会一次就到处认得。 */
.mem-preview{
  display:flex;flex-direction:column;gap:var(--sp-3);
  padding:var(--sp-4) var(--sp-4);border-radius:var(--r-sm);
  background:var(--t-surface-soft);border:1px solid var(--t-line);
}
.mem-preview-facts{display:flex;gap:var(--sp-4);flex-wrap:wrap;margin:0}
.mem-preview-facts div{min-width:0}
.mem-preview-facts dt{font-size:var(--fs-micro);color:var(--t-text-faint);margin-bottom:3px}
.mem-preview-facts dd{margin:0;font-size:var(--fs-title);color:var(--t-text-strong);font-variant-numeric:tabular-nums}
.mem-preview-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.mem-token{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:var(--fs-micro);color:var(--t-text-faint);overflow-wrap:anywhere;
}
/* 归档预览的条目：勾选项。被移出工作集是一个「位移」，所以用复选框而非开关。 */
.mem-pick{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none;max-height:290px;overflow-y:auto}
.mem-pick li{border-bottom:1px solid var(--t-line)}
.mem-pick li:last-child{border-bottom:0}
.mem-pick label{display:flex;gap:var(--sp-2);align-items:flex-start;padding:var(--sp-2) var(--sp-1);cursor:pointer;font-size:var(--fs-body);line-height:1.7}
.mem-pick input{flex:none;margin-top:var(--sp-1);accent-color:var(--t-accent-solid)}
.mem-pick strong{display:block;font-weight:500;color:var(--t-text)}
.mem-pick small{display:block;margin-top:2px;font-size:var(--fs-micro);color:var(--t-text-faint)}

/* ===== 删除/归档的「移出」动效 =====
   条目真的从列表里消失时必须能被看见，否则用户不知道刚才那一下做了什么。
   .is-leaving 让卡片向左塌陷并淡出，260ms 后才从 DOM 摘掉。 */
.mem-card.is-leaving,.mem-batch.is-leaving{
  animation:mem-leave .26s cubic-bezier(.55,0,.9,.4) forwards;
  pointer-events:none;
}
@keyframes mem-leave{
  to{opacity:0;transform:translateX(-13px);max-height:0;padding-top:0;padding-bottom:0;border-width:0}
}

/* ===== 空态 / 加载 ===== */
.mem-empty{
  padding:var(--sp-6) var(--sp-5);text-align:center;color:var(--t-text-faint);
  font-size:var(--fs-body);line-height:1.85;max-width:52ch;margin:0 auto;
}
.mem-empty h3{margin:0 0 var(--sp-2);font-size:var(--fs-title);font-weight:600;color:var(--t-text-soft)}
.mem-skeleton{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-4)}
.mem-skeleton i{
  display:block;height:34px;border-radius:var(--r-sm);
  background:linear-gradient(90deg,var(--t-surface-soft) 0%,var(--t-surface-sunken) 50%,var(--t-surface-soft) 100%);
  background-size:200% 100%;animation:mem-shimmer 1.5s linear infinite;
}
@keyframes mem-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
/* 读取中：顶部一条进度带，是页面级唯一「无内容时的动效」，避免整页骨架闪烁 */
.mem-progress{
  height:2px;border-radius:999px;background:var(--t-accent-quiet);overflow:hidden;
}
.mem-progress[hidden]{display:none}
.mem-progress i{
  display:block;height:100%;width:36%;border-radius:999px;
  background:var(--t-accent-solid);animation:mem-sweep 1.25s ease-in-out infinite;
}
@keyframes mem-sweep{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(380%)}
}

/* ===== 表单（编辑事实） ===== */
.mem-form{display:grid;gap:var(--sp-3);margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--t-line)}
.mem-form label{display:flex;flex-direction:column;gap:var(--sp-1);font-size:var(--fs-tiny);color:var(--t-text-faint)}
.mem-form input,.mem-form textarea{
  width:100%;min-width:0;font:inherit;font-size:var(--fs-body);padding:var(--sp-2) var(--sp-3);line-height:1.6;
  color:var(--t-text);background:var(--t-surface);
  border:1px solid var(--t-line-firm);border-radius:var(--r-sm);
}
.mem-form textarea{resize:vertical;min-height:74px}
.mem-form-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap}

/* ===== 可折叠的「标识符」 ===== */
.mem-identifiers{margin-top:var(--sp-4);font-size:var(--fs-tiny);color:var(--t-text-faint)}
.mem-identifiers summary{cursor:pointer;padding:var(--sp-2) 0;list-style:none}
.mem-identifiers summary::-webkit-details-marker{display:none}
.mem-identifiers summary::before{content:"› ";display:inline-block;transition:transform .18s ease}
.mem-identifiers[open] summary::before{transform:rotate(90deg)}
.mem-identifiers p{margin:var(--sp-1) 0 0;line-height:1.75;overflow-wrap:anywhere}

/* ===== 焦点 ===== */
#memoryWorkspace :is(button,select,input,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--t-accent-solid);outline-offset:2px;border-radius:var(--r-xs);
}

/* ===== 通用入场 ===== */
@keyframes mem-rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes mem-slide-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* ===== 响应式 =====
   桌面三区（轨道 | 语料 + 详情）；≤1080 轨道收成横排；
   ≤880 master-detail 翻成列表→详情推入（详情从右侧滑入，带返回）。 */
@media(max-width:1080px){
  .mem-app{grid-template-columns:minmax(0,1fr)}
  .mem-rail{
    position:static;flex-direction:row;overflow-x:auto;gap:var(--sp-1);
    padding-bottom:var(--sp-1);scrollbar-width:none;
  }
  .mem-rail::-webkit-scrollbar{display:none}
  .mem-rail::before{display:none}
  .mem-rail button{flex:none;padding:var(--sp-2) var(--sp-3)}
  .mem-rail-icon{width:26px;height:26px}
  .mem-rail-icon svg{width:14px;height:14px}
}
@media(max-width:880px){
  .mem-split{grid-template-columns:minmax(0,1fr)}
  .mem-corpus{border-right:0;max-height:none}
  /* 详情推入：没有选中条目时整块收起（否则会在列表下方留一块空白，
     窄屏上那块空白比列表本身还高），选中后从右侧滑入覆盖列表。 */
  .mem-detail{
    position:fixed;z-index:40;inset:0;max-height:100dvh;overflow-y:auto;
    background:var(--t-surface-raised);border-radius:0;border:0;
    transform:translateX(100%);
    transition:transform .3s cubic-bezier(.16,1,.3,1);
  }
  .mem-detail:not(.is-open){display:none}
  .mem-detail.is-open{display:block;transform:none;box-shadow:var(--t-shadow-lift)}
  .mem-detail-close{display:inline-flex!important;margin-right:auto}
  .mem-detail-top{flex-wrap:wrap}
  .mem-vitals-figure b{font-size:var(--fs-display)}
}
@media(min-width:881px){.mem-detail-close{display:none!important}}
@media(max-width:650px){
  .mem-head-title h2{font-size:var(--fs-head)}
  .mem-query-form{grid-template-columns:minmax(0,1fr)}
  .mem-block-body,.mem-detail{padding:var(--sp-3)}
  .mem-block-head,.mem-filters{padding:var(--sp-3) var(--sp-3)}
  .mem-stages li{font-size:var(--fs-micro)}
  .mem-btn{min-height:40px}
}

/* ===== 降级：减少动态 =====
   一律压到近零时长而不是 none——CSS 过渡被删掉之后，依赖 transitionend
   或时长等待的逻辑会永远等不到。压时长则终态照常到达，行为与视觉都不分叉。 */
@media(prefers-reduced-motion:reduce){
  .mem-app *,.mem-app *::before,.mem-app *::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
  .mem-card.is-leaving,.mem-batch.is-leaving{display:none}
}

</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>记忆与经历 · 档案库（静态预览 · 数据是编的）</h1>
    <button id="theme">明 / 暗</button>
    <p class="hint">这一页跑的<b>就是</b> pages/陪伴小屋/memory-page.js 本体，只把页面桥换成返回假数据的桩。
      改状态、点动作都会走一遍真实路径——下面那行会打印实际发出的请求。</p>
  </div>
  <section id="memoryWorkspace" aria-label="记忆与经历工作区"></section>
  <div class="log" id="log">（还没有请求）</div>
</div>

<script>
/* 假页面桥。形状照真实 SDK：apiGet / apiPost 返回 Promise，回执是 {status,data} 信封。

     `/astrbot_plugin_private_companion_v2/host/targets/...`，交给桥之前
     要切掉插件目录名，让它变成 `host/targets/...`。
     真实 SDK（AstrBot 的 plugin_page_bridge.js）自己会把插件目录名拼回去。
     这一条是查出来的，不是猜的：`tools/check_product_page.cjs` 的合成 SDK
     按 `'/'+HOST+'/'+relative` 还原绝对地址，RPC 只接受裸路由名；
     `tests/demo_host_process.py` 同理。docs/CORE_HOST_MANAGEMENT_PAGE_20260924.md
     也写着「所有请求使用插件相对路径」。 */
  function endpoint() {
    const path = role()?.memory_api;
    if (typeof path !== "string" || !path.startsWith(PREFIX)) throw problem("invalid_response");
    const relative = path.slice(PREFIX.length);
    if (relative.split("/").some(part => !part || part === "." || part === "..") || /[?#%\\:]/.test(relative)) throw problem("invalid_response");
    return relative;
  }
  function storageKey() {
    return STORE + JSON.stringify([data.catalog.installation_id, data.catalog.operator_id, endpoint()]);
  }
  function restorePending() {
    try {
      const value = JSON.parse(localStorage.getItem(storageKey()));
      if (value && [value.batch_id, value.operation_key, value.tracked_batch_id].every(s => typeof s === "string" && s.length > 0 && s.length <= 256)
          && typeof value.uncertain === "boolean") return value;
    } catch { /* Storage is optional; no memory content is cached. */ }
    return null;
  }
  function savePending() {
    try {
      if (data.pending) localStorage.setItem(storageKey(), JSON.stringify(data.pending));
      else localStorage.removeItem(storageKey());
      return true;
    } catch { return false; }
  }
  function mutationStorageKey() { return storageKey() + ":mutation"; }
  function restoreMutation() {
    try {
      const value = JSON.parse(localStorage.getItem(mutationStorageKey()));
      if (value && typeof value.operation_key === "string" && value.operation_key.length <= 256
          && typeof value.kind === "string") return value;
    } catch { /* Storage is optional; never cache memory text here. */ }
    return null;
  }
  function saveMutation() {
    try {
      if (data.pendingMutation) {
        const marker = data.pendingMutation;
        const safe = {kind:marker.kind,operation_key:marker.operation_key};
        for (const key of ["atom_id","action","base_revision","view_token","revision_token"]) {
          if (marker[key] !== undefined) safe[key] = marker[key];
        }
        localStorage.setItem(mutationStorageKey(), JSON.stringify(safe));
      }
      else localStorage.removeItem(mutationStorageKey());
      return true;
    } catch { return false; }
  }
  async function bounded(promise) {
    let timeout;
    try {
      return await Promise.race([promise, new Promise((_, reject) => {
        timeout = setTimeout(() => reject(problem("bridge_timeout")), 15000);
      })]);
    } finally { clearTimeout(timeout); }
  }
  async function api(method, path, body) {
    const response = await bounded(method === "GET" ? bridge.apiGet(path, body) : bridge.apiPost(path, body));
    const wrapped = ["ok","error"].includes(response?.status) ? response : ["ok","error"].includes(response?.data?.status) ? response.data : null;
    /* 后端把机器码放在信封的 message 上（页面桥只转发 message），所以取码要同时
       看 data.code 与 message，不能只认前者。 */
    if (wrapped?.status === "error") throw problem(CODE.test(wrapped.data?.code || wrapped.message || "")
      ? (wrapped.data?.code || wrapped.message) : "invalid_response");
    const value = wrapped ? wrapped.data : response;
    if (!value || typeof value !== "object") throw problem("invalid_response");
    return value;
  }
  function live(ticket) { return ticket === version && root?.isConnected; }
  function stopTimer() { clearTimeout(timer); timer = null; }
  function schedule() {
    stopTimer();
    /* 只在「整理与修复」里轮询：那是有后台任务的视图。事实流是被动数据，
       用户自己在看，8 秒刷一次只会把筛选与滚动位置晃掉。 */
    if (data?.ready && role()?.memory_api && !document.hidden && ["reflections","facts"].includes(data.area)) {
      // Poll only reads. Neither a timer nor a page reload can queue a model call.
      const quiet = data.area === "facts" && (data.search || data.filter !== "all");
      timer = setTimeout(() => { if (!data.busy && !data.loading && !quiet) load(); else schedule(); }, 8000);
    }
  }
  function notice(message, error=false) { data.notice = message; data.error = error; }
  function failure(error) {
    if (data.area === "reflections") { data.items = []; data.detail = null; }
    if (data.area === "facts") { data.corpus = []; data.factDetail = null; data.revisions = []; }
    data.queryResult = null; data.sourceResult = null; data.next = null;
    if (error.code === "memory_reflection_unavailable") data.detailId = null;
    notice(error.code ? reason(error.code) : "连接中断，已清空旧内容。请刷新核对。", true);
    if (denied.has(error.code)) {
      data.pending = null; savePending(); data.catalog = null; data.ready = false; stopTimer();
    }
  }
  /* 徽标与面包屑。
   *
   * 外壳接手之后顶栏徽标由 product.updateHostChrome() 统一渲染，
   * 这里不再抢过去改写——它原先会写一个「设计预览」的文案，那正是
   * 「连不上」的观感来源。所以宿主徽标在场时直接返回。
   * 只有当这个工作区被单独嵌入（没有外壳徽标）时才自己补一条状态。 */
  function setChrome(active) {
    if(window.CompanionProduct?.hosted()&&document.querySelector("[data-host-badge]"))return;
    document.body.classList.toggle("memory-connected",active);
    const label = document.querySelector(".preview-badge");
    if (label) label.innerHTML = active ? "<span></span>记忆读取正常 <b>V2</b>" : "<span></span>记忆读取待检查 <b>V2</b>";
    if (active) {
      const breadcrumb = document.querySelector("#breadcrumb strong");
      if (breadcrumb) breadcrumb.textContent = "记忆与经历";
      document.title = "记忆与经历 · 陪伴 V2";
    }
  }

  /* ================= 语料：本地派生 ================= */

  function stateOf(item) {
    const value = item?.state;
    return LIFECYCLE.some(entry => entry.key === value) ? value : "superseded";
  }
  function tally(items) {
    const out = {total:items.length};
    for (const entry of LIFECYCLE) out[entry.key] = 0;
    for (const item of items) out[stateOf(item)] += 1;
    return out;
  }
  /* 筛选与搜索。搜索覆盖表述、谓词、对象三个字段——用户记得的可能只是
     当时那句话里的任何一个词，不限制字段才找得到。 */
  function visibleFacts() {
    const needle = data.search.trim().toLowerCase();
    return data.corpus.filter(item => {
      if (data.filter !== "all" && stateOf(item) !== data.filter) return false;
      if (!needle) return true;
      return [item.representation, item.predicate, item.object, item.subject]
        .some(field => typeof field === "string" && field.toLowerCase().includes(needle));
    });
  }
  function selectedFact() {
    return data.corpus.find(item => item.atom_id === data.selId) || null;
  }

  /* ================= 视图：左轨道 ================= */

  const AREAS = [
    ["reflections","整理与修复",ICON.reflections,"整理批次、失败修复与后台接续"],
    ["facts","事实治理",ICON.facts,"已保存事实的更正、钉选、撤回与遗忘"],
    ["query","来源与经历",ICON.query,"按关键词检索事实、原始来源与共同经历"],
    ["archive","冷归档",ICON.archive,"把长期闲置的持久事实移出工作集，可随时移回"],
    ["migrate","迁移",ICON.migrate,"导出可审阅的记忆包，或校验后导入另一安装的包"],
    ["clear","范围清理",ICON.clear,"按范围逻辑遗忘当前私聊关系的事实"],
  ];
  function railMarkup() {
    const pendingBatches = data.area === "reflections" && data.items.length ? data.items.length : 0;
    return `<nav class="mem-rail" aria-label="记忆工作区">${AREAS.map(([id,label,icon,hint])=>{
      const working = id === "reflections" && pendingBatches > 0;

        aria-pressed="${data.area===id}"${working?' class="is-working"':""}>
        <span class="mem-rail-icon">${icon}</span>
        <span class="mem-rail-label">${e(label)}</span>
        ${id==="reflections"?`<span class="mem-rail-count"${pendingBatches?"":" hidden"}>${num(pendingBatches)}</span>`:""}
      </button>`;
    }).join("")}</nav>`;
  }

  /* ================= 视图：页头 ================= */

  function headMarkup() {
    const target = current();
    /* 页头不放说明句。
       切到哪个视图，标题就是那件事，左侧轨道已经写了它是干什么的；
       再加一行「这里可以……每条都带……」是把导航重说一遍，占掉了第一屏。
       真正需要当场知道的规则（比如「这不是删除」）写在动作旁边，不写在这里。 */
    const AREA_TITLE = {
      reflections:"整理与修复", facts:"事实治理", query:"来源与经历",
      archive:"冷归档", migrate:"迁移", clear:"范围清理",

      <div class="mem-head-title"><h2>${e(AREA_TITLE[data.area])}</h2></div>

          data.catalog?.targets.map((t,i)=>`<option value="${i}" ${i===data.target?"selected":""}>${e((t.scope_kind === "group"?"群聊 ":"私聊 ")+(t.participant_id || t.group_id || t.target_id) + " · " + t.platform_id + " / Bot " + t.account_id)}</option>`).join("") || '<option>尚未读取目标</option>'

  /* ================= 视图：事实治理（master-detail） ================= */

  /* 语料比例带：四种生命周期的占比条。宽度在渲染后用一次 requestAnimationFrame

  function vitalsMarkup() {

  function filtersMarkup() {

  /* 状态环：conic-gradient 画置信度，环本身的颜色由 .mem-state-* 给出

    <details class="mem-identifiers"><summary>记录标识</summary>

      ${data.factDetail.sources?.length?`<p class="mem-mono">sources ${data.factDetail.sources.length} 个句柄</p>`:""}
    </details>`;
  }

  /* ================= 视图：整理与修复 ================= */

  function detailMarkup() {

    const issues = [...(item.issues || []), ...(item.unresolved_items || [])];
    const canQueue = (item.resumable || item.retryable) && job?.state !== "queued" && !data.pending?.uncertain;
    let action = item.retryable ? "修复未完成项" : "继续整理";

    return `<div class="mem-detail-top">

  const AREA_VIEW = {reflections:reflectionsMarkup, facts:factsMarkup, query:queryMarkup,

  function render() {
    if (!root?.isConnected || !data) return;
    /* 焦点与滚动位置跨重绘保留：这一页每次状态变化都整块重建 innerHTML，
       不做这一步的话，用户点了「下一页」焦点就掉到 body，
       键盘与读屏都要重新找位置。 */
    const active = document.activeElement;
    const focused = root.contains(active) && active?.id ? active.id : null;
    const corpus = root.querySelector(".mem-corpus");
    const scroll = corpus?.scrollTop || 0;
    const target = current();
    root.innerHTML = `<div class="mem-app">
      ${railMarkup()}
      <div class="mem-main">
        <div class="mem-progress"${data.loading?"":" hidden"} role="progressbar" aria-label="正在读取"><i></i></div>
