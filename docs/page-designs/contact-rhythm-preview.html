/* === 尺寸：圆角 / 间距 / 字号 === */
:root{
  --r-2xs:3px;
  --r-xs:6px;
  --r-sm:9px;
  --r-md:12px;
  --r-lg:16px;
  --r-pill:999px;

  --r-xl:22px;

  --sp-1:4px;
  --sp-2:8px;
  --sp-3:12px;
  --sp-4:16px;
  --sp-5:22px;
  --sp-6:30px;
  --sp-7:40px;
  --sp-8:54px;

  /* 字号尺度：八档，步进约 1.18–1.25。
     在此之前本文件根本没有字号令牌，页面各自取数，于是同一个界面上会同时存在
     9.5/10.5/11.5/12.5/13.5 五种小数——每档差 1px，眼睛分辨不出，
     层级就只剩下噪音。字号收敛成八档之后，"哪一行是标题"由档位回答，
     不再靠 0.5px 的差别暗示。

     小字只留 micro / tiny 两档：曾经还有一档 --fs-small(12.5px)，
     与 --fs-body(13.5px) 只差 1px，读起来是同一级却各占一档，
     反而让"标签 vs 正文"的界线变模糊，因此合并进 body。 */
  --fs-micro:calc(10.5px * var(--font-scale));
  --fs-tiny:calc(11.5px * var(--font-scale));
  --fs-body:calc(13.5px * var(--font-scale));
  --fs-lead:calc(15px * var(--font-scale));
  --fs-title:calc(17px * var(--font-scale));
  --fs-head:calc(21px * var(--font-scale));
  --fs-display:calc(27px * var(--font-scale));
  --fs-hero:calc(36px * var(--font-scale));

  --gap:13px;
  --pad:20px;
  --pad-lg:26px;
  --rail-w:92px;
  --shell-pad:32px;
  /* 两个独立维度相乘：type-scale 是用户的无障碍字号偏好，density 是版式疏密。
     两者都作用到同一批 --fs-* 上，所以"字号调小 + 宽松排版"这种组合是对的。 */
  --type-scale:1;
  --density-scale:1;
  --font-scale:calc(var(--type-scale) * var(--density-scale));
  --motion:1;

  --dur-fast:.16s;
  --dur:.24s;
  --dur-slow:.4s;
  /* 主题叠化时长。比普通过渡慢，因为整页都在换色。 */
  --dur-theme:.36s;
}
:root[data-radius="sharp"]{--r-2xs:1px;--r-xs:2px;--r-sm:4px;--r-md:5px;--r-lg:7px;--r-xl:9px}
:root[data-radius="round"]{--r-2xs:5px;--r-xs:10px;--r-sm:14px;--r-md:20px;--r-lg:26px;--r-xl:34px}
:root[data-density="compact"]{--gap:9px;--pad:15px;--pad-lg:19px;--sp-4:12px;--sp-5:16px;--sp-6:22px;--sp-7:30px;--sp-8:40px;--density-scale:.96}
:root[data-density="roomy"]{--gap:18px;--pad:26px;--pad-lg:34px;--sp-4:21px;--sp-5:28px;--sp-6:38px;--sp-7:50px;--sp-8:68px;--density-scale:1.04}
:root[data-type-scale="s"]{--type-scale:.94}
:root[data-type-scale="l"]{--type-scale:1.08}
:root[data-type-scale="xl"]{--type-scale:1.18}
:root[data-motion="low"]{--motion:.35;--dur-fast:.06s;--dur:.1s;--dur-slow:.16s;--dur-theme:.2s}
:root[data-motion="off"]{--motion:0;--dur-fast:0s;--dur:0s;--dur-slow:0s;--dur-theme:0s}

/* === 组件级令牌 === */
:root{
  --card-bg:var(--t-surface);
  --card-border:var(--t-line);
  --card-radius:var(--r-md);
  --card-shadow:var(--t-shadow);
  --card-pad:var(--pad);
  --field-bg:var(--t-surface);
  --field-border:var(--t-line-firm);
  --field-radius:var(--r-sm);
  --focus-ring:0 0 0 3px var(--t-focus);
  /* 数字一律用等宽字形：额度、权重、时长、上限在本界面出现极频繁，
     对齐后能整列扫读，而不是逐行读。 */
  --numeric-font:"MiSans","SF Mono","Cascadia Mono",Consolas,monospace;
  --numeric-spacing:.01em;
  /* 别名：保留给早期页面用的名字。--t-danger 曾在 semantic-page.css 里被引用
     却从未声明，那条 color 声明整条失效、警告文字退化成普通正文色。
     别名集中在这里，别再让页面各自拼一个令牌名。 */
  --t-danger:var(--t-risk-ink);
  --t-danger-quiet:var(--t-risk-quiet);
  --t-caution:var(--t-warn-ink);
}

/* === 维度作用到既有排版 === */
/* .large-text 是类选择器，优先级高于 :root[data-type-scale] body，
   所以这里要显式写出复合情况，否则「放大辅助文字」一开，字号设置就失效。 */
:root[data-type-scale] body{font-size:calc(14px * var(--font-scale))}
:root[data-type-scale] body.large-text{font-size:calc(16px * var(--font-scale))}
:root[data-motion] *,:root[data-motion] *::before,:root[data-motion] *::after{
  transition-duration:var(--dur)!important;
}
:root[data-motion="low"] *,:root[data-motion="low"] *::before,:root[data-motion="low"] *::after,
:root[data-motion="off"] *,:root[data-motion="off"] *::before,:root[data-motion="off"] *::after{
  animation-duration:0s!important;
}
:root[data-radius] .panel,
:root[data-radius] .content-panel,
:root[data-radius] .capability,
:root[data-radius] .console-section,
:root[data-radius] .empty-state{
  border-radius:var(--r-lg);
}

/* === 主题叠化覆层 ===
   自定义属性不能插值——改 data-theme 是整页令牌在一帧内换掉。
   所以换主题时不逐属性过渡，而是盖一层用旧主题渲染的覆层再淡出：
   视觉上两个主题叠化，且不需要给任何组件补 transition。 */
.theme-crossfade{
  position:fixed;
  inset:0;
  z-index:9999;
  pointer-events:none;
  background:var(--t-canvas);
  opacity:1;
}
.theme-crossfade.is-fading{transition:opacity var(--dur-theme) ease;opacity:0}

/* 首屏引导：主题读到之前不显示任何界面，避免默认主题闪一下再切。
   引导脚本在样式生效前就写好 data-theme，读到即移除本属性。 */
:root:not([data-theme-ready]) body{visibility:hidden}
:root[data-motion="off"]:not([data-theme-ready]) body{visibility:visible}

/* 小屋就绪闸门。
 *
 * 问题：左栏、顶栏、右栏状态卡、下方面板都是纯 DOM，先就位；而体素包
 * （assets/voxel-room.js，677 KB、defer）要下载并解析完，app.js 才第一次
 * mountStage()。中间的几百毫秒里 .room-stage 只是一个 clamp(360px,46vh,520px)
 * 的空盒子——用户看到的是「UI 全部加载好了，小屋才出现」。
 *
 * 更糟的是入场序列会把顺序固定下来：entrance.css 的 UI 浮现延迟是 1920ms
 * （pullBack 1500 + settle 420，与 entrance.js 的 TIMING 对齐），而它的前提是
 * 「小屋先到、UI 后到」。现在实际反了，于是那 1920ms 里屏幕上什么都没有，
 * 等小屋到了才在已经铺好的页面里补一场搭建动画。
 *
 * 解法与上面那条同源：把闸门从「主题读到」放宽到「体素包也到了」。
 * 首帧就是入场序列的第一拍（全屏静置），而不是先画一页再补动画。
 *
 * data-room-ready 由 voxel-room.js 的 onload 写入，兜底 3 秒——体素包万一
 * 加载失败（网络、被拦截），页面不能一直白着；到期放行，由 mountStage 的
 * catch 走 showVoxelFallback()。放行逻辑见 index.html 的引导脚本。 */
:root:not([data-room-ready]) body{visibility:hidden}
:root[data-motion="off"]:not([data-room-ready]) body{visibility:visible}

/* 尊重系统偏好：与我们自己的动效维度取更严格的一方。 */
@media (prefers-reduced-motion: reduce){
  .theme-crossfade.is-fading{transition-duration:.01s}
}

.wrap{max-width:1180px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.bar h1{font-size:14px;font-weight:600;margin:0 auto 0 0;color:var(--t-text-strong)}
.bar button{font:inherit;font-size:12px;padding:6px 11px;border-radius:6px;cursor:pointer;
  color:var(--t-text);background:var(--t-surface);border:1px solid var(--t-line-firm)}
.bar button:hover{background:var(--t-surface-soft)}
.bar .hint{font-size:11px;color:var(--t-text-faint);width:100%;margin:0}
/* 预览划一条边界：框内是页面本体。 */
#contactWorkspace{border:1px dashed var(--t-line-firm);border-radius:9px;padding:16px;
  background:var(--t-surface-soft)}

/* ===== contact-page.css 原样内联 ===== */
/* 陪伴小屋 · 主动与联系（节律盘）
   联系是六个专题域里唯一「按一天分布」的域：一天 24 格里哪些允许开口、
   两次之间隔多久、连发几轮、什么时候收尾。这一页的视觉重量全部用来
   把那个分布画出来——一个钟面，四圈同心。

   为什么不是记忆页那套档案库：记忆的轴是**生命周期**（写入→更正→撤回→遗忘），
   联系的轴是**时刻**。同一个布局套两个轴向不同的域，等于把时间画成状态。

   色值全部走 tokens.css 的语义令牌（不得写死十六进制），
   切主题时整页跟着变。环上四圈各自的语义色映射到令牌：
     免打扰 → --t-text-faint（不是危险色：静默是设计出来的，不是故障）
     活动曲线柱子 → --t-accent（峰值另用 --t-accent-solid）
     强度档位 → --t-warn（它同时放宽间隔与收窄门槛，属于「会放大」的那类）
     问候窗口 → --t-ok（有界且明确的时刻）
   环心状态四档用 ok / faint / warn / risk，与判定四档一一对应。

   版式：桌面第一行是「盘面 + 三个总开关 + 免打扰」，下面三块铺满整页宽；
   窄屏全部单栏，盘面缩小到 240px 以让出首屏。 */

.ct-app{
  display:grid;grid-template-columns:206px minmax(0,1fr);
  gap:var(--sp-5);align-items:start;
  color:var(--t-text);font-size:var(--fs-body);line-height:1.7;

  /* 纵向节奏三档。之前这一页的纵向间距是「哪儿有地方就往哪儿塞」：
     同一列表里相邻两行只差 1px，而相邻两块之间却有 16px——
     行距比块距还小，一屏读下来是一条糊掉的带子，边界全靠 hover 才看得见。
     现在按「相邻的两样是不是同一件事」分档：
       section 30px：一屏里的大块之间（换话题）
       block   22px：卡片与卡片、卡片内的小节之间（换一组）
       row      8px：同一个列表里行与行之间（同一组的下一条）
     三者都挂在共享的 sp token 上而不是写死 px，
     紧凑 / 宽松两档密度改 sp 时这里会跟着变。 */
  --ct-v-section:var(--sp-6);
  --ct-v-block:var(--sp-5);
  --ct-v-row:var(--sp-2);
}
.ct-main{min-width:0;display:flex;flex-direction:column;gap:var(--ct-v-section)}
/* 换页容器。页头、提示、正文一起进出：它们是一屏的三段，
   只滑正文会出现「标题先换、内容后到」的两拍。 */
.ct-view{display:flex;flex-direction:column;gap:var(--ct-v-section);min-width:0}
/* 换页入场。旧的一屏没法离场（DOM 整块重写），所以只写入场；
   位移带方向：往后点从右边进、往回点从左边进，
   没有方向的话换页就是「闪一下」，说不清是往哪走。
   只动 transform 与 opacity：这一屏重的时候有二十来个字段，
   动画属性一多就开始掉帧。 */
@keyframes ct-view-next{from{opacity:0;transform:translate3d(22px,0,0)}}
@keyframes ct-view-prev{from{opacity:0;transform:translate3d(-22px,0,0)}}
.ct-view.is-from-next{animation:ct-view-next .3s cubic-bezier(.22,1,.36,1)}
.ct-view.is-from-prev{animation:ct-view-prev .3s cubic-bezier(.22,1,.36,1)}

/* ===== 左侧轨道 =====
   五项不是平级页签：节律盘是「此刻」，其余是配置面。
   用一条竖线串起来，与记忆页的轨道同源但更窄——这一页只有五项。 */
.ct-rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:12px;min-width:0}
.ct-rail::before{
  content:"";position:absolute;left:15px;top:22px;bottom:22px;width:1px;
  background:var(--t-line);z-index:0;
}
.ct-rail button{
  position:relative;z-index:1;display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-2);border:0;border-radius:var(--r-sm);background:transparent;
  color:var(--t-text-soft);font:inherit;font-size:var(--fs-body);text-align:left;cursor:pointer;
  transition:background .18s ease,color .18s ease;
}
.ct-rail button:hover{background:var(--t-surface-soft);color:var(--t-text)}
.ct-rail button[aria-pressed="true"]{
  background:var(--t-surface-raised);color:var(--t-text-strong);
  font-weight:600;box-shadow:var(--t-shadow);
}
.ct-rail-icon{
  flex:none;display:grid;place-items:center;width:31px;height:31px;
  border:1px solid var(--t-line);border-radius:50%;
  background:var(--t-surface);color:var(--t-text-faint);
  transition:border-color .18s ease,color .18s ease,background .18s ease;
}
.ct-rail button[aria-pressed="true"] .ct-rail-icon{
  border-color:transparent;background:var(--t-accent-quiet);color:var(--t-accent-ink);
}
/* 点中那一下。按钮每次渲染都重建，选中态的 transition 永远不会响，
   所以「啪」地贴上去的观感要靠一次性动画补：
   底色从「未选中」的透明长成高亮，图标弹一下 —— from 写旧模样、to 不写，
   终点自动落在选中态上。 */
@keyframes ct-rail-pick{from{background:transparent;box-shadow:none}}
@keyframes ct-rail-pop{from{transform:scale(.82)}}
.ct-rail button.is-picked{animation:ct-rail-pick .26s ease}
.ct-rail button.is-picked .ct-rail-icon{animation:ct-rail-pop .34s cubic-bezier(.34,1.4,.5,1)}
.ct-rail-icon svg{width:16px;height:16px}
.ct-rail-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== 页头 ===== */
.ct-head{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  flex-wrap:wrap;
}
.ct-head-main{display:flex;align-items:center;gap:var(--sp-2);min-width:0}
.ct-head h2{margin:0;font-size:var(--fs-title);font-weight:650;color:var(--t-text-strong)}
/* 页头上的判定徽标：与环心同一套色，两处看到的是同一个判定。 */
.ct-verdict{
  display:inline-flex;align-items:center;gap:var(--sp-1);padding:2px var(--sp-2) 2px var(--sp-2);
  border-radius:var(--r-pill);font-size:var(--fs-tiny);font-weight:600;
  background:var(--t-surface-soft);color:var(--t-text-soft);
  transition:background var(--dur-fast) ease,color var(--dur-fast) ease;
}
.ct-verdict .ct-dot{
  width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;
}
.ct-verdict.is-open{background:var(--t-ok-quiet);color:var(--t-ok-ink)}
.ct-verdict.is-open .ct-dot{animation:ct-breathe 2.6s ease-in-out infinite}
.ct-verdict.is-quiet{background:var(--t-surface-soft);color:var(--t-text-faint)}
.ct-verdict.is-low{background:var(--t-warn-quiet);color:var(--t-warn-ink)}
.ct-verdict.is-blocked{background:var(--t-risk-quiet);color:var(--t-risk-ink)}
@keyframes ct-breathe{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.5);opacity:.55}
}
.ct-head-actions{display:flex;gap:var(--sp-2);flex:none}
.ct-btn{
  display:inline-flex;align-items:center;gap:var(--sp-1);
  padding:var(--sp-1) var(--sp-3);border:1px solid var(--t-line);border-radius:var(--r-sm);
  background:var(--t-surface);color:var(--t-text-soft);
  font:inherit;font-size:var(--fs-body);cursor:pointer;
  transition:background .16s ease,border-color .16s ease,color .16s ease,transform .1s ease;
}
.ct-btn svg{width:14px;height:14px}
.ct-btn:hover:not(:disabled){background:var(--t-surface-soft);color:var(--t-text);border-color:var(--t-line-firm)}
.ct-btn:active:not(:disabled){transform:translateY(1px)}
.ct-btn:disabled{opacity:.5;cursor:default}
.ct-btn.is-primary{
  background:var(--t-accent-solid);color:var(--t-on-solid);border-color:transparent;font-weight:600;
}
.ct-btn.is-primary:hover:not(:disabled){background:var(--t-accent-solid-hover);color:var(--t-on-solid)}
.ct-btn.is-quiet{border-color:transparent;background:transparent;padding:var(--sp-1) var(--sp-2);color:var(--t-text-faint)}
.ct-btn.is-quiet:hover{background:var(--t-surface-soft);color:var(--t-text-soft)}

/* ===== 通知 ===== */
.ct-notice{
  display:flex;align-items:flex-start;gap:var(--sp-2);margin:0;
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);
  background:var(--t-ok-quiet);color:var(--t-ok-ink);font-size:var(--fs-body);
}
.ct-notice.is-error{background:var(--t-risk-quiet);color:var(--t-risk-ink)}
.ct-notice svg{width:14px;height:14px;flex:none;margin-top:3px}
.ct-notice span{flex:1;min-width:0}
.ct-notice button{
  border:0;background:transparent;color:inherit;font-size:var(--fs-title);line-height:1;cursor:pointer;
  padding:0 2px;opacity:.6;
}
.ct-notice button:hover{opacity:1}

/* ===== 空态 ===== */
.ct-empty{
  display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
  padding:var(--sp-7) var(--sp-5);text-align:center;color:var(--t-text-faint);
  border:1px dashed var(--t-line);border-radius:var(--r-md);
}
.ct-empty svg{width:22px;height:22px}
.ct-empty strong{color:var(--t-text-soft);font-size:var(--fs-body)}
.ct-empty p{margin:0;font-size:var(--fs-body);max-width:44ch}
.ct-spinner{
  width:15px;height:15px;border-radius:50%;
  border:2px solid var(--t-line);border-top-color:var(--t-accent);
  animation:ct-spin .7s linear infinite;
}
@keyframes ct-spin{to{transform:rotate(360deg)}}

/* ===== 节律盘：盘面 + 总开关 + 免打扰同一行 =====
   第一行只放「一改就立刻改变盘面几何」的那几项：盘面、三个总开关、免打扰外圈。
   改完不用滚动就能看见环变了——控件与图形同屏，这是这一行存在的唯一理由。
   下面三块（24 格曲线 / 强度档位 / 三个窗口）是「按一天铺开的数据」，
   它们铺满整页宽而不是挤在右栏：24 根柱子需要的是横向空间，
   放在 320px 的栏里每根柱子只剩十来像素，谁也读不出来。
   盘面保持 sticky：下面三块可以很长，滚下去时「此刻」不该滚出视野。 */
.ct-dial-wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:var(--sp-5);align-items:start}
.ct-dial-stage{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:var(--sp-3)}
.ct-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--ct-v-block);align-content:start;min-width:0}
/* .ct-rest 与 .ct-dial-wrap 是 .ct-main 的两个相邻子项，间距已由那里的
   flex gap 给出，这里不再加 margin——两处都加会得到双倍行距。 */
.ct-rest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--ct-v-block);align-items:start}
.ct-rest > .is-wide{grid-column:1 / -1}

/* 钟面本体。四圈同心，半径在 JS 里固定：
   免打扰 132 / 曲线 112 / 问候 94 / 强度 76，中心 150（viewBox 300）。 */
.ct-dial{width:100%;max-width:340px;height:auto;display:block;overflow:visible}
.ct-ring-base{fill:none;stroke:var(--t-line);stroke-width:1;opacity:.7}
/* 刻度：六个小时点长一点，其余只点一下。0/6/12/18 带数字。 */
.ct-tick{stroke:var(--t-line-firm);stroke-width:1;stroke-linecap:round;opacity:.55}
.ct-tick.is-major{stroke:var(--t-text-faint);stroke-width:1.4;opacity:.85}
.ct-tick-label{fill:var(--t-text-faint);font-size:var(--fs-micro);text-anchor:middle;font-variant-numeric:tabular-nums}

/* 外圈 · 免打扰弧。静默是设计出来的，所以用中性色而不是危险色：
   它不该看起来像故障。 */
.ct-quiet path{
  stroke:var(--t-text-faint);stroke-linecap:butt;opacity:.22;
  transition:opacity var(--dur-slow) ease;
}
.ct-quiet.is-on path{opacity:.5}
.ct-quiet.is-on:hover path{opacity:.72}

/* 次圈 · 24 小时活动柱子。未启用时全部等高且极淡——
   「曲线没开」和「曲线全是 1.0」在视觉上必须不同，否则用户分不清
   自己是没开还是拉平了。 */
.ct-bar{
  stroke:var(--t-line);stroke-width:5.4;stroke-linecap:round;opacity:.42;
  /* 柱子沿半径方向长大，所以变换原点必须是**环心**（viewBox 300 见方，
     中心 150,150），不是柱子自己的包围盒——用 fill-box 的话每根柱子
     会各转各的，波形就散了。 */
  transform-box:view-box;transform-origin:150px 150px;
}
.ct-bar.is-on{stroke:var(--t-accent);opacity:.72}
.ct-bar.is-peak{stroke:var(--t-accent-solid);opacity:.95}
/* 开页涟漪：24 根柱子从 0:00（正上方）向两侧依次立起来，在 12:00 会合。
   延迟按「到 0:00 的环形距离」而不是下标：按下标排的话波前只有一个方向，
   看起来是「逐根加载」，不是一圈荡开的涟漪。波前走完 12 格 × 26ms ≈ 312ms，
   加 780ms 时长刚好一秒出头，再长就挡住页面了。
   关键帧只写 from 与中段、**不写 to**：to 由元素自身的层叠值补齐，
   于是峰值柱（.is-peak，opacity .95）落回 .95 而不是被硬编码成 .72。 */
.ct-dial.is-scanning .ct-bar.is-on{
  animation:ct-bar-ripple .78s cubic-bezier(.22,.9,.28,1) both;
  animation-delay:calc(var(--i,0) * 26ms);
}
@keyframes ct-bar-ripple{
  from{opacity:0;transform:scale(.62)}
  58%{opacity:1;transform:scale(1.1)}
}
.ct-dial.is-entering{animation:ct-draw .82s cubic-bezier(.16,1,.3,1) both}
@keyframes ct-draw{from{opacity:0;transform:rotate(-7deg) scale(.94)}to{opacity:1;transform:none}}
/* 切强度档位时的一次短促呼吸：只有这一圈会变，盘面替它说明。
   触发方式是 .ct-dial-stage.is-pulse-tier（见下面「盘面变化」一节），
   不是当场往 DOM 上加类——加在旧节点上会被紧接着的 render() 换掉，
   动画一帧都放不出来。 */
.ct-dial-stage.is-pulse-tier .ct-dial{animation:ct-shift .5s cubic-bezier(.34,1.4,.5,1)}
@keyframes ct-shift{
  0%{transform:scale(1)}
  42%{transform:scale(1.028)}
  100%{transform:scale(1)}
}

/* 三圈 · 问候窗口与失眠窗口。弧要沿半径方向起落，原点同样取环心。 */
.ct-anchor path{
  stroke:var(--t-ok);stroke-linecap:round;opacity:.62;cursor:pointer;
  transform-box:view-box;transform-origin:150px 150px;
}
.ct-anchor:hover path{opacity:.95}
.ct-insomnia path{
  stroke:var(--t-warn);stroke-linecap:round;opacity:.5;stroke-dasharray:2 3;
  transform-box:view-box;transform-origin:150px 150px;
}

/* 游标：从环心指出的一条细线加一个小圆，按角色所在时区走。 */
.ct-cursor-line{stroke:var(--t-text-strong);stroke-width:1;opacity:.3}
.ct-cursor-dot{fill:var(--t-accent-solid);stroke:var(--t-surface);stroke-width:2}
.ct-dial.is-scanning .ct-cursor-dot{animation:ct-cursor-in .9s ease-out both}
@keyframes ct-cursor-in{from{r:0}to{r:3.6}}
.ct-scan-hint{font-size:var(--fs-tiny);color:var(--t-text-faint);text-align:center}

/* ===== 盘面变化 =====
   用户改了某一圈，就只让那一圈动：整盘一起闪等于什么都没说清。
   类加在 .ct-dial-stage 上（.ct-center 是 svg 的兄弟节点，不在 svg 里），
   `is-pulse-*` 由 JS 按「改动的字段属于哪一圈」逐帧给出，见 PULSE_PART。
   这些规则必须排在 .is-scanning 的柱子规则**之后**：开页与改动互斥，
   但万一同时命中，最后一条声明生效——让「刚改的那一圈」赢，而不是入场。 */
.ct-dial-stage.is-pulse-quiet .ct-quiet path{animation:ct-quiet-bloom .62s cubic-bezier(.22,.9,.28,1) both}
@keyframes ct-quiet-bloom{from{opacity:0;stroke-width:1}}
.ct-dial-stage.is-pulse-curve .ct-bar.is-on{
  animation:ct-bar-swell .5s cubic-bezier(.22,.9,.28,1) both;
  animation-delay:calc(var(--i,0) * 14ms);
}
@keyframes ct-bar-swell{from{transform:scale(.86)}55%{transform:scale(1.06)}}
.ct-dial-stage.is-pulse-greet .ct-anchor path{
  animation:ct-anchor-in .5s cubic-bezier(.22,.9,.28,1) both;
  animation-delay:calc(var(--a,0) * 70ms);
}
.ct-dial-stage.is-pulse-greet .ct-insomnia path{animation:ct-anchor-in .5s cubic-bezier(.22,.9,.28,1) both}
@keyframes ct-anchor-in{from{opacity:0;transform:scale(.9)}}
.ct-dial-stage.is-pulse-cursor .ct-cursor-dot{animation:ct-cursor-in .45s ease-out both}
.ct-dial-stage.is-pulse-cursor .ct-cursor-line{animation:ct-cursor-fade .45s ease-out both}
@keyframes ct-cursor-fade{from{opacity:0}}
.ct-dial-stage.is-pulse-center .ct-center{animation:ct-center-in .46s cubic-bezier(.22,.9,.28,1) both}
@keyframes ct-center-in{from{opacity:0;transform:translate(-50%,-46%)}}

/* 环心：这一页唯一一句「此刻」。
   absolute 定位在钟面正中，宽度限制在 30% 以内，避免压到柱子。
   这里**不再**声明 position: .ct-dial-stage 已经是 sticky（sticky 也是定位元素，
   足够当绝对定位的包含块）。原先这里有一条 `position:relative`，
   它排在 sticky 后面、又只改 position 不改 top——于是 `top:12px` 落在一个
   relative 元素上，把整个盘面往下推了 12px，而 sticky 一次都没生效过。 */
.ct-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:44%;max-width:150px;display:flex;flex-direction:column;align-items:center;
  gap:var(--sp-1);text-align:center;pointer-events:none;
}
.ct-center-title{font-size:var(--fs-body);font-weight:650;line-height:1.3}
.ct-center-detail{font-size:var(--fs-tiny);line-height:1.5;color:var(--t-text-faint)}
.ct-center-flag{
  display:inline-flex;align-items:center;gap:var(--sp-1);margin-top:2px;
  font-size:var(--fs-micro);color:var(--t-warn-ink);
}
.ct-center-flag svg{width:11px;height:11px}
.ct-center.is-open .ct-center-title{color:var(--t-ok-ink)}
.ct-center.is-open .ct-dot{color:var(--t-ok)}
.ct-center.is-quiet .ct-center-title{color:var(--t-text-soft)}
.ct-center.is-low .ct-center-title{color:var(--t-warn-ink)}
.ct-center.is-blocked .ct-center-title{color:var(--t-risk-ink)}
/* 钟面正中的小圆点是「此刻可以开口」的呼吸点，只在 open 时出现。 */
.ct-center.is-open::before{
  content:"";position:absolute;left:50%;top:-16px;width:5px;height:5px;border-radius:50%;
  transform:translateX(-50%);background:var(--t-ok);
  animation:ct-breathe 2.6s ease-in-out infinite;
}

/* ===== 控制块 =====
   .ct-controls 的排布在「节律盘」那一节定义（第一行的两栏卡片）。 */
.ct-block{
  display:flex;flex-direction:column;gap:var(--sp-4);
  padding:var(--ct-v-block);border:1px solid var(--t-line);border-radius:var(--r-md);
  background:var(--t-surface);
}
/* 标题前一小段色条，颜色就是这一块管的那一圈：免打扰中性、曲线强调色、
   档位警告色、问候成功色。与盘面四圈同一套映射，看标题就知道改的是哪一圈。 */
.ct-block > h3{
  display:flex;align-items:center;gap:var(--sp-2);margin:0;
  font-size:var(--fs-body);font-weight:650;color:var(--t-text-strong);
  letter-spacing:.02em;
}
.ct-block > h3::before{
  content:"";flex:none;width:3px;height:12px;border-radius:var(--r-2xs);
  background:var(--ring,var(--t-line-firm));opacity:.9;
}
.ct-block.is-ring-quiet{--ring:var(--t-text-faint)}
.ct-block.is-ring-curve{--ring:var(--t-accent)}
.ct-block.is-ring-tier{--ring:var(--t-warn)}
.ct-block.is-ring-greet{--ring:var(--t-ok)}
.ct-note{margin:0;font-size:var(--fs-tiny);color:var(--t-text-faint);line-height:1.6}

/* 开关。整行可点，说明写在标签里——比把说明另起一行更省纵向空间。
   画法：轨道是一枚描边胶囊（不用 border，避免与内阴影叠出双层边），
   滑块是实心圆、带投影；开启时整条轨道填成实色、滑块反白。
   上一版的坑在「关」态：轨道用近白的 sunken 面、滑块用纯白，
   两者只差一点亮度，剩下的全靠一圈 1px 深描边——远看就是个空的小方框，
   滑块根本看不见。现在关态轨道用 text-faint 调进 surface 的中灰（color-mix，
   六套主题各自调出各自的灰），滑块纯白 + 投影，不靠描边撑轮廓。
   尺寸 40×22：滑块 18、行程 18px 都是整数，缩放到非整数倍时不会糊。 */
.ct-switch{
  display:flex;align-items:flex-start;gap:var(--sp-2);padding:var(--sp-1) 0;cursor:pointer;
  border-radius:var(--r-xs);
}
.ct-switch input{position:absolute;opacity:0;width:0;height:0}
.ct-switch-track{
  /* 「关」态轨道色：写成局部变量，让下面两条翻转动画的起点能直接引用，
     色值只此一处，改色不会改漏一边。 */
  --switch-off:color-mix(in srgb,var(--t-text-faint) 32%,var(--t-surface));
  flex:none;position:relative;width:40px;height:22px;margin-top:1px;
  border-radius:var(--r-pill);background:var(--switch-off);
  transition:background .24s cubic-bezier(.4,0,.2,1);
}
.ct-switch-track i{
  position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:var(--t-surface-raised);
  box-shadow:0 1px 3px rgba(0,0,0,.28),0 0 1px rgba(0,0,0,.14);
  transition:transform .26s cubic-bezier(.34,1.32,.5,1),background .24s ease;
}
/* 悬停只加深轨道，不换底色语义：轨道底色的变化留给「开 / 关」这一个含义。 */
.ct-switch:hover .ct-switch-track{background:color-mix(in srgb,var(--t-text-faint) 48%,var(--t-surface))}
.ct-switch input:checked + .ct-switch-track{background:var(--t-accent-solid)}
.ct-switch input:checked + .ct-switch-track i{
  transform:translateX(18px);background:var(--t-on-solid);
}
/* 翻转动画。
   为什么是 keyframes 而不是接着用 transition：点开关会整块重写 DOM，
   新节点一出生就是终态（input 已 checked），transition 没有起点可插值，
   于是「扳动」这一步在界面上是凭空跳变，开和关都没有动画可言。
   两向各写一条一次性动画：from 是**改动前**的模样，to 不写，
   隐式终点取当前计算值，播完自然停在终态，不需要额外收尾。
   曲线上一开一关不对称：开带一点回弹（顶到头才有「扣上了」的手感），
   关走 ease-out 且短一些——关是「收」，再加回弹会显得拖沓。 */
@keyframes ct-flip-on-track{from{background:var(--switch-off)}}
@keyframes ct-flip-off-track{from{background:var(--t-accent-solid)}}
@keyframes ct-flip-on-knob{from{transform:translateX(0)}}
@keyframes ct-flip-off-knob{from{transform:translateX(18px)}}
.ct-switch.is-flip-on .ct-switch-track{animation:ct-flip-on-track .26s cubic-bezier(.34,1.4,.5,1)}
.ct-switch.is-flip-off .ct-switch-track{animation:ct-flip-off-track .2s ease-out}
.ct-switch.is-flip-on .ct-switch-track i{animation:ct-flip-on-knob .26s cubic-bezier(.34,1.4,.5,1)}
.ct-switch.is-flip-off .ct-switch-track i{animation:ct-flip-off-knob .2s ease-out}
/* 触发源的开关与节律盘那一屏的主配置开关共用同一套画法，只是类挂的位置不同
   （那边挂在 .ct-switch 上，这边挂在 .ct-src-row.is-toggle 上），两边都要能播。 */
.ct-src-row.is-toggle.is-flip-on .ct-switch-track{animation:ct-flip-on-track .26s cubic-bezier(.34,1.4,.5,1)}
.ct-src-row.is-toggle.is-flip-off .ct-switch-track{animation:ct-flip-off-track .2s ease-out}
.ct-src-row.is-toggle.is-flip-on .ct-switch-track i{animation:ct-flip-on-knob .26s cubic-bezier(.34,1.4,.5,1)}
.ct-src-row.is-toggle.is-flip-off .ct-switch-track i{animation:ct-flip-off-knob .2s ease-out}
/* 整行闪一下，作为「这条刚动过」的回执。两个方向闪同一种色：
   开关往哪边走已经由滑块说清楚了，行闪只负责「我收到了」，不抢占方向信息。 */
@keyframes ct-row-flash{from{background:var(--t-accent-quiet)}}
.ct-src-row.is-flip-on,.ct-src-row.is-flip-off{animation:ct-row-flash .5s ease-out}
.ct-switch input:checked + .ct-switch-track:hover{background:var(--t-accent-solid-hover)}
.ct-switch input:focus-visible + .ct-switch-track{outline:2px solid var(--t-focus);outline-offset:2px}
.ct-switch-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.ct-switch-text strong{font-size:var(--fs-body);font-weight:600;color:var(--t-text)}
.ct-switch-text small{font-size:var(--fs-tiny);color:var(--t-text-faint);line-height:1.5}
/* 改过但没保存的字段左边一条竖线。不用边框包整行，那会让一排开关看起来像表格。 */
.ct-switch.is-dirty,.ct-field.is-dirty,.ct-field-pair.is-dirty,.ct-quota.is-dirty,
.ct-src-row.is-dirty{
  box-shadow:inset 2px 0 0 var(--t-caution);
}

/* 文本 / 数字 / 时间字段 */
.ct-field{display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.ct-field-label{
  display:flex;align-items:baseline;gap:var(--sp-1);
  font-size:var(--fs-tiny);font-weight:600;color:var(--t-text-soft);
}
.ct-field-label small{font-weight:400;color:var(--t-text-faint);font-variant-numeric:tabular-nums}
.ct-field input,.ct-field select,.ct-field textarea{
  width:100%;padding:var(--sp-2) var(--sp-2);box-sizing:border-box;
  border:1px solid var(--t-line);border-radius:var(--r-sm);
  background:var(--t-surface-sunken);color:var(--t-text);
  font:inherit;font-size:var(--fs-body);
  transition:border-color .16s ease,background .16s ease;
}
.ct-field textarea{resize:vertical;line-height:1.6}
.ct-field input:focus,.ct-field select:focus,.ct-field textarea:focus{
  outline:none;border-color:var(--t-accent);background:var(--t-surface);
}
.ct-field-help{font-size:var(--fs-tiny);color:var(--t-text-faint);line-height:1.5}
.ct-field-pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);padding:2px 0}
.ct-field-pair .ct-field-help{grid-column:1 / -1}
.ct-input-unit{display:flex;align-items:center;gap:var(--sp-1)}
.ct-input-unit i{font-style:normal;font-size:var(--fs-tiny);color:var(--t-text-faint);flex:none}

/* ===== 强度档位 =====
   五档并排，各带一条按 (1 − interval_factor) 变长的底条：
   档位的差别是「更快 / 更多」，这句话只有并排画出来才成立。 */
.ct-tiers{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.ct-tier{
  position:relative;flex:1 1 0;min-width:74px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:var(--sp-3) var(--sp-2) var(--sp-3);overflow:hidden;
  border:1px solid var(--t-line);border-radius:var(--r-sm);
  background:var(--t-surface-sunken);color:var(--t-text-soft);
  font:inherit;cursor:pointer;
  transition:border-color .18s ease,background .18s ease,color .18s ease,transform .16s ease;
}
.ct-tier:hover{border-color:var(--t-line-firm);color:var(--t-text);transform:translateY(-1px)}
.ct-tier.is-on{
  border-color:var(--t-accent);background:var(--t-surface);color:var(--t-text-strong);
}
.ct-tier-bar{
  position:absolute;left:0;bottom:0;height:3px;width:var(--fill);
  background:var(--t-warn);opacity:.5;
  transition:width .42s cubic-bezier(.16,1,.3,1),opacity .2s ease;
}
.ct-tier.is-on .ct-tier-bar{opacity:1}
.ct-tier-label{font-size:var(--fs-body);font-weight:600}
.ct-tier-meta{font-size:var(--fs-micro);color:var(--t-text-faint);font-variant-numeric:tabular-nums}
.ct-tier.is-dirty{box-shadow:inset 2px 0 0 var(--t-caution)}

/* ===== 24 小时曲线编辑器 =====
   可直接拖涂：按住横拖过若干小时就改成那个高度。
   24 个数字没人愿意输，但涂一条线谁都愿意。 */
.ct-curve{display:flex;flex-direction:column;gap:var(--sp-2)}
.ct-curve-plot{
  position:relative;display:flex;align-items:flex-end;gap:1px;
  height:96px;padding:var(--sp-1);box-sizing:border-box;
  border:1px solid var(--t-line);border-radius:var(--r-sm);
  background:var(--t-surface-sunken);cursor:crosshair;
  touch-action:none;
}
.ct-curve-col{
  flex:1 1 0;display:flex;align-items:flex-end;height:100%;min-width:0;
}
.ct-curve-col i{
  display:block;width:100%;min-height:2px;border-radius:var(--r-2xs) var(--r-2xs) 0 0;
  background:var(--t-line-firm);opacity:.6;
  transition:height .1s ease,background .16s ease,opacity .16s ease;
}
.ct-curve.is-on .ct-curve-col i{background:var(--t-accent);opacity:.7}
.ct-curve-col:hover i{background:var(--t-accent-solid);opacity:1}
.ct-curve-axis{
  position:relative;height:13px;font-size:var(--fs-micro);color:var(--t-text-faint);
  font-variant-numeric:tabular-nums;
}
.ct-curve-axis span{position:absolute;left:var(--at);transform:translateX(-50%)}
.ct-curve-actions{display:flex;align-items:center;gap:var(--sp-1);flex-wrap:wrap}
/* 拖涂只有指针设备能用，所以下面那个文本口是键盘用户唯一的入口。 */
.ct-curve-text textarea{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:var(--fs-tiny);line-height:1.5;word-break:break-all;
}

/* ===== 契机矩阵 =====
   15 类契机 × 三列。权重不是数字输入而是**条形**——权重是相对值，
   绝对值没有意义，只有一列里并排画出来才知道谁主要。 */
.ct-purposes{display:flex;flex-direction:column;gap:var(--ct-v-block)}
.ct-purposes-sum{
  font-size:var(--fs-body);color:var(--t-text-soft);padding:0 2px;
}
.ct-purposes-sum strong{color:var(--t-text-strong);font-size:var(--fs-lead);font-variant-numeric:tabular-nums}
.ct-bucket{
  display:flex;flex-direction:column;gap:var(--sp-3);
  padding:var(--ct-v-block);border:1px solid var(--t-line);border-radius:var(--r-md);
  background:var(--t-surface);
}
.ct-bucket > header{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap}
.ct-bucket > header h3{margin:0;font-size:var(--fs-body);font-weight:650;color:var(--t-text-strong)}
.ct-bucket > header span{font-size:var(--fs-tiny);color:var(--t-text-faint);flex:1;min-width:0}
.ct-bucket > header em{
  font-style:normal;font-size:var(--fs-micro);color:var(--t-text-faint);
  padding:1px var(--sp-2);border-radius:var(--r-pill);background:var(--t-surface-soft);
}
/* 行与行之间给 8px：之前是 1px，15 行挤成一条连续的带子，
   只能靠 hover 底色才知道这一行到哪儿结束。行距必须比行内的内容间距大，
   否则「同一行的三列」和「相邻的两行」在视觉上是同一种距离。 */
.ct-purpose-list{display:flex;flex-direction:column;gap:var(--ct-v-row)}
.ct-purpose{
  display:grid;
  /* 三段分宽按「谁需要横向空间」：名字列 max-content——它曾用 1fr
     固定占一份，而最长的名字也只有七个字，于是每行名字右侧都拖着
     一段谁也不用的空白，权重条却被压在中间；改后名字贴着文字，
     让出的宽度全给权重条。权重条 1fr：相对长短只有拉开了才读得出。
     状态列 max-content：所有行按最宽的那枚章对齐，既不裁字也不乱。 */
  grid-template-columns:max-content minmax(260px,1fr) max-content;
  align-items:center;gap:var(--sp-4);
  padding:var(--sp-2) var(--sp-3);border-radius:var(--r-xs);
  transition:background .16s ease,opacity .16s ease;
}
.ct-purpose:hover{background:var(--t-surface-soft)}
/* 关闭的契机整体压暗但不隐藏——「这一类此刻不开」本身就是信息。 */
.ct-purpose:not(.is-on){opacity:.52}
.ct-purpose:not(.is-on):hover{opacity:.8}
.ct-purpose.is-blocked{opacity:.62}

.ct-check{display:flex;align-items:center;gap:var(--sp-2);cursor:pointer;min-width:0}
.ct-check input{position:absolute;opacity:0;width:0;height:0}
.ct-check-box{
  flex:none;display:grid;place-items:center;width:17px;height:17px;
  border:1px solid var(--t-line-firm);border-radius:var(--r-xs);
  background:var(--t-surface-sunken);color:transparent;
  transition:background .16s ease,border-color .16s ease,color .16s ease;
}
.ct-check-box svg{width:11px;height:11px}
.ct-check input:checked + .ct-check-box{
  background:var(--t-accent-solid);border-color:transparent;color:var(--t-on-solid);
}
.ct-check input:focus-visible + .ct-check-box{outline:2px solid var(--t-focus);outline-offset:2px}
.ct-purpose-name{
  font-size:var(--fs-body);color:var(--t-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ct-purpose.is-blocked .ct-purpose-name{color:var(--t-text-faint);text-decoration:line-through}

/* 权重条：range 铺满一层（透明轨道专供键盘与无障碍），
   填充条与数字在上面。 */
.ct-weight{position:relative;display:flex;align-items:center;gap:var(--sp-2)}
.ct-weight input[type="range"]{
  position:relative;z-index:2;flex:1;min-width:0;height:16px;margin:0;
  background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;
}
.ct-weight input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--t-accent-solid);border:2px solid var(--t-surface);cursor:grab;
}
.ct-weight input[type="range"]::-moz-range-thumb{
  width:11px;height:11px;border:2px solid var(--t-surface);border-radius:50%;
  background:var(--t-accent-solid);cursor:grab;
}
.ct-weight-fill{
  position:absolute;left:0;top:50%;height:4px;width:var(--w);transform:translateY(-50%);
  border-radius:var(--r-pill);background:var(--t-accent);opacity:.7;
  pointer-events:none;transition:width .12s ease;
}
.ct-weight::before{
  content:"";position:absolute;left:0;right:26px;top:50%;height:4px;transform:translateY(-50%);
  border-radius:var(--r-pill);background:var(--t-surface-sunken);pointer-events:none;
}
.ct-weight em{
  flex:none;width:24px;font-style:normal;font-size:var(--fs-micro);color:var(--t-text-faint);
  text-align:right;font-variant-numeric:tabular-nums;
}

.ct-purpose-state{display:flex;justify-content:flex-end}
.ct-chip{
  display:inline-block;padding:1px var(--sp-2);border-radius:var(--r-pill);
  font-size:var(--fs-micro);white-space:nowrap;
  background:var(--t-surface-soft);color:var(--t-text-faint);
}
.ct-chip.is-ok{background:var(--t-ok-quiet);color:var(--t-ok-ink)}
.ct-chip.is-risk{background:var(--t-risk-quiet);color:var(--t-risk-ink)}
.ct-chip.is-paused{background:var(--t-warn-quiet);color:var(--t-warn-ink)}

/* ===== 开口闸门 =====
   后端判定的顺序，一圈一圈往外。逐条入场（--i 是序号），
   让「哪一道先关」这个顺序看得见。 */
.ct-gates{display:flex;flex-direction:column;gap:var(--sp-4)}
.ct-gates-sum{margin:0;font-size:var(--fs-body);color:var(--t-text-soft)}
.ct-gates-sum strong{color:var(--t-risk-ink);font-size:var(--fs-lead);font-variant-numeric:tabular-nums}
.ct-gate{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-3);border:1px solid var(--t-line);border-radius:var(--r-sm);
  background:var(--t-surface);
  animation:ct-gate-in .42s cubic-bezier(.16,1,.3,1) both;
  animation-delay:calc(var(--i,0) * 38ms);
}
@keyframes ct-gate-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ct-gate-mark{
  display:grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:var(--t-surface-soft);color:var(--t-text-faint);
}
.ct-gate-mark svg{width:12px;height:12px}
.ct-gate.is-ok .ct-gate-mark{background:var(--t-ok-quiet);color:var(--t-ok-ink)}
.ct-gate.is-shut{border-color:var(--t-risk);background:var(--t-risk-quiet)}
.ct-gate.is-shut .ct-gate-mark{background:var(--t-risk);color:var(--t-on-solid)}
.ct-gate-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.ct-gate-body strong{font-size:var(--fs-body);font-weight:600;color:var(--t-text-strong)}
.ct-gate-body p{margin:0;font-size:var(--fs-tiny);color:var(--t-text-faint);line-height:1.5}
.ct-gate-body code{
  align-self:flex-start;margin-top:3px;padding:1px var(--sp-1);border-radius:var(--r-xs);
  background:var(--t-surface-sunken);color:var(--t-text-soft);
  font-size:var(--fs-micro);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.ct-gate-state{
  font-size:var(--fs-tiny);font-weight:650;color:var(--t-text-faint);white-space:nowrap;
}
.ct-gate.is-ok .ct-gate-state{color:var(--t-ok-ink)}
.ct-gate.is-shut .ct-gate-state{color:var(--t-risk-ink)}

/* ===== 额度与去重 =====
   额度没有实时读出口，所以画成刻度（两端写 0 与上限），不画进度条。
   画成进度条等于宣称知道已用量——那是编的。 */
/* 额度与去重。三块不再竖着排成一整条通栏：这一屏没有盘面，块直接铺满
   .ct-main 的全部宽度，额度滑块的「0 … max」刻度被甩到屏幕两端，
   标签在左极、值在右极，中间隔着一整片空白——视线要在两个边缘之间横跳，
   这就是「往两侧挤」的来源。改成两栏，每条滑块的横向旅程减半。
   连发与收尾条目最多（1 开关 + 6 个数），占满整行、组内自己分两列。 */
.ct-budgets{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--ct-v-block);align-items:start;
}
.ct-budgets > .ct-block{min-width:0}
.ct-budgets > .is-wide{
  grid-column:1 / -1;display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--sp-3) var(--sp-6);align-items:start;
}
.ct-budgets > .is-wide > h3,
.ct-budgets > .is-wide > .ct-switch{grid-column:1 / -1}
/* 数字输入框不再吃满整列：数值只有两三位，通栏的底色块让视线来回跑，
   也把「值」和「单位」推成两个互相找不着的东西。定宽 + 单位紧跟，
   读「45 秒」是同一眼的事。 */
.ct-budgets .ct-field input[type="number"]{max-width:150px}
/* 一条额度 = 标题行 + 滑轨 + 两端刻度，三样是同一件东西，所以行内只给 8px；
   真正要拉开的是**条与条**之间，由父级的 gap 给。
   padding 从 4px 提到 8px：滑轨的滑块有 13px 高，4px 的上下留白
   会让相邻两条的滑块几乎贴在一起，拖的时候分不清抓的是哪一条。 */
.ct-quota{display:flex;flex-direction:column;gap:var(--sp-2);padding:var(--sp-2) 0}
.ct-quota-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3)}
.ct-quota-head strong{font-size:var(--fs-body);font-weight:600;color:var(--t-text)}
.ct-quota-value{display:inline-flex;align-items:baseline;gap:3px;flex:none}
.ct-quota-value b{
  font-size:var(--fs-lead);font-weight:650;color:var(--t-text-strong);
  font-variant-numeric:tabular-nums;
}
.ct-quota-value i{font-style:normal;font-size:var(--fs-micro);color:var(--t-text-faint)}
.ct-quota input[type="range"]{
  width:100%;height:18px;margin:0;background:transparent;
  -webkit-appearance:none;appearance:none;cursor:pointer;
}
.ct-quota input[type="range"]::-webkit-slider-runnable-track{
  height:4px;border-radius:var(--r-pill);background:var(--t-surface-sunken);
}
.ct-quota input[type="range"]::-moz-range-track{
  height:4px;border-radius:var(--r-pill);background:var(--t-surface-sunken);
}
.ct-quota input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;margin-top:-var(--sp-1);
  border-radius:50%;background:var(--t-accent-solid);
  border:2px solid var(--t-surface);cursor:grab;
}
.ct-quota input[type="range"]::-moz-range-thumb{
  width:13px;height:13px;border:2px solid var(--t-surface);border-radius:50%;
  background:var(--t-accent-solid);cursor:grab;
}
.ct-quota-scale{
  display:flex;justify-content:space-between;
  font-size:var(--fs-micro);color:var(--t-text-faint);font-variant-numeric:tabular-nums;
}

/* ===== 外部触发源 =====
   这些不是「一天」上的东西，是「素材从哪来」，所以单独一屏。
   每一组是一张卡片：图标 + 组名 + 「n/m 开启」；组内一行一件事，
   标签在左、控件在右，行间一条细线。
   上一版把每个字段竖排堆在卡片里（标签、控件、说明各占一行），
   扫一眼全是左对齐的灰标签，既看不出「这一组开了几项」，
   也读不出「哪一行是哪一项」——控件与标签的距离比行距还远。
   条目多的三组（屏幕与动作、约定与生成上下文、余额与其它）占满整行，
   组内自己分两栏：否则它们会把同行的短卡片拉出一大块空白。
   卡片最小 380px（原来 320）：320 会挤出三列，每张卡里那条天地被压到
   「标签 + 控件」刚好没碰上，眼睛却已经觉得要碰上了——挤的感觉就是这么来的。
   380 稳掉一列，宁可往下多滚半屏，也不要让一堆控件在窄列里互相挤。 */
.ct-sources{
  display:grid;gap:var(--ct-v-block);align-items:start;
  grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));
}
.ct-src-lead{
  grid-column:1 / -1;margin:0 0 2px;font-size:var(--fs-tiny);color:var(--t-text-faint);
  line-height:1.6;font-variant-numeric:tabular-nums;
}
.ct-src-group{
  display:flex;flex-direction:column;gap:var(--sp-3);min-width:0;
  padding:var(--ct-v-block);
  border:1px solid var(--t-line);border-radius:var(--r-md);background:var(--t-surface);
  transition:border-color .18s ease;
}
.ct-src-group:hover{border-color:var(--t-line-firm)}
.ct-src-group.is-wide{grid-column:1 / -1}
.ct-src-rows{display:grid;grid-template-columns:minmax(0,1fr)}
.ct-src-group.is-wide .ct-src-rows{
  grid-template-columns:repeat(2,minmax(0,1fr));column-gap:var(--sp-6);
}
/* 行距给 4px：行本身已有 12px 上下内边距，但间距为 0 时相邻两行的
   hover 底色会粘成一片，看不出刚悬停的是哪一行。4px 只用来断开底色，
   真正的行距仍由行内边距给——再往上加，59 项这一屏会长得没有尽头。 */
.ct-src-col{display:flex;flex-direction:column;gap:var(--sp-1);min-width:0}
.ct-src-head{display:flex;align-items:center;gap:var(--sp-2)}
.ct-src-icon{
  flex:none;display:grid;place-items:center;width:24px;height:24px;
  border-radius:var(--r-xs);background:var(--t-surface-soft);color:var(--t-accent-ink);
}
.ct-src-icon svg{width:14px;height:14px}
.ct-src-head h3{
  flex:1;min-width:0;margin:0;font-size:var(--fs-body);font-weight:650;color:var(--t-text-strong);
}
.ct-src-badge{
  flex:none;font-style:normal;font-size:var(--fs-micro);padding:1px var(--sp-2);border-radius:var(--r-pill);
  background:var(--t-surface-soft);color:var(--t-text-faint);
  font-variant-numeric:tabular-nums;
}
.ct-src-badge.is-on{background:var(--t-accent-quiet);color:var(--t-accent-ink)}
.ct-src-hint{margin:0;font-size:var(--fs-tiny);color:var(--t-text-faint);line-height:1.5}
.ct-src-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
  gap:var(--sp-3);padding:var(--sp-3) var(--sp-2) var(--sp-3) var(--sp-3);border-radius:var(--r-sm);
  min-height:44px;
  transition:background .16s ease;
}
/* 行与行之间不画通栏细线：wide 组内是两个独立分栏，
   两栏行高对不齐，穿行的线会交错成一张破网——「乱」的主要来源就是它。
   分隔交给行距与悬停底色。 */
.ct-src-row:hover{background:var(--t-surface-soft)}
.ct-src-label{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:var(--fs-body);color:var(--t-text)}
.ct-src-label small{font-size:var(--fs-micro);color:var(--t-text-faint);line-height:1.45}
.ct-src-control{display:flex;align-items:center;gap:var(--sp-1);flex:none}
.ct-src-control i{font-style:normal;font-size:var(--fs-micro);color:var(--t-text-faint)}
/* 输入框不再用 sunken 底：浅色主题下它泛绿，一屏几十个框看过去像一块块
   绿斑。改成白底 + 实线描边，靠边界而不是靠色块站住。 */
.ct-src-row input[type="text"],.ct-src-row input[type="number"],.ct-src-row select{
  width:130px;padding:var(--sp-1) var(--sp-2);box-sizing:border-box;
  border:1px solid var(--t-line-firm);border-radius:var(--r-xs);
  background:var(--t-surface-raised);color:var(--t-text);
  font:inherit;font-size:var(--fs-body);
  transition:border-color .16s ease,box-shadow .16s ease;
}
.ct-src-row input[type="text"]:hover,.ct-src-row input[type="number"]:hover,
.ct-src-row select:hover{border-color:var(--t-text-faint)}
.ct-src-row input[type="number"]{width:84px;text-align:right;font-variant-numeric:tabular-nums}
/* 下拉的选项文字比数字长（「不限制（全部转发）」），给宽一点，别把选项截成谜语。 */
.ct-src-row select{width:150px}
.ct-src-row input:focus,.ct-src-row select:focus{
  outline:none;border-color:var(--t-accent);box-shadow:0 0 0 3px var(--t-focus);
}
/* 开关在这套行里只是右侧那一枚轨道，没有文字列，所以去掉行内边距。
   整行都是 label，点哪儿都能切；悬停反馈要给整行，不能只给那 40px 的轨道。 */
.ct-src-row .ct-switch{padding:0;gap:0}
.ct-src-row .ct-switch-track{margin-top:0}
.ct-src-row.is-toggle:hover .ct-switch-track{
  background:color-mix(in srgb,var(--t-text-faint) 48%,var(--t-surface));
}
.ct-src-row.is-toggle.is-on:hover .ct-switch-track{background:var(--t-accent-solid-hover)}

/* ===== 中屏 =====
   1180px 以下右栏放不下两张卡片（每张只剩 260px 左右，数值输入框会挤到
   标签上），于是两张卡片改竖排；盘面仍在左侧。 */
@media (max-width:1180px){
  .ct-controls{grid-template-columns:minmax(0,1fr)}
}

/* ===== 窄屏 =====
   880px 以下：轨道横过来，钟面缩小并取消 sticky，
   控制器单栏。钟面缩到 240px 是因为手机首屏还要看到环心那句话。 */
@media (max-width:880px){

  .ct-rail{
    position:static;flex-direction:row;overflow-x:auto;gap:var(--sp-1);
    padding-bottom:var(--sp-1);scrollbar-width:none;
  }
  .ct-rail::-webkit-scrollbar{display:none}
  .ct-rail::before{display:none}
  .ct-rail button{
    flex:none;flex-direction:column;gap:var(--sp-1);padding:var(--sp-2) var(--sp-2);
    font-size:var(--fs-tiny);text-align:center;min-width:64px;
  }
  .ct-rail-label{overflow:visible;text-overflow:clip;white-space:nowrap;max-width:none}
  .ct-dial-wrap{grid-template-columns:minmax(0,1fr);gap:var(--sp-4)}
  .ct-dial-stage{position:static}
  .ct-dial{max-width:250px;margin:0 auto}
  .ct-center{width:48%;max-width:126px}
  .ct-center-title{font-size:var(--fs-body)}
  .ct-center-detail{font-size:var(--fs-micro)}
  .ct-rest{grid-template-columns:minmax(0,1fr)}
  .ct-tiers{gap:var(--sp-1)}
  .ct-tier{min-width:58px;padding:var(--sp-2) var(--sp-1) var(--sp-2)}
  .ct-tier-label{font-size:var(--fs-tiny)}
  .ct-tier-meta{font-size:var(--fs-micro)}
  .ct-purpose{
    grid-template-columns:minmax(0,1fr) minmax(80px,1fr);
    row-gap:var(--sp-1);
  }
  .ct-purpose-state{grid-column:1 / -1;justify-content:flex-start}
  .ct-sources{grid-template-columns:minmax(0,1fr)}
  .ct-budgets{grid-template-columns:minmax(0,1fr)}
  .ct-budgets > .is-wide{grid-template-columns:minmax(0,1fr)}
  .ct-src-group.is-wide .ct-src-rows{grid-template-columns:minmax(0,1fr)}
  .ct-src-row{grid-template-columns:minmax(0,1fr) minmax(0,140px)}
  .ct-block{padding:var(--sp-3)}
  .ct-head{align-items:flex-start}
  .ct-head-actions{width:100%}
  .ct-head-actions .ct-btn{flex:1;justify-content:center}
  .ct-curve-plot{height:76px}
}

/* ===== 减弱动效 =====
   压时长到瞬时，而不是 animation:none——
   关掉动画会让依赖 transitionend 的逻辑永远不结算。
   入场位移、涟漪、盘面变化、扫描、呼吸点全部归零，信息一条不丢。
   延迟也要一并归零：开页涟漪与问候弧的延迟最长到 ~312ms，
   只压时长的话会先空白一段再「啪」地出现——那不是减弱动效，是闪烁。 */
@media (prefers-reduced-motion:reduce){

  .ct-dial.is-scanning .ct-cursor-dot,.ct-gate,.ct-verdict.is-open .ct-dot,
  .ct-center.is-open::before,.ct-spinner,
  .ct-dial-stage.is-pulse-quiet .ct-quiet path,
  .ct-dial-stage.is-pulse-curve .ct-bar.is-on,

  .ct-dial-stage.is-pulse-greet .ct-insomnia path,
  .ct-dial-stage.is-pulse-cursor .ct-cursor-dot,
  .ct-dial-stage.is-pulse-cursor .ct-cursor-line,
  .ct-dial-stage.is-pulse-center .ct-center,
  .ct-dial-stage.is-pulse-tier .ct-dial,
  .ct-switch.is-flip-on .ct-switch-track,.ct-switch.is-flip-off .ct-switch-track,
  .ct-switch.is-flip-on .ct-switch-track i,.ct-switch.is-flip-off .ct-switch-track i,
  .ct-src-row.is-toggle.is-flip-on .ct-switch-track i,
  .ct-src-row.is-toggle.is-flip-off .ct-switch-track i,
  .ct-src-row.is-flip-on,.ct-src-row.is-flip-off,
  .ct-view.is-from-next,.ct-view.is-from-prev,
  .ct-rail button.is-picked,.ct-rail button.is-picked .ct-rail-icon{
    animation-duration:.001ms !important;
    animation-delay:0s !important;
    animation-iteration-count:1 !important;
  }
  .ct-verdict.is-open .ct-dot,.ct-center.is-open::before{opacity:1;transform:none}
  .ct-bar,.ct-quiet path,.ct-tier,.ct-tier-bar,.ct-btn,.ct-rail button,.ct-rail-icon,
  .ct-switch-track,.ct-switch-track i,.ct-check-box,.ct-weight-fill,.ct-curve-col i,
  .ct-src-group,.ct-src-row{
    transition-duration:.001ms !important;
  }
  .ct-dial.is-entering{opacity:1;transform:none}
  .ct-tier:hover{transform:none}
}
</style>

    }
  }
  /* 配置侧只要 edit_token 与字段契约——值仍旧从 native 那份读，
     两处读出的值必须一致，不一致就说明两端读的不是同一层。 */
  async function loadContract() {
    if (!data.configPath) return;
    const ticket = version;
    try {
      const payload = await api("GET", data.configPath + "?sections=" + encodeURIComponent(GROUP));
      if (!live(ticket)) return;
      const section = payload?.sections?.[GROUP];
      if (!section) return;
      data.configToken = typeof section.edit_token === "string" ? section.edit_token : "";
    } catch (error) {
      if (live(ticket)) notice(error.code ? reason(error.code) : "配置字段契约未读到，保存仍可用。", true);
    }
  }
  /* ---- 写 -------------------------------------------------------------
     只提交 touched 里的字段。edit_token 必须用**刚刚读到的那一份**：
     配置页的令牌与 native 的令牌是两个作用域，不能互相顶替
     （native 那条路由只写 news 六个字段，其余交给 config 段）。 */
  async function save() {
    if (!data.configPath || data.busy || !data.touched.size) return;
    if (!data.ready) { notice("还没有读到当前设置，不能保存。", true); render(); return; }
    if (!data.configToken) { notice("缺少配置令牌，请重新读取后再保存。", true); render(); return; }
    const ticket = version;
    data.busy = true;
    const changes = {};
    for (const name of data.touched) if (name in data.draft) changes[name] = data.draft[name];
    try {
      const payload = await api("POST", data.configPath + "/configure", {
        section:GROUP, operation_key:operationKey(), edit_token:data.configToken, changes});
      if (!live(ticket)) return;
      const status = payload?.status?.sections?.[GROUP];
      if (status) {
        data.editToken = typeof status.edit_token === "string" ? status.edit_token : data.editToken;
        data.configToken = data.editToken;
      }
      data.touched.clear(); data.draft = {}; data.tierDraft = null;
      data.savedAt = Date.now(); data.busy = false;
      notice("已保存 " + Object.keys(changes).length + " 项。改动从下一轮主动评估开始生效。");
      await load();
    } catch (error) {
      if (!live(ticket)) return;
      data.busy = false;
      const code = error.code || "";
      notice(reason(code), true);
      if (code === "proactive_contact_revision_conflict" || code === "proactive_contact_target_changed") {
        data.touched.clear(); data.draft = {}; data.tierDraft = null;
        await load();
      } else if (!code) render();
    }
  }
  /* 幂等键：同一份草稿重复提交沿用同一个键，后端按 operation_key 去重，
     网络重试不会写成两次。键里带 native 路由（每个角色一套），
     所以不同角色不会撞到同一个键上。 */
  let opCounter = 0;
  function operationKey() {
    return STORE + data.nativePath + ":" + (data.savedAt || 0) + ":" + opCounter++;
  }
  function set(name, value) {
    data.draft[name] = value; data.touched.add(name);
    if (name === "proactive_intensity_preset") data.tierDraft = tierOf(value);
    const part = PULSE_PART[name];
    if (part) data.pulse.add(part);
  }
  function resetDraft() { data.touched.clear(); data.draft = {}; data.tierDraft = null; render(); }
  /* 这一帧要不要给这个开关播翻转动画、播哪个方向。
     方向由 flipNow 记述，这里只翻译成类，不改动词义。 */
  function flipClass(name) {
    const flip = data.flipNow;
    if (!flip || flip.name !== name) return "";
    return flip.on ? " is-flip-on" : " is-flip-off";
  }
  function dirty(name) { return data.touched.has(name); }

  /* ---- 此刻 -------------------------------------------------------------
     环心那句话必须与后端同源：能不能开口看 effective，具体卡在哪一条看
     purposes 的 reason。页面不自己推断「现在几点了应该在免打扰里吗」——
     时区在服务端，页面上的时钟是访客的钟，两者经常不是同一个。 */
  function currentMinute() {
    const zone = value("quiet_timezone");
    if (typeof zone !== "string" || !zone.trim()) return null;
    try {
      const parts = new Intl.DateTimeFormat("en-GB", {timeZone:zone, hour:"2-digit", minute:"2-digit",
        hour12:false}).formatToParts(new Date());
      const h = Number(parts.find(p => p.type === "hour")?.value);
      const m = Number(parts.find(p => p.type === "minute")?.value);
      return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : null;
    } catch { return null; }
  }
  function quietSpan() {
    const from = minutes(value("quiet_start")), to = minutes(value("quiet_end"));
    if (from === null || to === null) return null;
    return {from, to};
  }
  function inQuiet(minute) {
    const span = quietSpan();
    if (span === null || !value("quiet_enabled") || minute === null) return false;
    const {from, to} = span;
    return from > to ? (minute >= from || minute < to) : (minute >= from && minute < to);
  }
  function currentWeight(minute) {
    if (!value("proactive_hour_activity_enabled") || minute === null) return null;
    return curveOf(value("proactive_hour_activity_curve"))[Math.floor(minute / 60) % 24];
  }
  /* 环心状态。四档，顺序即优先级：
     后端说不允许 → 看它给的原因；后端说允许但此刻在免打扰 → 说免打扰；
     曲线权重低 → 说节律；否则说可开口。 */
  function verdict() {
    const minute = currentMinute();
    const blocked = data.effective && data.effective.allowed === false;
    if (blocked) {
      const code = data.effective.reason;
      return {tone:"blocked", title:"当前不会开口", detail:reason(code),
        code:code || "", automatic:data.effective.automatic_allowed === false};
    }
    if (inQuiet(minute)) {
      return {tone:"quiet", title:"免打扰中", detail:quietSpanText(),
        code:"proactive_quiet_hours", automatic:data.effective?.automatic_allowed === false};
    }
    const weight = currentWeight(minute);
    if (weight !== null && weight < 0.3) {
      return {tone:"low", title:"节律低谷", detail:"这一小时的活动权重 " + weight.toFixed(2)
        + "，低于 0.30；这条曲线只删格子，不放宽额度。", code:"", automatic:data.effective?.automatic_allowed === false};
    }
    return {tone:"open", title:"此刻可以开口", detail:minute === null
      ? "未设时区，只能按服务端的判定。" : "本地时间 " + hm(minute) + "，不在免打扰内。",
      code:"", automatic:data.effective?.automatic_allowed === false};
  }
  function quietSpanText() {
    const span = quietSpan();
    if (span === null) return "免打扰时段未设完整。";
    return span.from > span.to
      ? hm(span.from) + " 至次日 " + hm(span.to) + " 不打扰"
      : hm(span.from) + " 至 " + hm(span.to) + " 不打扰";
  }

  /* ---- 环的绘制 ---------------------------------------------------------
     四圈半径固定，只有「哪一圈在编辑」会改变描边权重。
     这不是装饰：一天只有 24 格，四圈都画粗了就分不清哪圈是免打扰。 */
  const R = {quiet:132, curve:112, anchor:94, tier:76};
  function dialSVG() {
    const cx = 150, cy = 150, minute = currentMinute();
    const span = quietSpan();
    const live = value("quiet_enabled") && span;
    const weights = curveOf(value("proactive_hour_activity_curve"));
    const curveOn = !!value("proactive_hour_activity_enabled");
    const peak = curveOn ? Math.max(...weights, 0.05) : 1;
    /* 曲线画成 24 个柱子，围成一圈。柱高按峰值归一，但**保留 0.05 的下限高度**，
       否则权重 0.10 的凌晨会看起来是「没有这一格」。
       --i 是「到 0:00 的环形距离」，涟漪与改动波都按它排队：
       波前从正上方出发、两侧同时走，在 12:00 会合——按下标排就只有单向推进。 */
    const bars = weights.map((w, hour) => {
      const ratio = curveOn ? Math.max(0.05, w / peak) : 1;
      const inner = R.curve - 9, outer = R.curve + 9;
      const r = inner + (outer - inner) * ratio;
      const [x1, y1] = point(cx, cy, inner, hour * 60 + 1);
      const [x2, y2] = point(cx, cy, r, hour * 60 + 1);
      const hot = curveOn && w >= peak * 0.75;
      return `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"`
        + ` class="ct-bar${curveOn ? " is-on" : ""}${hot ? " is-peak" : ""}"`
        + ` style="--i:${Math.min(hour, 24 - hour)}" data-hour="${hour}"/>`;
    }).join("");
    /* 三圈十二个刻度：0/6/12/18 写数字，其余只点一下。 */
    const ticks = Array.from({length:24}, (_, hour) => {
      const [x1, y1] = point(cx, cy, R.quiet + 6, hour * 60);
      const [x2, y2] = point(cx, cy, R.quiet + (hour % 6 === 0 ? 14 : 10), hour * 60);
      const major = hour % 6 === 0;
      const label = major ? (() => {
        const [lx, ly] = point(cx, cy, R.quiet + 27, hour * 60);
        return `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" class="ct-tick-label">${hour}</text>`;
      })() : "";
      return `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"`
        + ` class="ct-tick${major ? " is-major" : ""}"/>${label}`;
    }).join("");
    /* 问候窗口：只有**启用每日问候**时才画。
       原先的判据是 `enable_daily_greetings || value("greeting_x_window")`，
       而后端对这九个字段都有默认值，所以右边恒为真——三个窗口在未启用时
       照样画在环上。那是在暗示一个并不存在的时刻：用户会以为早上七点四十五
       会收到问候，而实际上总开关是关的。画不出的东西就不画。 */
    const greetingsOn = value("enable_daily_greetings") === true;
    const anchors = greetingsOn ? ANCHORS.map(([name, , fallbackFrom, fallbackTo], index) => {
      const raw = value("greeting_" + name + "_window");
      const parts = typeof raw === "string" ? raw.split("-") : [];
      const from = minutes(parts[0]) ?? minutes(fallbackFrom);
      const to = minutes(parts[1]) ?? minutes(fallbackTo);
      /* 后端要求窗口当天内结束（不能跨午夜），所以 from > to 是坏值，不画。 */
      if (from === null || to === null || from >= to) return "";
      /* --a 是三条弧的序号：改动波按早/午/晚依次亮起，顺序就是一天的顺序。 */
      return `<g class="ct-anchor" data-anchor="${name}" style="--a:${index}">`
        + `${arc(cx, cy, R.anchor, from, to, 7)}</g>`;
    }).join("") : "";
    const insomnia = value("allow_insomnia_night_message")
      ? `<g class="ct-insomnia" style="--a:3">${arc(cx, cy, R.anchor - 11,
          minutes(value("insomnia_night_start")) ?? 1380, minutes(value("insomnia_night_end")) ?? 360, 3)}</g>` : "";
    /* 游标：一条从环心指出的细线，末端一个小圆。它随真实时间走，
       reduced-motion 下不做扫描动画，只停在当前角度。 */
    const cursor = minute === null ? "" : (() => {
      const [x, y] = point(cx, cy, R.quiet + 16, minute);
      const [ix, iy] = point(cx, cy, 30, minute);
      return `<line class="ct-cursor-line" x1="${ix.toFixed(2)}" y1="${iy.toFixed(2)}"`
        + ` x2="${x.toFixed(2)}" y2="${y.toFixed(2)}"/>`
        + `<circle class="ct-cursor-dot" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="3.6"/>`;
    })();
    return `<svg viewBox="0 0 300 300" class="ct-dial${data.scanning ? " is-scanning" : ""}"
      role="img" aria-label="${e(dialLabel(minute))}" data-role="dial">
      <circle cx="${cx}" cy="${cy}" r="${R.quiet}" class="ct-ring-base"/>
      <g class="ct-quiet${live ? " is-on" : ""}">${live ? arc(cx, cy, R.quiet, span.from, span.to, 10) : ""}</g>
      <g class="ct-bars">${bars}</g>
      ${anchors}${insomnia}${ticks}${cursor}
    </svg>`;
  }
  function dialLabel(minute) {
    return "一天的节律：免打扰" + (value("quiet_enabled") ? quietSpanText() : "未启用")
      + "；活动曲线" + (value("proactive_hour_activity_enabled") ? "已启用" : "未启用")
      + "；当前" + (minute === null ? "未设时区" : hm(minute) + " 时");
  }

  /* ---- 渲染 ------------------------------------------------------------ */
  const VIEWS = [["dial","节律盘",ICON.dial],["purposes","契机矩阵",ICON.seed],
                 ["gates","开口闸门",ICON.gate],["budgets","额度与去重",ICON.quota],
                 ["sources","外部触发源",ICON.source]];
  function headMarkup() {
    const v = verdict();
    const label = VIEWS.find(([id]) => id === data.view)?.[1] || "节律盘";
    const dirtyCount = data.touched.size;
    return `<header class="ct-head">
      <div class="ct-head-main">
        <h2>${e(label)}</h2>
        <span class="ct-verdict is-${v.tone}"><i class="ct-dot"></i>${e(v.title)}</span>
      </div>
      <div class="ct-head-actions">
        ${dirtyCount ? `<button type="button" class="ct-btn" data-action="reset">${ICON.undo}<span>放弃 ${dirtyCount} 项改动</span></button>
          <button type="button" class="ct-btn is-primary" data-action="save"${data.busy ? " disabled" : ""}>${ICON.save}<span>保存</span></button>`
        : `<button type="button" class="ct-btn" data-action="refresh"${data.loading || data.busy ? " disabled" : ""}>${ICON.refresh}<span>重新读取</span></button>`}
      </div>
    </header>`;
  }
  function railMarkup() {
    return `<nav class="ct-rail" aria-label="联系工作台">${VIEWS.map(([id, text, icon]) =>
      `<button type="button" data-view="${id}" aria-pressed="${data.view === id}"`
      + `${data.view === id && data.viewShiftNow ? ' class="is-picked"' : ""}>
        <span class="ct-rail-icon">${icon}</span><span class="ct-rail-label">${e(text)}</span></button>`).join("")}</nav>`;
  }
  function noticeMarkup() {
    if (!data.notice) return "";
    return `<p class="ct-notice${data.error ? " is-error" : ""}" role="status">${data.error ? ICON.alert : ICON.check}`
      + `<span>${e(data.notice)}</span><button type="button" data-action="dismiss" aria-label="关闭">×</button></p>`;
  }
  function emptyMarkup() {
    if (data.loading) return `<div class="ct-empty"><span class="ct-spinner"></span>正在读取联系设置…</div>`;
    if (!data.nativePath) return `<div class="ct-empty">${ICON.alert}<strong>还没有可管理的私聊对象</strong>
      <p>主动联系偏好按「谁和谁的这一段关系」保存。请先在上方选择已初始化的私聊对象与角色。</p></div>`;
    return `<div class="ct-empty">${ICON.alert}<strong>还没有读到设置</strong>
      <p>${e(data.notice || "请重新读取；若反复失败，先在宿主管理中确认 V2 已启动。")}</p>
      <button type="button" class="ct-btn" data-action="refresh">${ICON.refresh}<span>重新读取</span></button></div>`;
  }

  /* 节律盘视图。版式分两层：
     第一行是「盘面 + 三个总开关 + 免打扰」——这几项一改就立刻改变盘面几何，
     放在同一行才能做到「改完不用滚动就看见环变了」。
     下面一层（活动曲线 / 强度档位 / 问候窗口）铺满整页宽：
     它们本来就是「按一天铺开的数据」，24 根柱子要的是横向空间，
     挤进右栏只会把每根柱子压到十来像素。
     控件顺序按「改了会立刻改变环的哪一圈」排，不按字段在注册表里的顺序。 */
  function dialView() {
    const span = quietSpan();
    const tier = TIER_BY_KEY[data.tierDraft || tierOf(value("proactive_intensity_preset"))];
    const v = verdict();
    const interval = Number(value("interval_seconds"));
    const idle = Number(value("idle_seconds"));
    /* 这一帧要闪哪几片盘面。取出来就清空：动效只放一次，
       下一次渲染（哪怕什么都没改）不该重放。 */
    const pulse = data.pulseNow;
    return `<div class="ct-dial-wrap">
      <div class="ct-dial-stage${pulse.map(part => " is-pulse-" + part).join("")}">${dialSVG()}
        <div class="ct-center is-${v.tone}">
          <span class="ct-center-title">${e(v.title)}</span>
          <span class="ct-center-detail">${e(v.detail)}</span>
          ${v.automatic ? `<span class="ct-center-flag">${ICON.alert}后台自动联系未开启</span>` : ""}
        </div>
        ${data.scanning ? `<div class="ct-scan-hint">时间游标按 ${e(value("quiet_timezone") || "未设时区")} 走</div>` : ""}
      </div>
      <div class="ct-controls">
        ${fieldBlock("总开关", [
          toggle("enabled", "允许主动联系", "关闭时下面每一类契机都不会开口。"),
          toggle("automatic_enabled", "后台自动联系", "关闭后只有你自己触发的联系会发出，后台不再自行决定开口。"),
        ])}
        ${fieldBlock("免打扰 · 外圈", [
          toggle("quiet_enabled", "启用免打扰时段", "免打扰只决定「现在不开口」，不改动已登记的日程。"),
          timeRow("quiet_start", "开始", "quiet_end", "结束", span && span.from > span.to ? "跨午夜：" + hm(span.from) + " 至次日 " + hm(span.to) : ""),
          textRow("quiet_timezone", "时区", "Asia/Shanghai", "环上游标与免打扰判定都用这个时区。"),
        ], "is-ring-quiet")}
      </div></div>
    <div class="ct-rest">
      ${fieldBlock("活动曲线 · 次圈", [
        toggle("proactive_hour_activity_enabled", "按小时权重开口", "启用后这条曲线只会删掉落在低谷的格子，不放宽任何额度。"),
        curveEditor(),
      ], "is-wide is-ring-curve")}
      ${fieldBlock("强度档位 · 三圈", [
        tierPicker(tier),
        `<p class="ct-note">档位只缩放下面两个数，不改变权限、额度或投递规则。</p>`,
        numberRow("interval_seconds", "两次联系至少间隔", "秒", 60, 604800,
          interval ? "档位换算后约 " + fmtDuration(Math.max(1, Math.round(interval * tier.interval))) : ""),
        numberRow("idle_seconds", "对话结束后至少等候", "秒", 0, 86400,
          idle !== undefined && Number.isFinite(idle) ? "档位换算后约 " + fmtDuration(Math.max(0, Math.round(idle * tier.idle))) : ""),
      ], "is-ring-tier")}
      ${fieldBlock("问候窗口 · 内圈", [
        toggle("enable_daily_greetings", "启用每日问候", "三个窗口必须当天内结束，不能跨午夜。"),
        ...ANCHORS.map(([name, , from, to]) => textRow("greeting_" + name + "_window",
          {morning:"早间", noon:"午间", evening:"晚间"}[name], from + "-" + to, "形如 " + from + "-" + to)),
        toggle("allow_insomnia_night_message", "允许深夜一条", "深夜窗口显式有界，并按日限额。"),
      ], "is-ring-greet")}
    </div>`;
  }
  function fmtDuration(seconds) {
    if (!Number.isFinite(seconds)) return "—";
    if (seconds < 60) return seconds + " 秒";
    if (seconds < 3600) return (seconds / 60).toFixed(seconds % 60 ? 1 : 0) + " 分钟";
    return (seconds / 3600).toFixed(seconds % 3600 ? 1 : 0) + " 小时";
  }
  /* extra 只用来挂「这一块管哪一圈」的语义类（is-ring-*）与跨栏（is-wide），
     不改变块的内部结构——块里放什么仍由调用方逐个写出，看得见字段名。 */
  function fieldBlock(title, body, extra) {
    return `<section class="ct-block${extra ? " " + extra : ""}"><h3>${e(title)}</h3>${body.join("")}</section>`;
  }
  function toggle(name, label, help) {
    const on = value(name) === true;
    return `<label class="ct-switch${dirty(name) ? " is-dirty" : ""}${flipClass(name)}">
      <input type="checkbox" data-field="${e(name)}"${on ? " checked" : ""}>
      <span class="ct-switch-track"><i></i></span>
      <span class="ct-switch-text"><strong>${e(label)}</strong><small>${e(help)}</small></span></label>`;
  }
  function textRow(name, label, placeholder, help) {
    const current = value(name);
    return `<label class="ct-field${dirty(name) ? " is-dirty" : ""}">
      <span class="ct-field-label">${e(label)}</span>
      <input type="text" data-field="${e(name)}" value="${e(typeof current === "string" ? current : "")}"
        placeholder="${e(placeholder)}" autocomplete="off" spellcheck="false">
      ${help ? `<small class="ct-field-help">${e(help)}</small>` : ""}</label>`;
  }
  function timeRow(nameA, labelA, nameB, labelB, help) {
    const a = value(nameA), b = value(nameB);
    return `<div class="ct-field-pair${dirty(nameA) || dirty(nameB) ? " is-dirty" : ""}">
      <label class="ct-field"><span class="ct-field-label">${e(labelA)}</span>
        <input type="time" data-field="${e(nameA)}" value="${e(typeof a === "string" ? a : "")}"></label>
      <label class="ct-field"><span class="ct-field-label">${e(labelB)}</span>
        <input type="time" data-field="${e(nameB)}" value="${e(typeof b === "string" ? b : "")}"></label>
      ${help ? `<small class="ct-field-help">${e(help)}</small>` : ""}</div>`;
  }
  function numberRow(name, label, unit, min, max, help) {
    const current = value(name);
    return `<label class="ct-field ct-field-number${dirty(name) ? " is-dirty" : ""}">

  /* 契机矩阵视图：15 类契机 × 三列（开关 / 权重 / 暂缓）。
     权重不是数字输入而是**条形**——权重是相对值，绝对值没有意义，
     一列里并排画出来才知道谁是「主要的开口理由」。 */
  function purposesView() {
    const rows = PURPOSE_BUCKETS.map(bucket => {
      const items = bucket.purposes.map(([name, label]) => purposeRow(name, label));
      return `<section class="ct-bucket"><header>

    const allowed = ALL_PURPOSES.filter(([name]) => data.purposes[name]?.allowed).length;
    return `<div class="ct-purposes">
      <div class="ct-purposes-sum">${ALL_PURPOSES.length} 类契机中 <strong>${allowed}</strong> 类此刻可开口</div>
      ${rows}</div>`;
  }
  function purposeRow(name, label) {
    const info = data.purposes[name] || {};
    const enabled = value(name + ".enabled") !== false;
    const weight = Number(value(name + ".weight"));
    const paused = typeof value(name + ".pause_until") === "string" && value(name + ".pause_until");
    const blocked = info.allowed === false;
    const scale = Math.max(0, Math.min(5, Number.isFinite(weight) ? weight : 1));
    return `<article class="ct-purpose${blocked ? " is-blocked" : ""}${enabled ? " is-on" : ""}"
      data-purpose="${e(name)}">
      <label class="ct-check">
        <input type="checkbox" data-field="${e(name)}.enabled"${enabled ? " checked" : ""}>
        <span class="ct-check-box">${ICON.check}</span>
        <span class="ct-purpose-name">${e(info.label || label)}</span></label>
      <div class="ct-weight" title="相对权重 ${Number.isFinite(weight) ? weight.toFixed(2) : "—"}">
        <input type="range" min="0.1" max="5" step="0.1" data-field="${e(name)}.weight"
          value="${Number.isFinite(weight) ? weight : 1}" aria-label="${e(label)} 相对权重">
        <span class="ct-weight-fill" style="--w:${(scale / 5) * 100}%"></span>
        <em>${Number.isFinite(weight) ? weight.toFixed(1) : "—"}</em>
      </div>
      <div class="ct-purpose-state">
        ${blocked
          ? `<span class="ct-chip is-risk" title="${e(reason(info.reason))}">${e(shortReason(info.reason))}</span>`
          : paused ? `<span class="ct-chip is-paused">暂缓至 ${e(paused.slice(0, 16).replace("T", " "))}</span>`
          : enabled ? `<span class="ct-chip is-ok">可开口</span>`
          : `<span class="ct-chip">已关闭</span>`}
      </div>
    </article>`;
  }
  function shortReason(code) {
    if (!code) return "受阻";
    const text = reason(code);
    return text.length > 14 ? text.slice(0, 13) + "…" : text;
  }

    return `<div class="ct-gates">

        <span class="ct-gate-state">${g.ok ? "开" : "关"}</span></article>`).join("")}

            value="${e(datetimeLocal(value("pause_until")))}">
          <small class="ct-field-help">暂停按层继承：本层清空后，角色层或关系层的暂停才会重新生效。</small></label>

          <span class="ct-field-label">补充联系偏好</span>
          <textarea data-field="note" rows="3" placeholder="只是写进提示词的材料，不改变权限、频率或去重">${e(value("note") || "")}</textarea></label>
      </section></div>`;
  }
  /* datetime-local 只吃本地无时区的串；后端要的是带偏移的 UTC。
     这里的转换只为了display正确，提交前统一走 toIso。 */
  function datetimeLocal(value) {
    if (typeof value !== "string" || !value) return "";
    const at = new Date(value);
    if (!Number.isFinite(at.getTime())) return "";
    const pad = n => String(n).padStart(2, "0");
    return at.getFullYear() + "-" + pad(at.getMonth() + 1) + "-" + pad(at.getDate())
      + "T" + pad(at.getHours()) + ":" + pad(at.getMinutes());
  }
  function toIso(local) {
    if (typeof local !== "string" || !local) return "";
    const at = new Date(local);
    return Number.isFinite(at.getTime()) ? at.toISOString() : "";
  }
